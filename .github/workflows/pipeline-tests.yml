# Runs the pipeline's tests (tests/test_pipeline.py) when the pipeline or its tests change. The
# pipeline runs locally; this only guards its pure parts (track formats, matching, surfaces, water,
# climate averages), with no downloads.
name: Pipeline tests

on:
  push:
    paths: ["pipeline/**", "tests/**", "requirements.txt", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["pipeline/**", "tests/**", "requirements.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to the commit of their release tag (a moved tag can't change what runs here)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
