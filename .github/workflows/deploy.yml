# Builds the site and deploys it to GitHub Pages (huckepack.me) on every push to main.
# The build only reads committed files (data/trails, data/derived, public/); it never downloads.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the operator's personal details for the legal pages, from the repository's Actions secrets,
      # so they never appear in the (public) repository; see src/lib/operator.ts
      - run: npm run build
        env:
          LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
          LEGAL_STREET: ${{ secrets.LEGAL_STREET }}
          LEGAL_CITY: ${{ secrets.LEGAL_CITY }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
