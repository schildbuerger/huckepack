# Builds the site and deploys it to GitHub Pages (huckepack.me) on every push to main.
# The build only reads committed files (data/trails, data/derived, public/); it never downloads.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to the commit of their release tag (a moved tag can't change what runs here)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # types and templates checked before anything is built (astro check)
      - run: npm run check
      # the operator's personal details for the legal pages, from the repository's Actions secrets,
      # so they never appear in the (public) repository; see src/lib/operator.ts
      - run: npm run build
        env:
          LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
          LEGAL_STREET: ${{ secrets.LEGAL_STREET }}
          LEGAL_CITY: ${{ secrets.LEGAL_CITY }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
