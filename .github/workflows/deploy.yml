# Builds the site and deploys it to GitHub Pages (huckepack.me) on every push to main.
# The build only reads committed files (data/trails, data/derived, public/); it never downloads.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to the commit of their release tag (a moved tag can't change what runs here)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the full history: the sitemap dates each page by its last commit (src/pages/sitemap.xml.ts)
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # types and templates checked before anything is built (astro check)
      - run: npm run check
      # the figures the site derives (tests/trails.test.ts)
      - run: npm test
      # the operator's personal details for the legal pages, from the repository's Actions secrets,
      # so they never appear in the (public) repository; see src/lib/operator.ts
      - run: npm run build
        env:
          LEGAL_NAME: ${{ secrets.LEGAL_NAME }}
          LEGAL_STREET: ${{ secrets.LEGAL_STREET }}
          LEGAL_CITY: ${{ secrets.LEGAL_CITY }}
          LEGAL_EMAIL: ${{ secrets.LEGAL_EMAIL }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
