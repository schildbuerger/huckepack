route:
  # built by `python -m pipeline.all sauerland-waldroute`: OSM ways matched to the stage lines
  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T1
    basis: >-
      The site rates every stage "Mittel" and recommends "Festes Schuhwerk und wetterfeste
      Kleidung"; forest paths and tracks through low wooded hills, waymarked throughout, no steep
      or exposed passages described (German Wikipedia: "leicht"). That is hiking on good paths (T1).
    source: swr
season:
  # the stage pages' "Empfohlene Jahreszeiten": every main stage recommends March to October; most
  # also the winter months, stage 5 (Arnsberg – Möhnesee) only March to October
  months: [3, 4, 5, 6, 7, 8, 9, 10]
  text: March to October
  source: swr
sleeping:
  # hosts along the route ("Unterkünfte buchen", the SGV-Jugendhof and the Waldhaus
  # Föckinghausen), and four bookable trekking sites on the trail
  types: [hotel, guesthouse, campsite]
  source: swr
wildCamping:
  status: restricted
  rule: >-
    In North Rhine-Westphalia camping in the forest is forbidden (Landesforstgesetz § 3). Tents at
    the trail's four bookable trekking sites: am SGV-Jugendhof and am Lattenberg (Arnsberg),
    Himmelsnah (Brilon-Petersborn) and Buttenberg (Südroute).
  source: lfog-nrw
access:
  # Iserlohn station near the start (the site's "Iserlohner Wanderbahnhof"), Dortmund Airport near
  # the start, Paderborn/Lippstadt Airport nearest the end in Marsberg. Coordinates from OSM;
  # distances by pipeline/access.py
  - kind: station
    name: Iserlohn station
    lat: 51.37329
    lon: 7.69136
    source: osm
  - kind: airport
    name: Dortmund Airport (DTM)
    lat: 51.5164
    lon: 7.61277
    source: osm
  - kind: airport
    name: Paderborn/Lippstadt Airport (PAD)
    lat: 51.6146
    lon: 8.61906
    source: osm
tags: [sauerland, forests, lakes, caves, legends]
notes:
  - >-
    Layout: from Iserlohn to the Bilsteintal near Warstein (stages 1–8), then a loop: the
    Nordroute to Marsberg (9–13) and the Südroute back from Marsberg to the Bilsteintal (14–19).
    The site lists 19 stages over "über 240 km" (the whole loop; the stages add up to 247.1 km);
    the flyer counts 13 from Iserlohn to Marsberg, the Südroute an "Alternative Route". The record
    follows the flyer: main route 1–13 via the Nordroute (168.3 km), the Südroute (78.8 km) a
    variant. The length shown is the stated 240 km, as on the Goldsteig.
  - >-
    Stage 2 (Stephanopeler Tal – Volkringhausen) has no page on the site (its link leads to the
    home page); the flyer gives 12.4 km, 269 m up, 367 m down, and no time, so the page estimates
    it (DIN 33466). The flyer (2016) also lists the other stages; most agree with the site within
    10 %, except climbs on stages 4–6 and 13 (e.g. stage 5 246 / 245 m against 171 / 166 m) and on
    the Südroute's stage 14 (24.8 km, 770 / 658 m against 22.3 km, 508 / 429 m) and 17 (15.8
    against 17.7 km): the site's figures are newer and kept.
  - >-
    Route (pipeline, 2026-10-31, Geofabrik extracts): the stage pages' map lines guide the matcher;
    stage 2 follows OSM's relation 18268527 (Iserlohn – Warstein), cut at stage 3's start. All
    stages match at least 96 %, except stage 11 (Bibertal – Ringelstein, 93 %: OSM lacks a short
    path there); the main route is 168.7 km against the stated 168.3 km. Stage 5 comes out at
    13.3 km against the stated 11.5 km: the stage page's own line is 13.6 km. On the Südroute's
    stage 17 the line crosses the Ruhr at Bestwig where OSM has no way (it maps the driveway
    there as removed, way 39441577); the matcher bridges two gaps of 24 and 56 m there. The
    site's current notices name forest work between Bestwig and Föckinghausen, no closure.
  - >-
    Ascent: no stated total; the main stages add up to 3,671 m up. The terrain model gives about
    5,340 m (it measures the treetops; 83 % of the route is forest).
  - >-
    Water: OSM has 10 drinking water points along the main route; the longest stretch without one
    is 49.9 km, the end of the Nordroute (km 118.8–168.7, Kallenhardt to Marsberg). The site names
    inns and stage towns, no water points.
  - >-
    Tree line: none in reach. The main route tops out at about 544 m (terrain model, in the Balver
    Wald), the Südroute at the Lörmecke-Turm (580.9 m); the Sauerland's hills are forested to the
    top and have no natural tree line.
  - >-
    Data check (2026-10-31). Second source: German Wikipedia (240 km, Iserlohn near the
    Parktheater, opened 17 May 2008, the white W on green, highest point the Lörmecke-Turm 580.9 m,
    lowest Arnsberg-Gierskämpen about 182 m, "leicht", "ganzjährig", 16 stages of 5.4–21.7 km, no
    stage list). Agree: length 240 km, start, opening year, waymark, lowest point (182 m on the
    terrain model too). Wikipedia's end is Warstein, where the loop begins; the site and flyer end
    in Marsberg. The highest point lies on the Südroute (stage 19 page: 573 m). Over 10 % apart:
    the stage count (13 against 16) and the season (Wikipedia all year; the stage pages recommend
    March to October on every main stage, most stages all year), see dataCheck. No independent
    source gives stage figures; the built page's stage table was checked against the site and the
    flyer.
dataCheck:
  # working rule 2: German Wikipedia; stage figures against the built page (no second source)
  date: 2026-10-31
  against: [wikipedia]
  pageAgainst: [swr, swr-flyer]
  deviations:
    - { figure: "Stages (days)", ours: "13", theirs: "16", source: wikipedia }
    - { figure: "Season", ours: "March to October", theirs: "all year", source: wikipedia }
