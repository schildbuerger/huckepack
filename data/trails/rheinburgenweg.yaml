    - { number: "7", kind: main, from: Koblenz, to: Rhens, km: 13.2, minutes: 330, relation: 2142171 }
    - { number: "8", kind: main, from: Rhens, to: Bad Salzig, km: 15.9, minutes: 240, relation: 2404563 }
