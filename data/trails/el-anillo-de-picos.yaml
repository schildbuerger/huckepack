    source: anillo-itinerarios
waymarking:
  # "el itinerario no dispone siempre de señalización especial. Aunque si se encuentra, en su mayor
  # parte, marcas de pintura señalando algún PR y hitos"
  text: No waymarks of its own; mostly the paint marks of local PR paths and cairns, so carry the map
  source: anillo-consejos
stages:
