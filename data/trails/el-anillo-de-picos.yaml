  # comenzar desde cualquiera de los refugios y hacer en la dirección que se prefiera"
  start:
    name: Refugio de Vega de Ario
    lat: 43.24293
    lon: -4.92309
  end:
    name: Refugio de Vega de Ario
    lat: 43.24293
    lon: -4.92309
  source: osm
length:
  # the home page: "115 km, 3 massif, 9 shelters"; the comparison table: 110 km for the 3 Macizos
  - km: 115
