  pageAgainst: [foot-reports, foot-shelters, usfs-camping]
  deviations:
    - { figure: wild camping, ours: "Dispersed camping anywhere in the national forest outside developed sites (Forest Service)", theirs: "Camping allowed along the trail except in the designated wilderness areas", source: eoa }
