  # Norwich Airport. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Thetford
    lat: 52.41916
    lon: 0.74528
    source: osm
  - kind: station
    name: Norwich
    lat: 52.62631
    lon: 1.30769
    source: osm
  - kind: station
    name: Great Yarmouth
    lat: 52.61192
    lon: 1.72069
    source: osm
  - kind: airport
    name: Norwich Airport (NWI)
    lat: 52.67518
    lon: 1.28189
    source: osm
animals:
  # Cattle (the Countryside Code, HSE) and ticks (NHS). Levels ours
  list:
    - kind: cattle
      name: "Cattle"
      level: moderate
      basis: "The trail crosses farmland, heath and grazing marshes where cattle graze; the Health and Safety Executive names cows with calves and walkers with dogs as the two most common factors in incidents between cattle and the public."
      do:
        - "Give livestock plenty of space: their behaviour can be unpredictable, especially when they are with their young"
        - "Keep your dog on a lead around livestock"
        - "Let your dog off the lead if you feel threatened by livestock: releasing it makes it easier for you both to reach safety"
        - "Follow the farmer's directions when animals are being moved or gathered"
      dont:
        - "Risk getting hurt protecting your dog"
        - "Feed livestock"
      source: countryside-code
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that can carry Lyme disease live all over the UK, in woods and long grass, as on the Brecks' heaths and forest edges along the Peddars Way."
      do:
        - "Cover your skin while walking and tuck your trousers into your socks"
        - "Use insect repellent on your clothes and skin; products containing DEET are best"
        - "Stay on clear paths whenever possible"
        - "Wear light-coloured clothing so ticks are easier to see and brush off"
        - "Remove a tick with fine-tipped tweezers or a tick-removal tool: grasp it as close to the skin as possible, pull slowly upwards, then clean the bite"
        - "Get an urgent GP appointment or call NHS 111 if, within 3 months of a bite, you feel unwell with flu-like symptoms or a round or oval rash appears"
      dont:
        - "Squeeze or crush the tick when you remove it"
      source: nhs-lyme
tags: [national-trail, roman-road, coast, saltmarsh, beaches, heathland]
notes:
  - >-
    Length: none in the record. The figures National Trails and GOV.UK state cover other stretches:
    "158 miles (254km) combined" (the Peddars Way's 74 km and the whole coast path's 180 km from
    the Lincolnshire border), the Route Description's "129.5 miles (208 Km)" (the trail before its
    extensions east of Cromer), and English Wikipedia's 133 miles (214 km). The page sums the
    stages: north along the Peddars Way, then east along the coast to Hopton-on-Sea.
  - >-
    Days: none in the record. GOV.UK's "Peddars Way – around 4 days, Norfolk Coast Path – around
    10 days, both trails – around 14 days in total" includes the coast path's westward arm to the
    Lincolnshire border (48.4 km), which this route leaves out, and National Trails' "about 4 days
    to walk the Peddars Way, and about another 7 if you head east" stops short of the extensions
    to Hopton-on-Sea; the page counts one day per stage (13).
  - >-
    Stages: the sections as National Trails and GOV.UK list them. The coast path's westward arm
    from Holme next the Sea through Hunstanton and King's Lynn to the Lincolnshire border (30.1
    miles, 48.4 km, part of the King Charles III England Coast Path) is not in the record; stage 5's
    25.9 km is "Holme next the Sea (and Hunstanton) to Burnham Overy Staithe". Neither list has a
    section from Happisburgh to Sea Palling, though the coast path runs on between them (extended
    to Sea Palling in December 2014, English Wikipedia): stage 11's length is measured on our map
    line (huckepack-measured). Stage numbers are ours, in the order of the lists.
  - >-
    Map line (2026-11-05): the Suffolk and Norfolk Geofabrik extracts (2026-11-03); every stage at
    least 95 % matched (stage 10, Mundesley to Happisburgh, 95 %: the path along the eroding cliffs
    near Bacton and Walcott is mapped up to 160 m from the relation's line); three short gaps of
    17–30 m between OSM ways bridged on stage 1. The main route measures 206.1 km on the map line
    against 218.9 km for the stated sections. Stages more than 10 % off the map line: 4 (10.0 km
    against 14.3 km) and 5 (21.6 km against 25.9 km) both count the 4 km between Holme next the Sea
    and Hunstanton ("Sedgeford to Holme/Hunstanton", "Holme next the Sea (and Hunstanton) to Burnham
    Overy Staithe"; National Trails' GPX measures Hunstanton to Holme at 4.0 km, so 10.0 + 4.0 and
    21.6 + 4.0 match), while the map line runs from the Peddars Way's end at Holme; 8, Weybourne to
    Cromer (11.6 km against 13.8 km), measures 11.7 km on National Trails' own GPX too, and the
    record keeps the official figure; 11 is our own measure (6.9 km). Highest point 92 m (terrain
    model, GEDTM30, 2026-11-07; on the Peddars Way in the Brecks at km 50), lowest 0 m on the
    beaches. Water: 19 drinking-water points in OSM; the longest stretch without, 32.3 km (km 42–74,
    Castle Acre to Sedgeford along the Peddars Way's remote northern part), where the trail passes
    no village. Resupply: 108 shops, the longest stretch without 34.3 km from the start.
  - >-
    Data check (2026-11-05, working rule 2): against English Wikipedia (Peddars Way, Norfolk Coast
    Path). Peddars Way 74 km (Wikipedia) against our map line from Knettishall Heath to Holme, 74.7
    km (stages 1–4; stated 78.8 km including the way to Hunstanton); the coast path Hunstanton to
    Hopton-on-Sea 133.5 km (Wikipedia) against our map line from Holme, 131.7 km, plus 4.0 km from
    Hunstanton (135.7 km, 2 % apart); the start at Knettishall Heath and the end at Hopton-on-Sea
    agree; the season (all year) agrees; the waymarks (acorn discs, signposts) agree; the 2014 and
    2016 extensions to Sea Palling and Hopton-on-Sea explain the missing Happisburgh–Sea Palling
    section in the older lists. GOV.UK repeats National Trails' sections (both Natural England's),
    so it is no independent check of them. No figure differs by more than 10 %.
  - >-
    Tree line: none; the route stays below 100 m (English Wikipedia: Beeston Bump, 63 m, the coast
    path's highest point).
