  # and the coast path's end at Hopton-on-Sea by the Suffolk border (GOV.UK)
  start:
    name: Knettishall Heath
    lat: 52.39054
    lon: 0.85484
  end:
    name: Hopton-on-Sea
    lat: 52.53936
    lon: 1.72891
  source: govuk
waymarking:
  text: The National Trail acorn, or the trail's name, on stiles, gates and signposts; on the coast also signs for the King Charles III England Coast Path
  source: govuk
stages:
