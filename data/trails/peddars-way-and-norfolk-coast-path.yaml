  # map line. Stages 1–4 follow National Trails' GPX (its first track, the Peddars Way), cut at each
  # section's `end` (it only guides the OSM matcher, kept local); stages 5–13 follow the OSM
  # relation of the Norfolk Coast Path (77959), cut at their ends
  source: nt
