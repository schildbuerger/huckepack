  # (homologated by the Balearic mountain federation for FEDME, renewed 24 June 2025)
  - name: Consell Insular de Menorca
    url: https://www.camidecavalls.com/
trailType: loop
continents: [Europe]
countries: [ES]
regions: [Balearic Islands, Menorca]
protectedAreas:
