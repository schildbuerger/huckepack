  # Manchester Airport. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Manchester Piccadilly
    lat: 53.47742
    lon: -2.23083
    source: osm
  - kind: airport
    name: Manchester Airport (MAN)
    lat: 53.35034
    lon: -2.28037
    source: osm
animals:
  # Cattle (the Countryside Code, HSE) and ticks (NHS). Levels ours
  list:
    - kind: cattle
      name: "Cattle"
      level: moderate
      basis: "The path crosses fields where cattle graze; the Health and Safety Executive names cows with calves and walkers with dogs as the two most common factors in incidents between cattle and the public."
      do:
        - "Give livestock plenty of space: their behaviour can be unpredictable, especially when they are with their young"
        - "Keep your dog on a lead around livestock"
        - "Let your dog off the lead if you feel threatened by livestock: releasing it makes it easier for you both to reach safety"
        - "Follow the farmer's directions when animals are being moved or gathered"
      dont:
        - "Risk getting hurt protecting your dog"
        - "Feed livestock"
      source: countryside-code
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that can carry Lyme disease live all over the UK, in woods and long grass; the NHS names grassy and wooded areas in southern England and the Scottish Highlands as high-risk areas."
      do:
        - "Cover your skin while walking and tuck your trousers into your socks"
        - "Use insect repellent on your clothes and skin; products containing DEET are best"
        - "Stay on clear paths whenever possible"
        - "Wear light-coloured clothing so ticks are easier to see and brush off"
        - "Remove a tick with fine-tipped tweezers or a tick-removal tool: grasp it as close to the skin as possible, pull slowly upwards, then clean the bite"
        - "Get an urgent GP appointment or call NHS 111 if, within 3 months of a bite, you feel unwell with flu-like symptoms or a round or oval rash appears"
      dont:
        - "Squeeze or crush the tick when you remove it"
      source: nhs-lyme
tags: [moorland, uplands, national-park, national-trail]
notes:
  - >-
    The trail runs up the Pennines, the backbone of England: from Edale over Kinder Scout and
    Bleaklow, across the gritstone moors of the South Pennines, through the Yorkshire Dales by Malham
    Cove, Pen-y-ghent and Great Shunner Fell to Tan Hill, along the Tees by High Force and Cauldron
    Snout to High Cup and Dufton, over Cross Fell (893 m) to Alston, along Hadrian's Wall near
    Greenhead, through Wark Forest and the Cheviot Hills on the border to Kirk Yetholm in Scotland.
  - >-
    Length: the stated 268 miles (431 km) include loops and alternatives (the Bowes Loop between
    Tan Hill and Middleton-in-Teesdale); the sixteen sections sum to 409 km. Section 15 ends on Windy
    Gyle, a summit on the border with no amenities, as gov.uk's example has it. Byrness to Kirk
    Yetholm crosses a military training area. Tree line: none recorded, the route stays below 900 m.
  - >-
    Map line: the National Trail's GPX (its first track) guides the OSM matcher, cut at the section
    ends; 417.4 km. Sections 12 (94 %), 14 (91 %) and 15 (94 %) are under 95 % matched: in Wark
    Forest and the Kielder forests and on the Cheviot border fence the GPX and OSM's paths part by
    up to 260 m; the map follows OSM. gov.uk's example sections are rounded: sections 2 (20.4 km on
    the map line against 18), 3 (20.7 against 18), 9 (32.5 against 27) and 15 (18.7 against 22)
    differ by more than 10 %; the page keeps gov.uk's figures. Highest point 891 m (terrain model,
    GEDTM30, 2026-11-07) on Cross Fell. OSM maps no shop for the first 66 km (Edale to the Calder
    Valley, off-route villages aside) and no tap or bed on the last 38–44 km over the Cheviots.
  - >-
    Data check (2026-11-03): gov.uk's figures against English Wikipedia: length 268 miles (431 km)
    against 268 miles, opened 1965, highest point Cross Fell 893 m, Edale to Kirk Yetholm: all
    agree. Wikipedia gives no section figures. No deviation over 10 %.
