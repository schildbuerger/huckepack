route:
  # built by `python -m pipeline.all goldsteig`: OSM ways matched to the Goldsteig stage relations
  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T2
    basis: >-
      Tourismusverband Ostbayern rates the stages "leicht" to "schwer", N16 (Großer Falkenstein –
      Rachel, 26 km) "sehr schwer"; the Nordroute is the "Gipfelroute" over the Bavarian Forest's
      summits (Großer Arber 1,456 m, Rachel, Lusen), the Südroute "gemäßigter", and snow can lie
      on the heights until June. That is mountain hiking on good paths (T2), with length and
      climbing the main difficulty.
    source: gs
season:
  # the FAQ: "kein offizieller Winterwanderweg, sondern für die restliche Zeit des Jahres
  # konzipiert", snow on the heights of the Bavarian Forest "bis zum Juni"; the trekking sites
  # open April to October
  months: [5, 6, 7, 8, 9, 10]
  text: Spring to autumn, not a winter trail; snow can lie on the heights into June
  source: gs
sleeping:
  # hosts by stage (hotels, guesthouses), mountain huts and inns, youth hostels, campsites and
  # the bookable trekking sites
  types: [hotel, guesthouse, hut, hostel, campsite]
  source: gs
wildCamping:
  status: restricted
  rule: >-
    Wild camping only with the landowner's consent. Tents at the bookable Goldsteig trekking
    sites near the trail (April to October, one night each, about €15 per tent, a dry toilet),
    one of them in the Bavarian Forest National Park, and at campsites; hosts often allow a tent
    by their house.
  source: gs
