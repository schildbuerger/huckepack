  - kind: airport
    name: Munich Airport (MUC)
    lat: 48.35396
    lon: 11.77859
    source: osm
tags: [bavarian-forest, national-park, summits, granite, cross-border]
notes:
  - >-
    Lengths: "Gesamtlänge 660 km" for both routes; the stage pages give rounded lengths and times
    only: stages 1–7 add up to 125.2 km, the Nordroute N8–N23 to 292.5 km, the Südroute S8–S22 to
    249.3 km (with 1–7: 417.7 and 374.5 km). No climbs are published, so the page estimates them
    from the terrain model. The site's GPX downloads (whole routes, stages in the tour planner)
    aren't used: the map line follows OSM's stage relations, the same official stages.
  - >-
    Route (pipeline, 2026-10-31, Geofabrik extracts, with the Czech and Austrian ones where the
    Nordroute runs along the border at the Dreisessel): every stage fully matched to its OSM
    relation; the main route (1–7, N8–N23) is 412.5 km against the stages' 417.7 km. Four Südroute
    stages come out more than 10 % shorter than the site's rounded figures: S16 8.3 against 10 km,
    S17 17.8 against 22, S21 11.8 against 16 and S22 11.5 against 15 km. OSM's S21 relation ends at
    Fischhaus and S22 begins at Ruderting, with the 4 km between them mapped as a Zuweg (Nr. 34),
    so part of the gap is OSM's split; the rest isn't resolved. The Südroute is a variant, so its
    lengths don't feed the page's main figures.
  - >-
    Water: 50 drinking water points from OSM; the longest stretch without one is 69.7 km (km
    71.9–141.6, stages 4–7 in the Oberpfälzer Wald, villages with inns on the way but no mapped
    taps): carry water or ask at the inns.
  - >-
    Data check (2026-10-31). Second source: German Wikipedia (660 km, opened September 2007,
    managed by the Tourismusverband Ostbayern, Marktredwitz to Passau, the Nordroute 291 km and
    the Südroute 253 km, highest point the Großer Arber 1,456 m, "leicht – mittel"). Everything
    comparable agrees within 10 %: the Nordroute's stages add up to 292.5 km, the Südroute's to
    249.3 km, stages 1–7 and both routes together 667 against 660 km; highest point on the terrain model
    1,442 m. Wikipedia gives no stage list, days or climbs.
  - >-
    Sleeping: the Waldschmidthaus on the Rachel (stage N16/N17) is closed for renovation until
    about the end of 2026 (the FAQ suggests national park tours instead).
  - >-
    Tree line: no published figure for the Bavarian Forest was found. The Großer Arber (1,456 m,
    stage N13/N14) is called the only summit of the Bavarian-Bohemian massif reaching the forest
    line, with dwarf pine and grassland on top, but other sources put the bare summit down to
    clearing and grazing; so the record has no treeLine and the chart draws none.
