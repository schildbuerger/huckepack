    - { number: "11", kind: main, from: Kinding, to: Beilngries, km: 19.3, end: { name: Beilngries, lat: 49.03516, lon: 11.47383 } }
    - { number: "12", kind: main, from: Beilngries, to: Dietfurt, km: 10.0, end: { name: Dietfurt, lat: 49.03496, lon: 11.58765 } }
    - { number: "13", kind: main, from: Dietfurt, to: Riedenburg, km: 24.7, end: { name: Riedenburg, lat: 48.96228, lon: 11.6836 } }
