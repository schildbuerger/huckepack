managedBy:
  # the Naturpark Altmühltal (its tourist association); a Top Trail of Germany and a Qualitätsweg
  # Wanderbares Deutschland
  - name: Naturpark Altmühltal
    url: https://www.naturpark-altmuehltal.de/wandern/altmuehltal-panoramaweg/
officialGpx:
  # the trail page offers the whole route's GPX ("gpx.php?weg=149")
  url: https://www.naturpark-altmuehltal.de/wandern/wanderwege/altmuehltal-panoramaweg-149/
  by: Naturpark Altmühltal
  source: amp-route
trailType: point-to-point
continents: [Europe]
countries: [DE]
regions: [Bavaria]
protectedAreas: [Altmühltal Nature Park]
termini:
  # "von Gunzenhausen nach Kelheim" (coordinates from OSM)
  start:
    name: Gunzenhausen
    lat: 49.11471
    lon: 10.75459
  end:
    name: Kelheim
    lat: 48.91849
    lon: 11.87228
  source: amp-route
length:
  # "entlang der 200 Kilometer langen Strecke"
  - km: 200
