    - { number: "8", kind: main, from: Buttington Bridge, to: Llanymynech, km: 17, track: "https://nationaltrails.s3.eu-west-2.amazonaws.com/uploads/ODP_loops_elev.gpx", end: { name: Llanymynech, lat: 52.78061, lon: -3.08833 } }
    - { number: "9", kind: main, from: Llanymynech, to: Chirk Mill, km: 22.5, track: "https://nationaltrails.s3.eu-west-2.amazonaws.com/uploads/ODP_loops_elev.gpx", end: { name: Chirk Mill, lat: 52.93426, lon: -3.10674 } }
    - { number: "10", kind: main, from: Chirk Mill, to: Llandegla, km: 25.7, track: "https://nationaltrails.s3.eu-west-2.amazonaws.com/uploads/ODP_loops_elev.gpx", end: { name: Llandegla, lat: 53.06345, lon: -3.20132 } }
