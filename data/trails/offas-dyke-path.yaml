  source: nt-gpx
trailType: point-to-point
continents: [Europe]
countries: [GB]
regions: [Monmouthshire, Gloucestershire, Herefordshire, Powys, Shropshire, Wrexham, Denbighshire, Flintshire]
protectedAreas:
  - Wye Valley National Landscape
  - Bannau Brycheiniog National Park
  - Shropshire Hills National Landscape
  - Clwydian Range and Dee Valley National Landscape
termini:
  # Sedbury Cliffs on the Severn estuary; the Dyke's end sculpture on Prestatyn's beach (OSM)
  start:
    name: Sedbury Cliffs
    lat: 51.63473
    lon: -2.64342
  end:
    name: Prestatyn
    lat: 53.3421
    lon: -3.41221
  source: osm
established:
  # "opened in the summer of 1971"
  year: 1971
  source: nt
waymarking:
  text: The National Trail acorn
  source: nt
length:
  # "a 177 mile (285 Km) long walking trail"
  - km: 285
    source: nt
ascent:
  # "about 28,000ft of accent [sic]" walking south to north; no descent stated
  - m: 8534
    source: nt
days:
  # "It takes about two weeks to complete the whole Trail"
  min: 14
  max: 14
  source: nt
stages:
