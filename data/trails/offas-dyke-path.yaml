    - { number: "2", kind: main, from: Monmouth, to: Pandy, km: 27, track: "https://nationaltrails.s3.eu-west-2.amazonaws.com/uploads/ODP_loops_elev.gpx", end: { name: Pandy, lat: 51.89405, lon: -2.96689 } }
