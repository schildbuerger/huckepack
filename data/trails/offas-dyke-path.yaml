    - { number: "5", kind: main, from: Kington, to: Knighton, km: 21.7, track: "https://nationaltrails.s3.eu-west-2.amazonaws.com/uploads/ODP_loops_elev.gpx", end: { name: Knighton, lat: 52.34435, lon: -3.04956 } }
