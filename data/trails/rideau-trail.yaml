name: Rideau Trail
added: 2026-11-07
website: https://www.rideautrail.org/
wikidata: Q7332581
managedBy:
  # "a charitable, volunteer-run organization" that "stewards over 40 trails that span over 450 km.
  # The main trail, known as the Rideau Trail, is roughly 325 km in length" (About The RTA); its
  # three clubs (Kingston, Central, Ottawa) maintain the trail in their sectors
  - name: Rideau Trail Association
    url: https://www.rideautrail.org/the-rta/
officialGpx:
  # the Maps page offers the "RTA Trails and Waypoints gpx file" (a zip) and kmz files without a login
  url: https://www.rideautrail.org/discover-the-trail/maps/
  by: the Rideau Trail Association
  source: rta-maps
trailType: point-to-point
continents: [North America]
countries: [CA]
regions: [Ontario]
# the two provincial parks the association's Overnight Accommodations page places on the trail
# (Frontenac at waypoint 04G, Murphys Point at 09A); note "Protected areas"
protectedAreas: [Frontenac Provincial Park, Murphys Point Provincial Park]
termini:
  # the maps page: Map 01 starts at "Kingston City Hall", Map 19 ends at the "Ottawa Locks";
  # coordinates of waypoints 01A and 19H from the RTA's distance spreadsheet
  start:
    name: Kingston City Hall
    lat: 44.22997
    lon: -76.47918
  end:
    name: Ottawa Locks
    lat: 45.42656
    lon: -75.6995
  source: rta-distances
established:
  # "Both the Rideau Trail and the Rideau Trail Association were funded in 1971"
  year: 1971
  source: rta-about
waymarking:
  # "orange isosceles triangle blazes mark the northbound route to Ottawa while orange triangle
  # blazes with yellow tips mark the southbound route to Kingston … side trails, connectors and
  # loop trails are marked by blue triangle blazes"
  text: Orange triangles mark the way north to Ottawa, orange triangles with a yellow tip the way south to Kingston; side trails and connectors carry blue triangles.
  source: rta-discover
length:
  # "The distance of the main Rideau Trail … is roughly 325km (217 miles) from Kingston to Ottawa"
  - km: 325
    approx: true
    source: rta-faq
days:
  # "it is possible to hike the entire distance in about 9-16 days"
  min: 9
  max: 16
  basis: operator
  source: rta-faq
stages:
  # the association's nineteen numbered maps of the main trail (Maps page: "Map 01 – Kingston,
  # Kingston City Hall – Mclvor Road" … "Map 19 – Ottawa, Carling Avenue – Ottawa Locks"), each
  # map's distance from the RTA's waypoint distance spreadsheet ("Distance by map" at the next
  # map's first waypoint). Ends at each next map's first waypoint (02A, 03A, … 19A, 19H), with the
  # spreadsheet's coordinates
  source: rta-distances
  list:
