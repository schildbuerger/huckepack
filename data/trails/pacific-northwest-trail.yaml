    # the Keystone ferry over Admiralty Inlet, from Coupeville to Port Townsend, at the start of
    # section 9 ("Keystone Ferry between Coupeville and Port Townsend"); its line OSM's ferry way
    # 232488600 (Washington State Ferries)
