name: Pacific Northwest National Scenic Trail
added: 2026-11-07
aliases: [Pacific Northwest Trail, PNT]
website: https://www.pnt.org/
wikidata: Q3360192
managedBy:
  # the association's FAQ: "When Congress designated the Pacific Northwest Trail as a National
  # Scenic Trail, it charged the U.S. Forest Service with administering the trail"; the association
  # publishes the route, its sections and the maps
  - name: Pacific Northwest Trail Association
    url: https://www.pnt.org/
  - name: USDA Forest Service
    url: https://www.fs.usda.gov/trails/pacific-northwest-nst
officialGpx:
  none: the association offers its strip maps as a free PDF map set and the route in the FarOut app; it offers no GPX download (checked 2026-11-07)
  source: pnta-navigate
trailType: point-to-point
continents: [North America]
countries: [US]
regions: [Montana, Idaho, Washington]
protectedAreas:
  # the national parks and the national recreation area and historical reserve named on the
  # association's section pages, and the six wilderness areas its FAQ names
  - Glacier National Park
  - Salmo-Priest Wilderness
  - Pasayten Wilderness
  - Ross Lake National Recreation Area
  - North Cascades National Park
  - Stephen Mather Wilderness
  - Mount Baker Wilderness
  - Ebey's Landing National Historical Reserve
  - Buckhorn Wilderness
  - Olympic National Park
  - Daniel J. Evans Wilderness
termini:
  # the FAQ: "The eastern terminus … is located at the Chief Mountain Customs parking area, in the
  # northeast corner of Glacier National Park" and "The western terminus … is located at Cape
  # Alava"; coordinates from OSM (the customs building, way 83326370; the cape, node 4971180836)
  start:
    name: Chief Mountain Customs (Glacier National Park)
    lat: 48.99663
    lon: -113.66025
  end:
    name: Cape Alava (Olympic National Park)
    lat: 48.16979
    lon: -124.73141
  source: pnta-faq
established:
  # "Designated a National Scenic Trail in 2009" (FAQ)
  year: 2009
  source: pnta-faq
waymarking:
  text: Most of the trail is not yet marked with signage, and the right combination of paths is often not obvious; the association advises carrying its strip maps, a compass and a GPS app.
  source: pnta-navigate
length:
  # "The Pacific Northwest Trail is about 1,200 miles long" (FAQ); the ten sections sum to 1,248
  # miles (the sections' own km: 2,009)
  - km: 1931
    approx: true
    source: pnta-faq
days:
  # the FAQ: "Thru-hikers typically take 60-75 days to complete the entire trail"
  min: 60
  max: 75
  source: pnta-faq
stages:
  # the association's ten sections from east to west (Sections of the PNT and each section's page),
  # with their miles, km and elevation gain and loss in feet (converted at 0.3048 m a foot; section
  # 8's an estimate, "Est."). No GPX: each section is the shortest way over the OSM relations'
  # ways to its end (route.branched). Ends from OSM on the relations' line: Eureka (the town), the
  # Kootenai River crossing at Copeland (the FS: "the trail drops down to cross the Kootenai River
  # near Bonners Ferry"; the section 3 page: "From the fertile Kootenai River Valley the trail
  # climbs"), Northport (the Columbia River bridge), Sweat Creek and Cold Springs (OSM names neither;
  # each placed on the line where the operator's section miles from Northport end: Sweat Creek at
  # the Highway 20 crossing near Clackamas Mountain, Cold Springs below Chopaka Mountain in the
  # Loomis State Forest), Ross Dam (where the
  # FS says the trail "crosses the Skagit River at Ross Dam" in Ross Lake NRA), the nearest point to
  # the Oyster Dome viewpoint, the Coupeville (Keystone) ferry terminal, the point nearest Forks
  # where the trail passes it, and Cape Alava
  source: pnta-sections
  list:
    - { number: "1", kind: main, from: "Chief Mountain (Glacier National Park)", to: "Eureka, Montana", km: 243, ascentM: 7304, descentM: 8138, end: { lat: 48.87985, lon: -115.05305 } }
    - { number: "2", kind: main, from: "Eureka, Montana", to: "Bonners Ferry, Idaho (Kootenai River)", km: 159, ascentM: 7076, descentM: 7101, end: { lat: 48.90551, lon: -116.40214 } }
    - { number: "3", kind: main, from: "Bonners Ferry, Idaho (Kootenai River)", to: "Northport, Washington", km: 245, ascentM: 9291, descentM: 9639, end: { lat: 48.91776, lon: -117.77727 } }
    - { number: "4", kind: main, from: "Northport, Washington", to: "Sweat Creek", km: 206, ascentM: 8189, descentM: 7531, end: { lat: 48.68003, lon: -118.90605 } }
    - { number: "5", kind: main, from: "Sweat Creek", to: "Cold Springs (Loomis)", km: 159, ascentM: 5030, descentM: 4246, end: { lat: 48.92524, lon: -119.76604 } }
    - { number: "6", kind: main, from: "Cold Springs (Loomis)", to: "Ross Lake NRA (Ross Dam)", km: 192, ascentM: 7234, descentM: 8578, end: { lat: 48.73303, lon: -121.0699 } }
    - { number: "7", kind: main, from: "Ross Lake NRA (Ross Dam)", to: "Oyster Dome", km: 315, ascentM: 11528, descentM: 11999, end: { lat: 48.62197, lon: -122.41089 } }
    - { number: "8", kind: main, from: "Oyster Dome", to: "Coupeville", km: 113, ascentM: 1529, descentM: 1567, end: { lat: 48.15913, lon: -122.67271 } }
    - { number: "9", kind: main, from: "Coupeville", to: "Forks", km: 274, ascentM: 11325, descentM: 11256, end: { lat: 47.8953, lon: -124.36409 } }
    - { number: "10", kind: main, from: "Forks", to: "Cape Alava", km: 103, ascentM: 1732, descentM: 1795, joinM: 520, end: { lat: 48.16979, lon: -124.73141 } }
