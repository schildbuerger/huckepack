route:
  # built by `python -m pipeline.all pieterpad`: OSM ways matched to the Stichting's GPX
  source: osm
  publishable: true
difficulty:
  # no grade is published; our estimate from the Stichting's description
  estimated:
    sac: T1
    basis: >-
      The Stichting says no particular fitness is needed ("Er is geen bijzondere wandelconditie
      voor nodig") and that the route keeps to smaller, mostly unpaved roads and paths across
      farmland, heath, forest and the low hills of Salland, Montferland and South Limburg; there
      are no mountain passages. Hiking on good paths (T1).
    source: sp
sleeping:
  # the Stichting's list of places to stay along the route: hotels, B&Bs, holiday homes and
  # campsites, each with its stages
  types: [hotel, guesthouse, campsite]
  source: sp
access:
  # Groningen station, the nearest main station (trains and buses to Winsum and Pieterburen), and
  # Amsterdam Schiphol. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Groningen
    lat: 53.21047
    lon: 6.56412
    source: osm
  - kind: airport
    name: Amsterdam Airport Schiphol (AMS)
    lat: 52.32698
    lon: 4.74151
    source: osm
animals:
  # Ticks: Lyme disease all over the Netherlands (RIVM); the TBE virus is found in ticks on the
  # Sallandse Heuvelrug, which the trail crosses between Hellendoorn and Holten, about 1 in 1,500
  # ticks there, and the RIVM advises no vaccination for the Netherlands. The short stretches in
  # Germany (Kleve and Heinsberg districts) are no TBE risk districts (RKI 2026). Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks live all over the Netherlands, mostly in grass, shrubs and dead leaves; about one in five carries the Lyme bacterium, and two to three bites in 100 lead to the illness. The TBE virus has been found on the Sallandse Heuvelrug, in about one tick in 1,500; no vaccination is needed for the Netherlands."
      do:
        - "Stay on the paths and avoid tall grass and shrubs"
        - "Wear closed shoes, long sleeves and long trousers, the trouser legs tucked into your socks if you like"
        - "Spray your clothes and rub uncovered skin with a tick repellent such as DEET"
        - "Check yourself and others after every walk: the groin, the armpits, under the edges of underwear, behind the ears and along the hairline"
        - "Remove a tick as soon as you can with pointed tweezers or a tick remover: grip it by the head close to the skin and pull it out slowly; then disinfect the bite with 70 % alcohol or iodine"
        - "Watch the skin around the bite for three months and see a doctor if a patch of colour spreads there, or fever and aching follow in the weeks after"
      dont:
        - "Squeeze the tick's body"
        - "Disinfect the tick before removing it: it then spits into the bite"
      source: rivm
tags: [lowlands, heath, forest, farmland, villages]
notes:
  - >-
    The trail crosses the Netherlands from north to south: from the Wadden coast at Pieterburen
    over the terp land to Groningen, along the Hondsrug onto the Drenthe plateau with its heaths,
    hunebeds and the Drentsche Aa, past Coevorden along the Overijsselse Vecht, over the Sallandse
    Heuvelrug into the Achterhoek (part 1 ends at Vorden), through Montferland and over the Rhine
    by ferry to Millingen, past Groesbeek and along the Maas through Limburg to the Sint-Pietersberg
    at Maastricht. It touches Germany at Hoch-Elten, Zyfflich and the Selfkant (Isenbruch, Millen).
  - >-
    Season: none published (the Stichting, Wandelnet), so none recorded. Wild camping: no official
    source states the rule for the route (in the Netherlands it is set by municipal bylaws and
    landowners; the Stichting asks walkers to follow the landowners' rules), so none recorded.
    Tree line: none recorded, the trail stays below about 200 m.
  - >-
    Figures: Wandelnet states 502 km (part 1 239 km, part 2 263 km; its text also says 257 km),
    the Stichting "ruim 500 km"; the stages sum to 239.9 and 266.3 km, 506.2 km. No climbs, heights
    or times are published; the page estimates them (terrain model, DIN 33466).
  - >-
    Map line: the Stichting's GPX guides the OSM matcher; every stage at least 98 % matched, 505.1 km
    against the stated 502 km. The trail crosses the Rhine by ferry from Pannerden's side to
    Millingen (stage 16, bridged 516 m) and the Maas by ferry on stage 19 (bridged 157 m): OSM's
    ferry lines aren't in the matcher's paths, so these stages allow longer bridges (`maxBridgeM`,
    `maxBridges`). Stage 26 ends with a 3.4 km loop over the Sint-Pietersberg back to its last
    point. Highest point 137 m (terrain model) in South Limburg. OSM maps few taps in South Limburg
    (25 km without drinking water near the end).
  - >-
    Dogs: allowed on most of the route but often on a lead, e.g. where grazing animals are; on a
    few short stretches not at all, with a detour (the Stichting).
  - >-
    Data check (2026-11-03): Wandelnet's stage figures against the Stichting Pieterpad's stage
    table (whole km): all 26 within 0.6 km (4 %); total 502 against the Stichting's "ruim 500" and
    Dutch Wikipedia's 501 km; termini Pieterburen and Sint-Pietersberg agree (the Stichting,
    Wikipedia); waymarking white-red (both). No deviation over 10 %.
  - >-
    Wild camping: no official source states the rule for the route (2026-11-03): in the Netherlands
    it is set by municipal bylaws and landowners, and the Stichting asks walkers to follow the
    landowners' rules.
