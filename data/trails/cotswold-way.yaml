  - kind: station
    name: Coventry
    lat: 52.40074
    lon: -1.51355
    source: osm
  - kind: airport
    name: Birmingham Airport (BHX)
    lat: 52.45418
    lon: -1.74387
    source: osm
animals:
  # Cattle (the Countryside Code, HSE) and ticks (NHS). Levels ours
  list:
    - kind: cattle
      name: "Cattle"
      level: moderate
      basis: "The Way crosses fields where cattle graze; the Health and Safety Executive names cows with calves and walkers with dogs as the two most common factors in incidents between cattle and the public."
      do:
        - "Give livestock plenty of space: their behaviour can be unpredictable, especially when they are with their young"
        - "Keep your dog on a lead around livestock"
        - "Let your dog off the lead if you feel threatened by livestock: releasing it makes it easier for you both to reach safety"
        - "Follow the farmer's directions when animals are being moved or gathered"
      dont:
        - "Risk getting hurt protecting your dog"
        - "Feed livestock"
      source: countryside-code
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that can carry Lyme disease live all over the UK, in woods and long grass; the NHS names grassy and wooded areas in southern England and the Scottish Highlands as high-risk areas."
      do:
        - "Cover your skin while walking and tuck your trousers into your socks"
        - "Use insect repellent on your clothes and skin; products containing DEET are best"
        - "Stay on clear paths whenever possible"
        - "Wear light-coloured clothing so ticks are easier to see and brush off"
        - "Remove a tick with fine-tipped tweezers or a tick-removal tool: grasp it as close to the skin as possible, pull slowly upwards, then clean the bite"
        - "Get an urgent GP appointment or call NHS 111 if, within 3 months of a bite, you feel unwell with flu-like symptoms or a round or oval rash appears"
      dont:
        - "Squeeze or crush the tick when you remove it"
      source: nhs-lyme
tags: [national-trail, escarpment, villages, hill-forts, bath]
notes:
  - >-
    Stages: the National Trail's 15 sections add up to 164.7 km (stated 164 km); ascent 3,257 m and
    descent 3,390 m. Section 5's descent reads "604 feet (249 metres)" on both National Trail pages;
    604 ft are 184 m, the record keeps the stated metres. Section 11 has a 4.8 mile (7.8 km)
    shortcut across Stinchcombe Hill, section 9 a choice of routes over Selsley Common or through
    King's Stanley; neither is in the record.
  - >-
    Route (pipeline, 2026-11-01, Geofabrik extracts): the National Trail's GPX (2019, a route drawn
    in OS Maps, from Bath) guides sections 1–6, 10 and 12–15; sections 7, 8, 9 and 11 follow the OSM
    relation (65239), cut at their ends: the GPX crosses the A417 at the old Air Balloon junction,
    which the A417 Missing Link rebuilt, and takes the Selsley Common route and the Stinchcombe Hill
    shortcut. OSM maps the new A417 crossing as under construction: section 7 bridges a 133 m gap
    there (maxBridgeM 200, user's decision 2026-11-01) plus three of 22–36 m. Every section matches
    at least 96 %; the map line is 163.2 km against the sections' 164.7 km.
  - >-
    Sections 8 and 9 split at Painswick's town node: 11.1 and 14.6 km on the map line against the
    National Trail's 13.9 and 12.6 km (both more than 10 % apart); together they agree (25.7 against
    26.5 km), so the National Trail places Painswick's end of the section elsewhere. The GPX gives
    the same 11.2 km from Birdlip to Painswick.
  - >-
    Ascent: the sections' 3,257 m against the terrain model's ≈ 3,440 m (GEDTM30, 2026-11-07, +6 %);
    Countryfile's 3,300 m agrees with the stated figure.
  - >-
    Water: (2026-11-01, within 500 m) OSM has 16 drinking water points near the route; the longest stretch without one is
    61 km (km 6–67, Broadway to Birdlip). Walkers refill in the villages' pubs, cafés and shops,
    which OSM doesn't record as water; the National Trail's interactive map has water points, but
    not as a list to add as waterPoints.
  - >-
    Data check (2026-11-01). Second sources: Natural England's GOV.UK page (102 miles, 164 km;
    around 7 to 10 days; Cleeve Hill the highest point at 330 m; open all year), English Wikipedia
    (164 km; a National Trail since 24 May 2007) and Countryfile (ascent 3,300 m). Length, days,
    season and ascent (1 %) agree; the terrain model's highest point is 313 m (GEDTM30, 2026-11-07;
    5 % under 330 m). The record's year is the 1970 launch; it became a National Trail in 2007.
