  # (Thru-Hiking). Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Guilford station (Amtrak, Shore Line East)
    lat: 41.27572
    lon: -72.67361
    source: osm
  - kind: airport
    name: Bradley International Airport (BDL)
    lat: 41.94069
    lon: -72.685
    source: osm
  - kind: airport
    name: Rhode Island T. F. Green International Airport (PVD)
    lat: 41.72253
    lon: -71.42873
    source: osm
  - kind: airport
    name: Boston Logan International Airport (BOS)
    lat: 42.36318
    lon: -71.01364
    source: osm
animals:
  # the operator names black bears, copperheads and ticks (Thru-Hiking); the advice from
  # Connecticut's Department of Energy and Environmental Protection and the CDC. Levels ours
  list:
    - kind: tick
      name: Blacklegged tick (deer tick)
      level: moderate
      basis: The operator calls ticks, which can transmit Lyme disease, one of the most common threats on the trail; the CDC says they are most active from April to September.
      do:
        - Treat clothing and gear with products containing 0.5% permethrin
        - Walk in the center of trails
        - Use EPA-registered insect repellents containing DEET, picaridin, IR3535, Oil of Lemon Eucalyptus (OLE), para-menthane-diol (PMD), or 2-undecanone
        - Check your body for ticks after being outdoors
      dont:
        - Avoid wooded and brushy areas with high grass and leaf litter
      source: cdc-ticks
    - kind: bear
      name: Black bear
      level: low
      basis: Hikers sometimes meet black bears on the trail; Connecticut's population is growing fast, but black bear attacks on humans are exceptionally rare.
      do:
        - If you see a bear when hiking or camping, make your presence known by making noise and waving your arms
        - If you surprise a bear at close range, walk away slowly while facing the bear
        - "Black bears will sometimes \"bluff charge\": stand your ground and shout at the bear"
        - Use a rope to suspend food 10 or more feet off the ground and at least 6 feet away from tree trunks
        - Make sure your dog is on a leash and under control
      dont:
        - Do not run
        - Do not climb a tree because black bears are excellent tree climbers
        - Do not cook near your tent and do not store food inside your tent
        - Never attempt to feed or attract bears
      source: ctdeep-bear
    - kind: snake
      name: Northern copperhead
      level: low
      basis: Connecticut's copperheads are most abundant on the traprock ridges the trail follows, active April to October; docile, their bite is painful and can make one severely ill but rarely kills.
      do:
        - Observe it from a distance and allow it to go on its way
        - In trap rock areas, be careful of where you place your hands and feet
        - Seek medical attention immediately if bitten
      dont:
        - The killing of this snake is strongly discouraged
      source: ctdeep-copperhead
tags: [ridge, forest, river, coast]
notes:
  - >-
    Stages: the trail's 40 section pages (Find a Hike, "Section Hike"), CT NET sections 1–21 and MA
    NET sections 1–19, each with its miles and elevation change ("+1075 / -567 feet"), converted at
    1.609344 km a mile and 0.3048 m a foot; the ends are those of each section's line on the
    interactive map's data (the line's segments carry the section's web id). The trail is branched:
    Connecticut numbers its sections from the Mattabesett's eastern terminus on the Connecticut
    River in Middletown, CT 1–4 running south-west to CT 9, while CT 5–8 (the Menunkatuck Trail)
    climb from the southern terminus in Guilford to a junction inside CT 9. The main stages are the
    route from the southern terminus to the New Hampshire line, CT 5–21 and MA 1–19 (219.6 miles,
    353.1 km); CT 1–4 (22.7 miles), the Mattabesett's eastern arm, are variants walked from the
    junction out to Middletown, with their ends and their climbs turned round. The junction lies
    inside CT 9, so on the map line the main stage CT 9 covers only the section's western part
    (8.9 km against its 12.7 miles, 20.4 km) and the variant CT 4 also its eastern part (20.8 km
    against 6.9 miles, 11.1 km); the record keeps the stated miles. Stage numbers carry the state
    ("CT 5", "MA 1"), as the operator names them.
  - >-
    Length: the trail is "a 235-mile hiking trail route" (About the NET; the National Park Service
    the same), which takes in the Mattabesett's eastern arm; the 40 sections sum to 242.3 miles
    (3 % more). The main route alone has no stated total, so the record states none and the page
    sums the main stages (219.6 miles, 353.1 km).
  - >-
    Connecticut River: "There is no pedestrian crossing of the Connecticut River where it currently
    meets the NET … thru-hikers must hitch a ride across by boat, use a car or hike around" (a road
    walk on US-5 and MA-47, 10.2 miles, "possible but not suggested"). The crossing between the end
    of MA 6 (Underwood Avenue, Easthampton) and the start of MA 7 (Old Mountain Road, Hadley) is
    recorded as a transfer by boat inside MA 7, the first of the operator's ways across; OSM's
    relation has "an intentional gap at the Connecticut River". The Westfield River (end of MA 2) is
    forded; at high water a road walk of about 3 miles goes round it.
  - >-
    Days: "A typical thru-hiker can complete the trail in 2-4 weeks", recorded as 14 to 28 days; it
    doesn't say whether the eastern arm to Middletown is included.
  - >-
    Ascent: the operator gives thru-hikers "a net gain of just over 30,000 ft" (9,144 m) without a
    descent; the page sums the main sections' stated climbs instead (10,609 m up, 10,328 m down),
    which every main stage states. The terrain model gives about 10,300 m.
  - >-
    Season: the operator's "many choose to hike in the spring and fall, as summers tend to be humid
    and buggy and winters are cold and icy", recorded as March–May and September–November (the
    meteorological seasons); Wikipedia's infobox says "Spring to Fall".
  - >-
    Waymarking: the light blue (Connecticut) and white (Massachusetts) rectangular blazes are not
    drawn (no plain rectangle blaze in Waymark.astro yet, as for the Ozark Highlands Trail).
  - >-
    Protected areas: the state parks and forests that the main route's section pages name; the
    eastern arm's Millers Pond State Park and the land trusts' and municipal preserves are left out.
  - >-
    Wildlife: the operator names black bears, copperheads and ticks (Thru-Hiking). Massachusetts'
    wildlife pages (mass.gov) answered 403 and were left out; Connecticut's Department of Energy and
    Environmental Protection gives the bear and copperhead advice and the CDC the tick advice.
  - >-
    Map line (2026-11-07): the Connecticut, Massachusetts and New Hampshire Geofabrik extracts
    (2026-11-05); OSM's NET relation 3672563 (489 main ways, 80 excursions, in two pieces split at
    the Connecticut River) with each stage the shortest way over its ways to the section end.
    Every stage is 99–100 % matched except two: MA 5 is 90 % matched, as the matcher leaves the
    relation's ways for the parallel Pipeline Trail for about 0.7 km near Mount Tom (up to 200 m
    off; the relation's ways don't join there in the routable network); MA 7 is 88 % matched, since
    its guide jumps the river and joins the relation's way ends (joinM 1,600 m) through via points
    on the trail's map data; its map line (8.6 km) equals the operator's line (8.6 km). The main
    route measures 319.5 km against the main sections' 353.1 km (−9.5 %); the operator's own map
    line is shorter than its stated miles too (CT 12 9.7 km against 11.6 km, CT 14 16.7 km against
    18.5 km), so the map line's 10–18 % shorter CT 1–3, 10, 12, 14 and 17 follow the operator's
    line. Highest point 500 m at km 302 (Mount Grace; the operator's 1,617 ft, 493 m), lowest 1 m
    at Long Island Sound (the operator's 0 ft).
  - >-
    Water: OSM maps only 2 drinking water points and 3 springs within 500 m of the trail; the
    operator says "water sources are very limited, particularly in the Summer and Fall", "there is
    not a guide to available water sources", and to treat or filter all water, so no waterPoints
    are added.
  - >-
    Resupply and beds: OSM maps 41 shops near the trail, the longest stretch without one 106 km
    (km 213–320, from Pelham to the state line); thru-hikers "leave the trail to periodically
    resupply in nearby towns, carrying roughly enough food for 3-7 days" over its roughly 100 road
    crossings. OSM maps only 7 campsites near the trail (the longest stretch without one 133 km);
    the operator's ten overnight sites (cabins, lean-tos, tent sites) are mostly not mapped as
    such, and hikers are expected to leave the trail for hotels, rooms or campgrounds.
  - >-
    Access: Guilford station (Amtrak and Shore Line East), 1.8 km by road from the start, and the
    airports the operator names: Bradley (89 km), T. F. Green (135 km) and Boston Logan (234 km).
  - >-
    Data check (2026-11-07): against the National Park Service's Basic Information and English
    Wikipedia. Length: the NPS "235-mile" agrees with the operator's 235 miles; Wikipedia's "Approx.
    215 mi" is 8.5 % less (the Massachusetts relocation and the Guilford extension came later).
    Termini: Wikipedia's "Guilford Harbor, CT" and "MA-32, Royalston" agree with Chittenden Park and
    the state line 0.7 miles beyond the Route 32 trailhead. Designation 2009: agrees. Highest point
    Mount Grace 1,617 ft and lowest Long Island Sound 0 ft in both; the terrain model 500 m (+1.4 %)
    and 1 m. Season: Wikipedia "Spring to Fall", the operator spring and fall; the record keeps the
    operator's. Difficulty: Wikipedia "Moderate to strenuous"; our T2 fits. Days, camping and
    sleeping only on the operator's pages. Ascent: the operator's "just over 30,000 ft" (9,144 m)
    against the main sections' 10,609 m (+16 %, dataCheck.deviations). The 40 sections' miles and
    climbs were checked one by one against the section pages. Derived against stated: CT 9 and
    CT 4 on the map line (the branch junction inside CT 9), and CT 1–3, 10, 12, 14 and 17 10–18 %
    shorter on the map line, as on the operator's own line (dataCheck.deviations).
dataCheck:
  date: 2026-11-07
  against: [nps-basic, wikipedia]
  pageAgainst: [net-sections]
  deviations:
    - { figure: ascent, ours: "10,609 m (sum of the main sections)", theirs: "just over 30,000 ft (9,144 m) for thru-hikers", source: net-thru }
    - { figure: stage CT 9 length, ours: "20.4 km (12.7 miles)", theirs: "8.9 km on the map line (the main route joins inside the section)", source: osm }
