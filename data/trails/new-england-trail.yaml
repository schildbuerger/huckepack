route:
  # built by `python -m pipeline.all new-england-trail`: OSM ways matched to OSM's NET relation
  # (3672563, "There is an intentional gap at the Connecticut River"), each stage the shortest way
  # over the relation's ways to its section end
  source: osm
  publishable: true
  relation: 3672563
  branched: true
difficulty:
  estimated:
    sac: T2
    basis: >-
      The trail is well marked and easy to follow, single track along traprock ridges and through
      forest with several road walks, but rugged in some sections: steep, rugged climbs over loose
      rock (CT 14), scrambling climbs (CT 15), cliffs that are dangerous when wet (CT 11) and a
      steep pitch where some may need a rope (MA 9). Mountain hiking on marked paths (T2), with
      short steeper scrambles.
    source: net-sections
season:
  # "Although the trail could be hiked year round, many choose to hike in the spring and fall, as
  # summers tend to be humid and buggy and winters are cold and icy" (Thru-Hiking); spring and fall
  # taken as March–May and September–November
  months: [3, 4, 5, 9, 10, 11]
  text: Spring and fall; the trail could be hiked year round, but summers tend to be humid and buggy and winters cold and icy
  source: net-thru
sleeping:
  # Overnight Sites: cabins, lean-tos and tent sites (ten in all); where there is none, hikers leave
  # the trail for "a nearby hotel, airbnb or campground" (Thru-Hiking)
  types: [bivouac, campsite, hotel, guesthouse]
  source: net-overnight
wildCamping:
  status: prohibited
  rule: >-
    Camping is allowed only at the designated overnight sites; much of the trail is on private
    land, and stealth camping is not permitted. Campfires are not allowed at overnight sites in
    Connecticut, and only at existing designated fire rings in Massachusetts.
  source: net-faqs
access:
