route:
  # built by `python -m pipeline.routes alpe-adria-trail`: OSM ways matched to the official tracks
  source: osm
  publishable: true
difficulty:
  # no SAC grade is published; our estimate from the official description
  estimated:
    sac: T2
    basis: >-
      The official FAQ rates the trail "easy to moderate": no rope-secured or exposed stretches,
      but sure-footedness on rocky sections, walking times of up to eight hours, and ascents and
      descents of up to 1,500 m a day; the stage pages grade single stages from easy to
      difficult (Outdooractive's scale), mostly for their length and climbing. The alpine stages
      reach about 2,370 m on mountain paths. That is mountain hiking (T2).
    source: aat
treeLine:
  # the top of the high-subalpine larch and stone pine zone, "(1650) 1950–2200 (2300)" m, in forest
  # growth region 1.2 (Osttiroler Zentralalpen und oberes Mölltal), where the trail starts and is
  # highest (stage 1, about 2,360 m); further south and east the tree line lies lower
  m: 2200
  source: bfw
season:
  # Kärnten Werbung; the high stages near the Grossglockner set the limit, the lower ones in
  # Slovenia and Italy can be walked for longer
  months: [6, 7, 8, 9, 10]
  text: Mid-June to early October
  source: kaernten
sleeping:
  # each stage ends where there are rooms; huts on the alpine stages, campsites at some stages
  types: [hut, guesthouse, hotel, farm-stay, campsite]
  source: aat
wildCamping:
  status: prohibited
  rule: >-
    Camping is allowed only at campsites, in all three countries; not every stage has one, so the
    whole trail can't be walked from campsite to campsite.
  source: aat
access:
  # the start is reached by bus from Lienz (via Heiligenblut); airports at Klagenfurt and Salzburg.
  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Lienz station
    lat: 46.82885
    lon: 12.77127
    source: osm
  - kind: airport
    name: Klagenfurt Airport (KLU)
    lat: 46.64348
    lon: 14.3286
    source: osm
  - kind: airport
    name: Salzburg Airport (SZG)
    lat: 47.79346
    lon: 13.00183
    source: osm
tags: [alpine, lakes, cross-border, coast, culture]
notes:
  - >-
    The official site gives "circa 750 km" and "43 stages"; Kärnten Werbung's stage pages list 37
    main stages (705.5 km in sum) plus 7 stages of the circular route (136.1 km), and an overall
    tour of 721.2 km with 24,320 m of ascent. The 43 count most likely includes the circular route
    with one of its stages shared or merged. The record keeps the 37 main stages for totals.
  - >-
    Stage 8 has ended in Kolbnitz instead of Danielsberg since the 2023 season (stage page).
  - >-
    Stage 14's page gives 0 m of descent (1,050 m of ascent from Döbriach at 590 m to the
    Langalmtal); kept as published.
  - >-
    The official GPX downloads need a login; the stage pages carry the same track as schema.org
    data, which only guides the OSM matcher and is not published.
  - >-
    Wild camping: the official FAQ says camping only at campsites, in all three countries. Austria
    (Forstgesetz, Carinthian camping law), Slovenia and Friuli generally forbid it.
  - >-
    Route (pipeline, 2026-10-29): the OSM match covers 96–100 % of most stage tracks; below 95 %
    are stages 8 (89 %) and 9 (92 %), where OSM is probably missing paths or the track takes a
    shortcut OSM doesn't have. Rebuilt from the full Geofabrik extracts
    (2026-10-30): identical. Stages 7 (Mallnitz – Obervellach) and 30 (Breg pri Golem Brdu –
    Šmartno) were at 90 % and 89 %, the map line 15.8 and 19.1 km: their tracks walk out to a
    viewpoint and back the same way, and the matcher skipped the spur. Since 2026-10-30 it matches
    each leg of such a turnaround on its own: 100 % and 99 %, 18.6 and 21.6 km as stated. Short
    loops out and back on a parallel path are split the same way, which lifted the circular
    route's R6 from 91 % to 97 %.
  - >-
    Water (pipeline, 2026-10-30): 231 drinking water points and 31 springs from OSM along the
    main route; the longest stretch without drinking water is 57.2 km on stages 3–5 (Döllach –
    Innerfragant), where OSM probably misses village fountains and hut taps. Confirmed with the
    full Geofabrik extract (2026-10-30): OSM has no drinking water within 250 m there. The
    official stage pages name rest stops (Landgasthof Schwaiger and Alpengasthof Marterle on stage
    3, Gasthof Dorfschenke in Stall, Bodenhütte and Goldberghütte on stage 5) and a wooden fountain
    on stage 4, but no drinking water, and stage 5 advises carrying sufficient drinking water; so no
    `waterPoints` are added (they need a source naming drinking water).
  - >-
    Data check (2026-10-29). Second source: German Wikivoyage, whose stage list follows an older
    split into 34 stages. Where its stages run between the same places as the official ones they
    agree within 10 % (stages 1, 9, 11, 12, 15, 17, 18, 20, 21, 24–29, 31–33), and its total of
    "over 24,000 m" of ascent matches the overall tour's 24,320 m. More than 10 % apart (mostly
    different stage ends in the older split): stage 13 (24.0 km against 28 km, to the Alexanderhütte),
    16 (19.3 km against 15 km), 19 (16.9 km against 19 km), 22 (21.6 km against 19.5 km), 23 (22.6 km
    against 20 km) and 34 (23.8 km against 30.5 km). Season: Wikivoyage gives mid-April to October,
    Kärnten Werbung mid-June to early October for the whole trail (the high stages near the
    Grossglockner set the limit); the record keeps Kärnten Werbung's.
  - >-
    Tree line (2026-10-30): BFW's growth region 1.2 (upper Mölltal) puts the top of the
    high-subalpine zone at 2,200 m, locally 2,300 m; the route's highest point, 2,358 m on stage 1,
    is above it. Second source: German Wikipedia, "in den Alpen liegt die Grenze zwischen 1800 und
    2200 Metern" (the upper end agrees).
