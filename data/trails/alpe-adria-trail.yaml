  date: 2026-10-30
  against: [wikivoyage, wikipedia-waldgrenze]
  pageAgainst: [aat-tours]
  deviations:
    - { figure: "Stage 13 length", ours: "24.0 km", theirs: "28 km (to the Alexanderhütte)", source: wikivoyage }
    - { figure: "Stage 16 length", ours: "19.3 km", theirs: "15 km", source: wikivoyage }
    - { figure: "Stage 19 length", ours: "16.9 km", theirs: "19 km", source: wikivoyage }
    - { figure: "Stage 22 length", ours: "21.6 km", theirs: "19.5 km", source: wikivoyage }
    - { figure: "Stage 23 length", ours: "22.6 km", theirs: "20 km", source: wikivoyage }
    - { figure: "Stage 34 length", ours: "23.8 km", theirs: "30.5 km", source: wikivoyage }
    - { figure: "Season", ours: "mid-June to early October", theirs: "mid-April to October", source: wikivoyage }
