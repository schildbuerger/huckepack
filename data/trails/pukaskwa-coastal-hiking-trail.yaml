  date: 2026-11-06
  against: [dno, superior-country]
  pageAgainst: [pc-planner, pc-backcountry, pc-conditions, pc-guide]
  deviations:
    - { figure: group size per backcountry campsite, ours: "6 (Parks Canada)", theirs: "8", source: dno }
