  # miles"; the trail page's trailheads: Lake Ft Smith (mile 0) 35.694624, -94.11849 and Dillard's
  # Ferry – AR-14 (mile 206.4) 36.0652, -92.5783. The Sylamore and Norfork Lake segments beyond the
  # unbuilt Lower Buffalo Wilderness gap are left out (notes)
