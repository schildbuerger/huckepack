    url: https://ozarkhighlandstrail.com/
  - name: USDA Forest Service, Ozark–St. Francis National Forests
    url: https://www.fs.usda.gov/r08/ozark-stfrancis/recreation/trails/ozark-highlands-trail
officialGpx:
  none: the association shows a GPS track on its trail page "for illustrative purposes only" and sells its maps and a FarOut guide; no GPX to download (checked 2026-11-06)
