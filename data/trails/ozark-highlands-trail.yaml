name: Ozark Highlands Trail
added: 2026-11-06
aliases: [OHT]
designation: National Recreation Trail
website: https://ozarkhighlandstrail.com/trail/
wikidata: Q7116493
managedBy:
  # the association builds and maintains the trail (FAQ: "The Boston Mountains, Buffalo River, and
  # Sylamore segments are maintained by OHTA volunteers"); the land is the Ozark–St. Francis
  # National Forests', Lake Fort Smith State Park's and the Buffalo National River's (NPS)
