route:
  # built by `python -m pipeline.all ozark-highlands-trail`: OSM ways matched to the trail's OSM
  # relation (10868744, operator The Ozark Highlands Trail Association), chained from Lake Fort
  # Smith and cut near the trailheads
  source: osm
  publishable: true
  relation: 10868744
difficulty:
  estimated:
    sac: T2
    basis: >-
      The association calls it the "most rugged and scenic terrain in the region": a built
      single-track footpath over the Boston Mountains' ridges and hollows, with many creek
      crossings, bluff tops and a ford of the Buffalo River at Woolum that "can be too high to
      cross after big rains", without exposed passages. Hiking in hilly terrain on a maintained
      trail (T2).
    source: ohta-trail
season:
  # the FAQ: "The best hiking season begins in October and runs into early June. Winter is
  # especially great for hiking … The summer months of July, August, and into September are the
  # least favorite times to hike"; the trail page: "Fall through Spring are the peak seasons"
  months: [10, 11, 12, 1, 2, 3, 4, 5]
  text: October into early June, winter especially; the summer months are the least favourite, hot and humid, with little water and the trail unmaintained
  source: ohta-faq
sleeping:
  # the FAQ: public campgrounds at Lake Ft. Smith State Park, White Rock Mountain, Ozone, Haw Creek
  # Falls, Fairview, Richland Creek, Woolum, Tyler Bend and others; rental cabins at White Rock
  # Mountain
  types: [campsite, guesthouse]
  source: ohta-faq
wildCamping:
  status: allowed
  rule: >-
    Camping is generally allowed anywhere along the trail at least 200 feet from and out of sight of
    the trail and any water source; no permits are needed. Campfires are allowed, but no new fire
    rings.
  source: ohta-faq
access:
  # Northwest Arkansas National Airport (XNA) for the west end; Little Rock's airport for the east;
  # no passenger railway near the trail. Coordinates from OSM; distances by pipeline/access.py
  - kind: airport
    name: Northwest Arkansas National Airport (XNA)
    lat: 36.27981
    lon: -94.30259
    source: osm
  - kind: airport
    name: Bill and Hillary Clinton National Airport, Little Rock (LIT)
    lat: 34.73077
    lon: -92.22377
    source: osm
animals:
  # the Ozark–St. Francis National Forests' alert "Be Bear Aware in the National Forests in Arkansas
  # & Oklahoma!"; level ours
  list:
    - kind: bear
      name: Black bear
      level: low
      basis: >-
        The national forests in Arkansas are bear country; the association reports an expanding
        population of mostly small, shy black bears and about a dozen sightings a year, most around
        White Rock Mountain and Horn Mountain.
      do:
        - Let someone know where you are going and when you plan to return
        - Stay alert, do not wear headphones, and cautiously approach any blind corners on trails
        - Remain calm. Group together and pick up small children
        - Continue to face the bear and back away slowly, speaking calmly
        - If the bear continues to approach, try to scare it away by making yourself as large and imposing as possible by stretching your arms overhead and making loud noises
      dont:
        - If you see a bear, DO NOT RUN
      source: usfs-bears
tags: [forest, waterfalls, river, wilderness]
notes:
  - >-
    Extent: the association's trail runs (when complete) about 325 miles to the Missouri line in four
    segments: Boston Mountains (164 miles, Lake Fort Smith to Woolum), Buffalo River (43 miles, to
    AR-14 at Dillard's Ferry), Sylamore (32 miles) and Norfork Lake (72 miles). About 14–15 miles
    through the Lower Buffalo Wilderness (a bushwhack route) and 18 miles near Norfork Lake are not
    built. The record covers the continuous built trail, Lake Fort Smith to AR-14 (the FAQ's 207
    miles); the home page's "270 miles" and the trail page's "290 miles" count the separate
    Sylamore and Norfork pieces too, the Forest Service's "about 230 miles built as of 2017" an
    older state, Arkansas State Parks' "240-mile" and Wikipedia's 254 miles other stretches.
  - >-
    Stages: the association publishes segments (164 and 43 miles here) and its major trailheads with
    their mile markers, no day stages; the record takes every major trailhead it lists, in order,
    as a stage end, with the mile markers' differences (17.4 to 20.8 miles in the Boston Mountains,
    2.0 to 8.6 miles along the Buffalo River, where the trailheads lie closer). The mile markers were
    recalculated and replaced in 2016–17.
  - >-
    Days: the FAQ gives "10 to 14 days for the 164-mile Boston Mountains segment", which covers
    another stretch; no days for the 207 miles, so the page counts one day per stage.
  - >-
    Fort Douglas: the Forest Service closed the Ft. Douglas trailhead (end of stage 6) during the
    ARDOT Highway 123 Big Piney Creek bridge reconstruction (alert from 28 September 2026); hikers
    park at Haw Creek Falls Campground instead. The trail itself stays open.
  - >-
    Water: the Forest Service's trail page: "Not for drinking - except at campgrounds along the
    trail"; the FAQ: "In the drier months (July – September) the water can be hard to find", treat
    all water.
  - >-
    Resupply: the FAQ: "There are currently no grocery stores located within a reasonable hiking
    distance from the trail"; post offices at Ozone and Pelsor (within two miles) take resupply
    packages.
  - >-
    Waymarking: the white blaze is drawn from the source's description (`white-blaze`,
    added 2026-11-07).
  - >-
    Wildlife: the association's FAQ names rattlesnakes, copperheads and water moccasins ("There has
    never been a reported incident of a hiker getting snake bit on the OHT") and advises bear
    bagging or a bear-proof container; no official (park or health authority) page with advice for
    the trail's snakes or ticks was found (searched 2026-11-06), so only the Forest Service's black
    bear advice is listed.
  - >-
    Tree line: not added; the route stays below 800 m in the Boston Mountains' deciduous forest.
  - >-
    Map line (2026-11-06): the Arkansas Geofabrik extract (2026-11-05); OSM's Ozark Highlands Trail
    relation (10868744), chained from Lake Fort Smith and cut near the association's trailheads,
    every stage 100 % matched and within 10 % of its mile-marker distance (the Boston Mountains
    stages 3–7 % short on the map line). It measures 313.8 km against the association's 207 miles
    (333 km, −5.8 %). Highest point 712 m at km 62 (the terrain model, GEDTM30, 2026-11-07), lowest
    158 m at km 301 near the Buffalo River; none stated. The terrain model gives about 8,020 m of
    climbing; none is stated.
  - >-
    Water (map line): OSM maps 4 drinking water points and 4 springs near the trail; with refills at
    campgrounds the longest stretch without clean water is 98.9 km (km 29–128, White Rock Mountain to
    Ozone). Creeks are crossed often outside July–September (the FAQ), but the Forest Service says
    only the campgrounds' water is for drinking; the record adds no water points.
  - >-
    Resupply (map line): OSM maps 2 stores, White Rock General Store (km 24) and Hankins General
    Store near Fairview (km 186, 1.8 km off), the longest stretch without one 161.6 km; as the FAQ
    says, there are no grocery stores within reasonable hiking distance, with post offices at Ozone
    and Pelsor for mailed resupply.
  - >-
    Beds (map line): OSM maps 24 campgrounds near the trail, the longest stretch without one 98.9 km
    (White Rock Mountain to Ozone); camping is allowed anywhere along the trail away from it and the
    water (wildCamping).
  - >-
    Data check (2026-11-06): against the National Park Service's Buffalo River Trail pages, the
    Forest Service's trail page and Arkansas State Parks' Lake Fort Smith page. Woolum to Dillards
    Ferry: NPS "a little more than 42 miles" against the association's 42.4 miles (stages 10–17,
    68.3 km), agrees; Woolum to Tyler Bend: NPS "a little more than 11 miles" (about 17.7 km) against
    the association's 12.6 miles (stages 10–11, 20.2 km, +14 %), recorded as a deviation (the
    association's mile markers were recalculated in 2016–17; the page keeps them). Termini: the
    Forest Service and Arkansas State Parks name Lake Fort Smith State Park as the western start,
    NPS Dillards Ferry as the Buffalo River Trail's end; agree. Season: the Forest Service gives
    "Year-round" use, the association too ("the trail is open all year") with its best season
    October into early June; consistent. Water, foot travel only and the association's role agree
    with the Forest Service's page. No second source gives the 207 miles of this stretch (the
    Forest Service's "about 230 miles built as of 2017", Arkansas State Parks' "240-mile" and
    Wikipedia's 254 miles count other stretches; the map line measures 313.8 km, −5.8 %), days,
    stage distances in the Boston Mountains, difficulty or camping rules; those were checked on
    the built page against the association's trail page and FAQ, figure by figure, and agree.
  - >-
    Preflight (2026-11-06): the association's and the Forest Service's pages answer 200; the OSM
    relation 10868744 chains 319.1 km from Lake Fort Smith to Dillard's Ferry, and its 49.7 km left
    over are the separate Sylamore section's ways (beyond the unbuilt gap) and the 4.4 km OHT High
    Water Bypass (role alternative), not a break in the record's stretch; the preflight's BLOCKER
    line is that, not a blocker.
