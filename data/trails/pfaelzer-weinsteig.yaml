wildCamping:
  status: restricted
  rule: >-
    In Rhineland-Palatinate, tents in the forest need the forest owner's consent (Landeswaldgesetz
    § 22 (4) no. 3); the vineyards and fields are private land.
  source: lwaldg-rp
access:
  # Mannheim Hauptbahnhof, the region's main station, and Frankfurt Airport. Bockenheim has only a
  # regional station. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Mannheim Hauptbahnhof
    lat: 49.47966
    lon: 8.46982
    source: osm
  - kind: airport
    name: Frankfurt Airport (FRA)
    lat: 50.02441
    lon: 8.5552
    source: osm
animals:
  # Ticks: Lyme disease all over Germany (the federal health agency's advice); none of the districts
  # the trail crosses is a TBE risk area (RKI 2026: Rhineland-Palatinate's only one is LK
  # Birkenfeld). Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; about one tick bite in 100 leads to the illness, which antibiotics treat well when caught early."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [vineyards, wine, forest, castles]
notes:
  - >-
    The Weinsteig runs north to south along the German Wine Route, switching between the vineyards
    of the Haardt edge and the eastern Palatinate Forest: Neuleiningen, Bad Dürkheim, Deidesheim,
    Neustadt, the Kalmit (673 m, its highest point), the Hambacher Schloss, the Villa Ludwigshöhe,
    Annweiler below the Trifels, Bad Bergzabern and the Deutsches Weintor at Schweigen on the French
    border, where the Pfälzer Waldpfad continues.
  - >-
    Season: March to November (Pfalz.Touristik's best months). Wild camping: forest owner's consent
    in Rhineland-Palatinate. Tree line: none recorded, the trail stays below about 680 m. Ticks: the
    RKI's 2026 bulletin lists LK Birkenfeld as Rhineland-Palatinate's only TBE risk area; LK Bad
    Dürkheim, SK Neustadt, LK Südliche Weinstraße and SK Landau are not.
  - >-
    Figures: the stated length is 172 km "officially", 172 to 185 km depending on the detours into
    the villages; the stages sum to 184.2 km (they include the ways into the stage towns). The
    complete route's 5,668 m up and 5,602 m down are shown; the stages sum to 5,999 and 5,980 m.
  - >-
    Map line: the stage pages' tracks (kept local) guide the OSM matcher; every stage at least 95 %
    matched, 179.8 km against the stages' 184.2 km; highest point 669 m (terrain model, GEDTM30,
    2026-11-07) against the Kalmit's 673 m.
  - >-
    Data check (2026-11-03): Pfalz.Touristik's figures against German Wikipedia (its stage table
    from Publicpress's Leporello map): all eleven stage distances within 2 % (e.g. 15.2 against
    14.9 km, 17.6 against 17.4 km); length 172 km against 185 km (Wikipedia: 172 to 185 km with the
    detours into the villages; its table sums to 183.7 km), 7 %; ascent 5,668 against 6,073 m and
    descent 5,602 against 6,013 m, 7 %; highest point the Kalmit, 673 m; Bockenheim to
    Schweigen-Rechtenbach; season March to November: all agree, no deviation over 10 %.
  - >-
    Days: none stated by Pfalz Touristik (2026-11-04); the page counts one day per stage.
