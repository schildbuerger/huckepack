waymarking:
  # the brochure: kilometre markers; "Watch for orange balls as you hike, they mark an exit from the
  # beach to the trail"
  text: Kilometre markers along the trail; orange balls mark the exits from the beach to the trail
  source: bcp-map
length:
  # "The Juan de Fuca Marine Trail follows 47 km of remote coastline"
  - km: 47
