  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Donauwörth
    lat: 48.71409
    lon: 10.77156
    source: osm
  - kind: station
    name: Tuttlingen
    lat: 47.98045
    lon: 8.79913
    source: osm
  - kind: airport
    name: Stuttgart Airport (STR)
    lat: 48.68842
    lon: 9.20539
    source: osm
animals:
  # ticks: Lyme disease all over Germany (the federal health agency's advice). Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; about one tick bite in 100 leads to the illness, which antibiotics treat well when caught early."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [swabian-jura, escarpment, castles, viewpoints]
notes:
  - >-
    Wildlife: tick-borne encephalitis (TBE) risk areas along the trail (the RKI's yearly list) were not
    checked for this record; only Lyme disease is listed.
  - >-
    Length: the site states no total; the 16 stages add up to 360.1 km.
  - >-
    Days: the site gives no number of days for the whole trail; the page counts one day per stage.
  - >-
    Season: none published (the site's pages; searched 2026-11-06); every month is recorded for now, by
    the rule for trails without a published season.
  - >-
    Wild camping: the site gives no rule; none recorded.
  - >-
    Tree line: none; the Jura's highest points are about 1,000 m.
  - >-
    Map line (2026-11-06): the Schwaben, Stuttgart, Tübingen and Freiburg Geofabrik extracts
    (2026-10-31 to 2026-11-04); each stage the shortest way over OSM's relation of the HW 1 (2268844) to
    its end, joining way ends up to 30 m apart (the relation is in two pieces 18 m apart below Honau);
    every stage 100 % matched. The route measures 356.0 km against the stages' 360.1 km. Ascent: the
    stages state 8,527 m up; the terrain model reads about 12,370 m, as it measures the treetops along
    the wooded escarpment; the page keeps the stated figures. Water and beds: OSM maps none for 29 to 40
    km between Bopfingen and Heubach (km 28.6–68.4).
  - >-
    Data check (2026-11-06, working rule 2): against German Wikipedia (Schwäbische-Alb-Nordrand-Weg).
    365 km against the 16 stages' 360.1 km (1 % apart); Donauwörth to Tuttlingen along the Albtrauf
    agrees; Wikipedia counts 25 day stages (the Albverein's older division) against the site's 16 and
    "über 8000 Höhenmeter" against the stages' 8,527 m up. No figure differs by more than 10 % except
    the number of stages, which is a different division, not a different route.
