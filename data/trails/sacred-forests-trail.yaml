route:
  # built by `python -m pipeline.routes sacred-forests-trail` from the stage tracks above
  source: pnfc
  publishable: false # the park's tracks are all rights reserved; replace with OSM-derived geometry before release
difficulty:
  cai:
    grade: E
    source: thewom
season:
  months: [3, 4, 5, 9, 10, 11]
  text: Spring and autumn
  source: thewom
sleeping:
  types: [hut, campsite, hostel, guesthouse, hotel, monastery]
  source: pnfc
wildCamping:
  status: restricted
  rule: >-
    Inside the national park, tents are allowed only at authorised campsites and farms.
    Next to huts, bivouacs and other hikers' facilities you may pitch a tent only while
    they are open and full: one night, from an hour after sunset to sunrise, at most two
    tents. Outside the park, ask the individual facilities.
  source: er-avp
tags: [forests, monasteries, apennines, national-park]
notes:
  - >-
    The park's stage pages state distances that differ from its own GPX tracks (stage 3:
    19.4 km stated, 13.4 km in the GPX). The stated figures are used; check them against
    OpenStreetMap.
  - The park publishes no total length or difficulty grade; both come from a travel magazine.
  - >-
    OpenStreetMap has no route relation for the trail (checked 2026-10-27), only the park's
    numbered paths. The map line uses the park's GPX tracks, which may not be published.
  - >-
    The camping rule comes from a 2019 regional summary that cites the park's "provisional
    regulation"; check whether that regulation is still current.
