  types: [hotel, guesthouse, campsite]
  source: rs
wildCamping:
  status: restricted
  rule: >-
    Tents only at the official tent and trekking sites along the trail. Outside them only
    bivouacking, sleeping in the open or in a shelter, is tolerated. No fire in the forest, gas
    stoves included, from March to October.
  source: rs-camping
