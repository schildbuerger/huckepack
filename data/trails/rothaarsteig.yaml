  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T1
    basis: >-
      The Rothaarsteigverein rates the whole route "Mittel" and its stages "Mittel" to "Schwer"
      (for length), on "zahlreiche naturnahe Pfade abseits land- und forstwirtschaftlicher Wege"
      that need sturdy shoes; "alle Passagen auch im Winter begehbar", no steep or exposed
      passages. That is hiking on good paths (T1).
    source: rs
