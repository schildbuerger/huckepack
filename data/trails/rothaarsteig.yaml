    lat: 51.39892
    lon: 8.57538
    source: osm
  - kind: airport
    name: Paderborn/Lippstadt Airport (PAD)
    lat: 51.6146
    lon: 8.61906
    source: osm
  - kind: airport
    name: Frankfurt Airport (FRA)
    lat: 50.03989
    lon: 8.55985
    source: osm
tags: [sauerland, ridges, forests, watershed, suspension-bridge]
notes:
  - >-
    Stages: the whole-route tour says 157.7 km, 2,894 m up, 3,123 m down, highest point 838 m; its
    eight stage tours add up to 169.1 km, 3,396 m up and 3,616 m down (with the paths into the
    stage towns, e.g. Willingen, which lies off the ridge on a Zuweg). Stage 4's valley variant
    (Talvariante, 23.3 km, 396 m up, 441 m down) and the 52.5 km Westerwaldvariante to Dillenburg
    are marked variants, not in the record. The FAQ: Schanze, Rhein-Weser-Turm and Lahnquelle
    have little or no public transport.
  - >-
    Water: the FAQ warns that there are not everywhere places to eat and drink, "insbesondere auf
    den letzten beiden Etappen", so carry enough to drink. OSM has 14 drinking water points along
    the route; the longest stretch without one is 38.5 km (km 0.1–38.6, Brilon to beyond
    Willingen; the trail passes no village there, as the stage towns lie off the ridge).
  - >-
    Route (pipeline, 2026-10-31, Geofabrik extracts): no GPX (see stages), so the map line chains
    OSM's three section relations, each stage cut at the point nearest its end; every stage is
    fully matched, the main route 147.0 km against the stated 157.7 km. Stages 1–4 come out
    12–18 % shorter than stated (22.0, 20.7, 16.2 and 21.1 km against 25.9, 25.3, 18.8 and 24.2
    km): the stated stages include the access paths to Willingen and Schanze, which lie off the
    main trail, and the map line keeps to the main trail. Stage 6 comes out at 14.2 km against
    the stated 19.2 km; German Wikipedia's older stage over the same stretch (Lützel – Lahnhof)
    is 14.2 km too, so the stated figure likely includes paths off the trail.
  - >-
    Ascent: the stated whole-route pair (2,894 m up, 3,123 m down) is shown; the stage tours add
    up to 3,396 m up, and the terrain model gives about 4,380 m (it measures the treetops, and 81 %
    of the route runs through forest).
  - >-
    Tree line: none in reach. The route tops out at the Langenberg (843 m), the highest point of
    North Rhine-Westphalia, forested to the top; the Rothaargebirge has no natural tree line.
  - >-
    Data check (2026-10-31). Second source: German Wikipedia (156.8 km, opened 2001, Brilon
    Marktplatz to Dillenburg station, highest point the Langenberg 843.2 m, a white R lying on red,
    all year, "Qualitätsweg Wanderbares Deutschland", 8 stages normally, or 6 or 12). Its stage
    list follows an older split (Bruchhausen and Lützel as stage towns); where its stages run
    between the same places as the official ones they agree within 10 %: stages 3 (18.7 km), 4
    (23.5), 7 (18.4) and 8 (20.4 against 22.4, 9 %), stages 1+2 together (50.5 against 51.2 km)
    and 5+6 (32.6 against 33.6 km). Total 157.7 against 156.8 km, highest point 838 against
    843.2 m. Wikipedia gives no ascent per stage.
