name: Laugavegur
aliases: [Laugavegur Trail, Laugavegurinn]
website: https://www.fi.is/en/moya/adverts/425
managedBy:
  - name: Ferðafélag Íslands (Iceland Touring Association)
    url: https://www.fi.is/en
trailType: point-to-point
continents: [Europe]
countries: [IS]
regions: [Southern Region]
protectedAreas:
  # OSM protected areas containing the huts along the route
  - Friðland að Fjallabaki (Fjallabak Nature Reserve)
  - Katla UNESCO Global Geopark
termini:
  # the FÍ huts at either end (GPS on FÍ's hut pages)
  start:
    name: Landmannalaugar
    lat: 63.99333
    lon: -19.061
  end:
    name: Þórsmörk (Langidalur)
    lat: 63.68267
    lon: -19.51483
  source: fi-huts
established:
  year: 1978
  source: wikipedia
waymarking:
  text: Signposted throughout
  source: wikipedia
length:
  - km: 54
    source: fi
days:
  min: 4
  max: 4
  source: fi
stages:
  # FÍ's standard 4-day itinerary between its huts; times are FÍ's ranges. FÍ gives no ascent and
  # descent per stage (only one rounded height change each, see notes), so the page estimates them.
  # No GPX: `end` (the hut's GPS from FÍ) splits the OSM relation in `route`.
  source: fi
  list:
    - { number: "1", kind: main, from: Landmannalaugar, to: Hrafntinnusker, km: 12, minutes: 240, maxMinutes: 300, end: { lat: 63.93357, lon: -19.16848 } }
    - { number: "2", kind: main, from: Hrafntinnusker, to: Álftavatn, km: 12, minutes: 240, maxMinutes: 300, end: { lat: 63.85783, lon: -19.22733 } }
    - { number: "3", kind: main, from: Álftavatn, to: Emstrur (Botnar), km: 16, minutes: 360, maxMinutes: 420, end: { lat: 63.76633, lon: -19.37417 } }
    - { number: "4", kind: main, from: Emstrur (Botnar), to: Þórsmörk (Langidalur), km: 15, minutes: 360, maxMinutes: 420, end: { lat: 63.68267, lon: -19.51483 } }
route:
  # built by `python -m pipeline.routes laugavegur`: OSM ways matched to the OSM hiking relation
  # "Laugavegur" (1225037), split at the huts. Way 166493841 (role alternative, 2.8 km) closes a
  # 2.6 km gap in the main members after Álftavatn; 979223680 a 70 m one.
  source: osm
  publishable: true
  relation: 1225037
  alternatives: [166493841, 979223680]
difficulty:
  # no grade is published; our estimate, see the note on difficulty below
  estimated:
    sac: T2
    basis: >-
      FÍ publishes no grade. The trail follows a continuous, signposted path, steep in places
      (from 550 m to about 1,100 m at Hrafntinnusker and down again), often in fog, with snow
      patches early in the season and at least three unbridged rivers to wade. That is mountain
      hiking (T2); the river crossings and the weather make it harder than the grade suggests.
    source: fi
season:
  # huts open about 25 June to 15 September, depending on when the F-roads open
  months: [6, 7, 8, 9]
  text: Late June to mid-September
  source: fi
sleeping:
  # FÍ mountain huts (sleeping-bag accommodation, wardens in summer) with campsites beside each
  types: [hut, campsite]
  source: fi
wildCamping:
  status: prohibited
  rule: >-
    Tents only at the campsites beside the huts, booked in advance; FÍ asks hikers to pitch only in
    the designated areas and to leave nothing behind, not even food scraps or toilet paper. The
    trail runs through the Fjallabak Nature Reserve.
  source: fi
waterPoints:
  # FÍ's hut pages: every hut kitchen has running cold water (OSM tags almost none of it)
  source: fi-huts
  list:
    - { name: Landmannalaugar hut, lat: 63.99333, lon: -19.061 }
    - { name: Hrafntinnusker hut, lat: 63.93357, lon: -19.16848 }
    - { name: Álftavatn huts, lat: 63.85783, lon: -19.22733 }
    - { name: Hvanngil hut, lat: 63.83377, lon: -19.20845 }
    - { name: Emstrur (Botnar) huts, lat: 63.76633, lon: -19.37417 }
    - { name: Þórsmörk (Langidalur) hut, lat: 63.68267, lon: -19.51483 }
access:
  # Iceland has no railway: the buses to Landmannalaugar leave from Reykjavík's BSÍ terminal;
  # Keflavík is the international airport. Coordinates from OSM; distances by pipeline/access.py
  - kind: bus
    name: BSÍ bus terminal, Reykjavík
    lat: 64.13751
    lon: -21.93461
    source: osm
  - kind: airport
    name: Keflavík International Airport (KEF)
    lat: 63.98455
    lon: -22.62598
    source: osm
tags: [highlands, volcanic, geothermal, river-crossings, huts]
notes:
  - >-
    FÍ's trail page gives 54 km in its key figures and "55-kilometer route" in the text; its four
    stages add up to 55 km (12 + 12 + 16 + 15). Its itinerary list gives Álftavatn – Emstrur as
    17 km against 16 km in the stage table.
  - >-
    FÍ's stage table gives one rounded height figure per stage (470 m ascent, 490 m descent, 40 m
    descent, 300 m descent), apparently the net change between the huts, not the total climb and
    descent, so they aren't used as ascent and descent; its key figures give "500 m" elevation.
  - >-
    FÍ also lists 2- and 3-day itineraries (Landmannalaugar – Hvanngil – Þórsmörk; Landmannalaugar
    – Álftavatn – Emstrur – Þórsmörk) and a 4-day variant via Hvanngil (Hrafntinnusker – Hvanngil
    16 km, Hvanngil – Emstrur 13 km). The record keeps the standard 4 days.
  - >-
    The Fimmvörðuháls trail (Þórsmörk – Skógar, 27 km over two days) is a popular extension; it is
    a separate route (OSM relation 396940, operator Ferðafélagið Útivist) and not in this record.
  - >-
    Season months 6 and 9 are partial: the huts open about 25 June and close about 15–18
    September, depending on snow and when the Road Authority opens the F-roads. The Þórsmörk huts
    are open from early May to early October.
  - >-
    Huts and campsites must be booked before starting; Emstrur can't be booked on its own, only in a
    package. Garbage must be carried from Hrafntinnusker and Emstrur to the next hut.
  - >-
    No difficulty grade is published (FÍ: "suitable for experienced hikers"). The SAC T2 in
    `difficulty.estimated` is our translation; the river fords (Grashagakvísl, Bratthálskvísl,
    Bláfjallakvísl, Þröngá and others) are not part of the SAC hiking scale.
  - >-
    OSM tags almost no drinking water along the trail, so `waterPoints` adds the running cold water
    FÍ lists for every hut. The Landmannalaugar hut lies about 300 m from where the OSM route starts,
    beyond the water step's 250 m, so it isn't counted (an OSM tap at km 0 is); at Álftavatn an
    OSM tap about 100 m from the huts counts separately.
  - Highest point on the trail is Hrafntinnusker at about 1,050 m (Wikipedia) or 1,100 m (FÍ hut page).
  - >-
    Data check (2026-10-29). Second source for the overview: Wikipedia (54 km against the stage sum
    of 55 km, 4 days, June to September, highest point 1,050 m against 1,053 m from the terrain
    model), all within 10 %. No independent source gives stage figures (only tour operators and
    blogs, which disagree), so the stage lengths, times, huts, season, sleeping and camping rules
    were checked on the built page against FÍ's trail and hut pages: they match. More than 10 %
    apart: Wikipedia's "500 m" elevation gain and loss (apparently the net height difference, also
    FÍ's key figure) against our terrain-model estimate of ≈ 1,400 m up and ≈ 1,750 m down; guides
    quote around 1,700 m up, so our estimate is likely low (listed in `dataCheck`).
dataCheck:
  # working rule 2: Wikipedia for the overview; the stages, which no independent source gives,
  # checked on the page against FÍ
  date: 2026-10-29
  against: [wikipedia]
  pageAgainst: [fi, fi-huts]
  deviations:
    - { figure: "Ascent and descent", ours: "≈ 1,400 / ≈ 1,750 m (our estimate)", theirs: "500 m", source: wikipedia }
