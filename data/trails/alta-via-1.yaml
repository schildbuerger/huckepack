animals:
  # Grazing cattle on the alpine pastures (the Province of Bolzano's sheet with the farmers' union).
  # Level ours
  list:
    - kind: cattle
      name: "Cattle on alpine pastures"
      level: moderate
      basis: "Cows, horses, sheep and goats graze the high pastures in summer. Cows, above all mothers with calves, defend their herd, and a herd that panics can run off uncontrolled; the danger signs are an animal that fixes you and lowers its head."
      do:
        - "Keep a safe distance from grazing animals and stay on the marked path"
        - "Walk round animals standing on the path rather than driving them off"
        - "Keep a dog on a short lead and away from mother cows and calves"
        - "If the herd grows restless, leave the pasture quickly"
        - "If animals come towards you, don't turn your back: walk calmly away"
        - "Always close the pasture gates behind you"
      dont:
        - "Touch, feed or lure the animals"
        - "Startle them with noise, drones, wild gestures or running"
        - "Run away from an approaching animal or crouch down"
      source: bz-alm
tags: [dolomites, huts, alpine, world-war-i, national-park, nature-park]
notes:
  - >-
    The route runs south from Lago di Braies in the Puster Valley through the Fanes plateau, over
    the Lagazuoi (2,752 m, its highest point) and past the Cinque Torri, the Croda da Lago, the
    Pelmo and the Civetta, then through the Moiazza and the Prampèr-Mezzodì group into the Dolomiti
    Bellunesi National Park and down from the Schiara to Belluno. Proposed by Piero Rossi in 1969.
  - >-
    End: the guide gives Belluno as the arrival ("Luogo di arrivo: Belluno") but its last stage's
    figures (about 9 km, 100 m up, 1,570 m down, 5 h) end at Case Bortòt, the road head 2 hours
    above the town ("ore 7 fino a Belluno", 1,900 m down), and its 125 km total counts them so. The
    record ends at Case Bortòt with the official figures; OSM's relation runs on into Belluno.
  - >-
    Source age: the guide is the Province's 2005 edition (reprinted 2007), still hosted by the
    destination body, whose page today gives the same 125 km, 12 stages and 7,300 m. Variants
    (the Castelletto gallery, the Croda da Lago, the Schiara via ferrata) are left out. Highest
    point Rifugio Lagazuoi 2,752 m, lowest Belluno 389 m (Case Bortòt 568 m) in the guide.
  - >-
    Wildlife: grazing cattle from the Province of Bolzano's sheet (2026-11-04). Ticks: the
    official Italian tick pages found were behind bot checks or gone, and a CAI leaflet puts ticks
    below 1,200 m, under this route, so none is listed. Camping: the Ampezzo park forbids tents; English Wikipedia says camping is forbidden along the
    whole route, without an official source for the national park's rule (said to be article 20 of
    its regulation), so the page states only the Ampezzo park's rule.
  - >-
    Map line (2026-11-04, Geofabrik extract nord-est): OSM's relation 177743 cut at the stage ends,
    every stage 100 % matched, 122.2 km against the guide's 125 km. Stages 3, 4 and 6 follow the
    relation's excursion and alternative ways the guide walks (`via`). Stage lengths on the map
    line within 10 % of the guide's "circa" figures except stage 2 (12.9 against 14 km), stage 5
    (13.2 against 11 km) and stage 12 (7.7 against 9 km). Highest point 2,722 m on the terrain
    model at Rifugio Lagazuoi (2,752 m in the guide), lowest 698 m at Case Bortòt (568 m in the
    guide). The terrain model's ascent (about 9,360 m on GLO-30; about 8,880 m on GEDTM30 with the 10 m
    threshold since 2026-11-07) runs far above the guide's 7,330 m stage
    sum (about 7,300 m stated): the page shows the guide's stage climbs.
  - >-
    Resupply: OSM maps three shops along the route, none in the first 67.6 km (Lago di Braies to
    the Cinque Torri); the huts serve meals and sell some food, as everywhere on the route.
  - >-
    Data check (2026-11-04): the Province's guide against English Wikipedia (Alta Via 1) and the
    DMO Dolomiti Bellunesi's page. Agree: 125 km (both), 12 stages and 7,300 m of climbing (the
    DMO), the start at Lago di Braies, the twelve stage ends and the stage times and climbs
    (Wikipedia's itinerary gives the same 3.5, 4.5, 5, 5.5 h … and 900, 565, 1,070, 635 m …),
    the highest point Lagazuoi 2,752 m, the season late June to September (Wikipedia: "late June
    to mid September"). Differ: Wikipedia says 7–12 days (the guide 12), ends in Belluno (the
    guide's figures at Case Bortòt, see End) and calls the waymarks "dark blue triangles with an
    inset number one" (the guide: red triangles); Wikipedia's lowest point is La Pissa 448 m, on
    another way down. No deviation over 10 % between the sources; the map line's stage lengths
    and the terrain model's ascent against the guide are listed in dataCheck.
dataCheck:
  # working rule 2: English Wikipedia and the destination body's page
  date: 2026-11-04
  against: [wikipedia, dmo-bl]
  deviations:
    - { figure: "Stage 2 length (map line)", ours: "14 km", theirs: "12.9 km on the OSM map line", source: osm }
    - { figure: "Stage 5 length (map line)", ours: "11 km", theirs: "13.2 km on the OSM map line", source: osm }
    - { figure: "Stage 12 length (map line)", ours: "9 km", theirs: "7.7 km on the OSM map line", source: osm }
    - { figure: "Ascent (terrain model)", ours: "7,330 m (stage sum)", theirs: "about 8,880 m (terrain model, 2026-11-07)", source: gedtm30 }
