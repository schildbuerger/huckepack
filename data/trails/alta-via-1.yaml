  # tratti di EEA al Màrmol (I e II grado)", stage 5 EEA on the descent from the Nuvolau
  cai:
    grade: EEA
    source: prov-bl
season:
  # "Periodo consigliato: da fine giugno a fine settembre"; the huts open about 20 June to 20
  # September
  months: [6, 7, 8, 9]
  text: Late June to late September, while the huts are open
  source: prov-bl
sleeping:
  # "Rifugi sul percorso principale: 15; Bivacchi sul percorso principale: 1"
  types: [hut]
  source: prov-bl
wildCamping:
  # the Ampezzo Dolomites Nature Park's rules: "a quote più alte esistono bivacchi fissi e rifugi
  # alpini attrezzati per il pernottamento, perciò non si può campeggiare con tende e camper"
  status: prohibited
  rule: >-
    No tents: in the Ampezzo Dolomites Nature Park camping with tents is not allowed, as there are
    huts and fixed bivouacs for the night; sleep in the huts along the route.
  source: ampezzo-park
