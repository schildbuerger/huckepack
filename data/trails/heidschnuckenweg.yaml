animals:
  # ticks: Lyme disease all over Germany (the federal health agency's advice); the trail's districts
  # (Harburg, Heidekreis, Celle) are no TBE risk areas. Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; about one tick bite in 100 leads to the illness, which antibiotics treat well when caught early."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [heath, heidschnucken, juniper, rivers]
notes:
  - >-
    Days: the site suggests no number of days for the whole trail (searched 2026-11-06); the page
    counts one day per stage (13).
  - >-
    Length: the site states no total; the 13 main stages add up to 225 km (the variants 21 and 12
    km).
  - >-
    Wild camping: the site gives no rule; Lower Saxony's forest law doesn't allow tents in the
    woods, and the Lüneburger Heide nature reserve forbids camping (not recorded without the
    operator's words).
  - >-
    Tree line: none; the highest point is 169 m (the site).
  - >-
    Map line (2026-11-06): the Hamburg and Niedersachsen Geofabrik extracts (2026-11-04 and
    2026-10-31), each stage matched to its own GPX from the site. Every stage at least 96 % matched
    but stage 9 (88 %): its GPX is coarse (130 points over 7 km) and cuts corners, up to 262 m off
    near 52.881, 10.122. The main route measures 222.0 km against the stages' 225 km; the variant to
    stage 11 (Müden–Weesen) 10.7 km against 12 km. Ascent from the terrain model, about 1,140 m
    (GEDTM30, 2026-11-07; the site gives none). Water: OSM maps 15 drinking water points, none in
    the last 59 km from Weesen to Celle; the site offers a list of drinking water points as a PDF
    ("Trinkwasserstellen am Heidschnuckenweg"), not yet added. Celle station is at the finish (118
    km by road from the start).
  - >-
    Data check (2026-11-06, working rule 2): against German Wikipedia (Heidschnuckenweg). Length 223
    km against the stages' 225 km (1 % apart); Hamburg-Neugraben-Fischbek to Celle agrees; a
    Qualitätsweg Wanderbares Deutschland agrees; Wikipedia names the Verein Naturparkregion
    Lüneburger Heide e. V. as the trail's carer, the site is published by the Lüneburger Heide GmbH and
    its partners. Wikipedia gives no stage distances. No figure differs by more than 10 %.
