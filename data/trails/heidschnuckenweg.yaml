  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T1
    basis: >-
      "Die höchste Erhebung des Heidschnuckenwegs beträgt 169 Meter. Der Weg ist damit auch für
      ungeübte Wanderer gut zu bewältigen": sandy heath tracks, forest paths and river meadows in
      the lowlands. Hiking on paths (T1).
    source: hsw-char
