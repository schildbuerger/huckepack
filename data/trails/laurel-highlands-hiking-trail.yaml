  # insets ("South: Ohiopyle Trailhead: 6.3 Mi. North: Rt. 653 Shelters: 12.2 Mi." …), which match
  # the Stay the Night page's mileage table (shelter areas at miles 6.3, 18.5, 24, 32.5, 38.2,
  # 46.5, 56.9 and 64.9 of 70). Camping is allowed only in these shelter areas, one night each,
  # reserved in advance. The numbering is ours, in DCNR's south-to-north order. Stage ends on the
  # OSM relation at each shelter area's blue-blazed connector
  source: dcnr-guide
