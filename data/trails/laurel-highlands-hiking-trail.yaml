  - kind: airport
    name: Pittsburgh International Airport (PIT)
    lat: 40.49178
    lon: -80.23702
    source: osm
animals:
  # DCNR's recreational guide ("A word on Pennsylvania black bears"; it also prints the CDC's
  # blacklegged tick card); the tick advice from the CDC. Levels ours
  list:
    - kind: bear
      name: Black bear
      level: moderate
      basis: Laurel Ridge State Park has excellent habitat for black bears, which roam freely and normally avoid people but can become aggressive when people get between them and food.
      do:
        - Keep your campsite clean and clean up after meals
        - When backpacking, store food away from your overnight campsite, suspended between two trees, ten feet in the air and three feet from either tree
        - If you encounter a black bear, back away slowly without making direct eye contact
        - If the bear does not leave the area, make a loud noise like blowing a whistle or banging a pot
      dont:
        - Never approach a bear, and be especially wary of mother bears with cubs
        - Do not run
      source: dcnr-guide
    - kind: tick
      name: Blacklegged tick (deer tick)
      level: moderate
      basis: DCNR's guide to the trail prints the CDC's blacklegged tick card; the tick carries Lyme disease.
      do:
        - Walk in the center of trails
        - Use EPA-registered insect repellents containing DEET, picaridin, IR3535, Oil of Lemon Eucalyptus (OLE), para-menthane-diol (PMD), or 2-undecanone
        - Treat boots, clothing and gear with permethrin
        - Check your body, clothing, gear and pets for ticks after being outdoors
      dont:
        - Avoid wooded and brushy areas with high grass and leaf litter
      source: cdc-ticks
tags: [forest, ridge, river]
notes:
  - >-
    Stages: DCNR publishes no numbered stages or sections. Its official trail map gives each of the
    eight shelter areas with the miles to its neighbours, and camping is only allowed in those
    areas, one night each, so the record takes those nine legs as stages (6.3, 12.2, 5.5, 8.5, 5.7,
    8.3, 10.4, 8.0 and 5.1 miles = 70.0 miles); the numbers are ours. DCNR's mileage table also lists
    the six trailheads (Ohiopyle 0, Rt. 653 18.8, Rt. 31 30.6, Rt. 30 45.8, Rt. 271 56.9, Rt. 56
    Seward 70) and the Maple Summit Road day parking (11.2).
  - >-
    Days (2026-11-07): one per leg of DCNR's list (9, eight nights in the shelter areas). DCNR gives
    no days ("a pace of 1.5 miles per hour is average"); English Wikipedia and the Laurel Highlands
    Visitors Bureau's FAQ give none; the National Park Service's end-to-end page is gone (404).
  - >-
    Tree line: not added; the route stays below 1,500 m (highest point 2,961 ft, 903 m, near Seven
    Springs on DCNR's elevation profile).
  - >-
    Wildlife: Wikipedia's infobox also names rattlesnakes as a hazard; DCNR's trail pages give no
    snake advice, so only the black bear and the blacklegged tick are listed.
  - >-
    Map line (2026-11-06): the Pennsylvania Geofabrik extract (2026-11-05); OSM's Laurel Highlands
    Hiking Trail relation (7192246, operator PA DCNR), its main line chained from Ohiopyle to the
    Rt. 56 trailhead (the relation's 47 connector and shelter-area ways, 15.3 km, left out) and cut
    at the eight shelter areas' connectors, every stage 100 % matched. It measures 104.0 km against
    DCNR's 70 miles (112.7 km, −7.7 %); OSM draws the trail with long, sparsely noded ways (one of
    34.9 km), which cut the bends short. Highest point 910 m at km 38.8 (GEDTM30, 2026-11-07; DCNR's
    profile: 2,961 ft, 903 m, near Seven Springs), lowest 370 m at Ohiopyle (about 1,200 ft, 366 m,
    on the profile). The terrain model gives about 2,660 m of climbing; none is stated.
  - >-
    Stages 1, 2, 4, 6 and 9 measure 11–13 % under DCNR's miles on the map line (9.0 against 10.1 km,
    17.6 against 19.6, 12.2 against 13.7, 11.7 against 13.4, 7.2 against 8.2); the others within
    10 %. The whole line is 7.7 % short for the same reason (long OSM ways cutting the bends), and
    DCNR's miles count to the shelter areas along their connectors; the record keeps DCNR's miles.
  - >-
    Water: OSM maps 1 drinking water point and 2 springs near the trail; the check's longest stretch
    without drinking water is 57.6 km (km 0–57.6). DCNR: non-potable water at most trailheads and
    shelter areas (pumps), to be treated or filtered, so water comes every 6 to 12 miles at the
    shelter areas.
  - >-
    Resupply: OSM maps 2 shops near the trail, the longest stretch without one 96.7 km (from
    Ohiopyle); the trail stays on the ridge, away from towns, and DCNR names no resupply on the way.
  - >-
    Beds: OSM maps 2 places to sleep near the trail, the longest stretch without one 49.2 km
    (km 35–85); DCNR's eight shelter areas (five Adirondack shelters and 25 tent spaces each) lie
    every 5.1 to 12.2 miles, most of them not mapped as camp sites in OSM.
  - >-
    Data check (2026-11-06): against English Wikipedia. Length 70 miles (112.7 km) agrees with its
    70.1 miles (112.8 km, +0.1 %); the termini (Ohiopyle State Park, PA Route 56 near Johnstown), the
    season (year-round), the yellow and blue blazes, the eight shelter areas with reservations and fee
    agree; its shelter positions ("just past mile 6", "just past 17", about 24, "just after 32", 38,
    46, 57 and 64 miles) agree with DCNR's 6.3, 18.5, 24, 32.5, 38.2, 46.5, 56.9 and 64.9 within
    10 % (the Rt. 653 area 8 % apart). Its "room for up to thirty tents" at each area is 20 % over
    DCNR's 25 tent spaces; the record keeps DCNR's. Difficulty: Wikipedia "Moderate to strenuous",
    DCNR "Most difficult"; our T2 sits between. It gives no days, stage miles or opening year (only
    "construction began in 1970"); the legs' miles, the opening date (15 May 1974), the permit and
    camping rules on the built page were checked one by one against DCNR's guide and pages and agree.
  - >-
    Preflight (2026-11-06): pipeline.preflight flags the OSM relation as a blocker ("one line from the
    start 105.5 km (87 %)"): the 15.3 km left over are the blue-blazed connectors and shelter-area
    paths in the relation; the main line runs unbroken from DCNR's southern to its northern terminus,
    so the relation is used.
