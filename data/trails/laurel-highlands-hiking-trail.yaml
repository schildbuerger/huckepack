waymarking:
  # the Stay the Night page
  text: >-
    Yellow blazes, two by five inches, about every 100 feet; blue-blazed connector trails to the
    trailheads and shelter areas; stone mileage monuments every mile, and yellow bands round the trees
    at every major road crossing.
  symbol: yellow-blaze
  source: dcnr-stay
length:
  # "the 70-mile Laurel Highlands Hiking Trail"; the shelter legs sum to 70.0 miles
  - km: 112.7
    source: dcnr-park
days:
  # one day per main stage of DCNR's legs between the shelter areas
  min: 9
  max: 9
  basis: stages
  source: dcnr-guide
stages:
