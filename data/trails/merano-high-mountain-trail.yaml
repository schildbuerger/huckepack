termini:
  # the official stage 1 starts (and stage 9 ends) at Ausserhütt (Capanne di Fuori) in the
  # Pfelders valley; first point of the stage 1 GPX
  start:
    name: Ausserhütt (Capanne di Fuori)
    lat: 46.81221
    lon: 11.13862
  end:
    name: Ausserhütt (Capanne di Fuori)
    lat: 46.81221
    lon: 11.13862
  source: meranerland
established:
  year: 1985
  source: brochure
waymarking:
  # "durchgängig mit weiß/rot und der Nummer 24 markiert" (ich-geh-wandern.de; wandersite.ch
  # likewise); the tourist association names the path number only
  text: Red-white-red with the number 24, on every section
  symbol: cai
  number: "24"
  source: igw
length:
  - km: 100
    approx: true
    source: meranerland
days:
  # "in five to eight daily stages"; the nine official stages can be walked one to three a day
  min: 5
  max: 8
  source: brochure
stages:
  # the nine stages of meranerland.org, clockwise, with its times, lengths and climbs; each with
  # its GPX (kept local, it only guides the OSM matcher). Stage 4 there starts at the Leiter Alm,
  # reached by lift: its own page ends stage 3 with the cable car down to Dorf Tirol. The trail
  # walks on (path 24, the Hans-Frieden-Weg from Hochmuth to the Leiter Alm, brochure), so the main
  # stage 4 is the tourist association's walked stage from Hochmuth, by the Muthöfe where stage 3
  # ends (meranerland.org's lift start from the Leiter Alm is left out: a ride, not a route)
  source: meranerland
