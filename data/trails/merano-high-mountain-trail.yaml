    - { number: "5", kind: main, from: Giggelberg, to: Unterstell, km: 8.6, ascentM: 449, descentM: 701, minutes: 180, track: "https://www.meranerland.org/external/gpx/?id=4389&lang_id=12" }
    - { number: "6", kind: main, from: Unterstell, to: Katharinaberg, km: 7.1, ascentM: 381, descentM: 427, minutes: 150, track: "https://www.meranerland.org/external/gpx/?id=4398&lang_id=12" }
    - { number: "7", kind: main, from: Katharinaberg, to: Vorderkaser, km: 7.5, ascentM: 588, descentM: 148, minutes: 180, track: "https://www.meranerland.org/external/gpx/?id=4407&lang_id=12" }
    - { number: "8", kind: main, from: Vorderkaser, to: Stettiner Hütte, km: 11.8, ascentM: 1212, descentM: 31, minutes: 270, track: "https://www.meranerland.org/external/gpx/?id=4412&lang_id=12" }
    - { number: "9", kind: main, from: Stettiner Hütte, to: Ausserhütt, km: 14.6, ascentM: 32, descentM: 1451, minutes: 260, track: "https://www.meranerland.org/external/gpx/?id=4421&lang_id=12" }
route:
  # built by `python -m pipeline.routes merano-high-mountain-trail`: OSM ways matched to the official GPX
  source: osm
  publishable: true
difficulty:
  # no grade is published; our estimate from the official descriptions
  estimated:
    sac: T3
    basis: >-
      The tourist association writes for "experienced and sure-footed hikers": some places need
      sure-footedness, a head for heights and care, exposed places have chains, ropes or
      railings (steps and cables before Giggelberg, the "Thousand Steps" gorge), and the trail
      crosses the Eisjöchl at about 2,895 m to the Stettiner Hütte; it is "often described as
      easy and safe - but we can't quite confirm this". Secured, exposed passages make it
      demanding mountain hiking (T3).
    source: brochure
treeLine:
  # "In Südtirol schwankt die natürliche Waldgrenze nämlich aktuell zwischen 1900 und 2200 Metern"
  # (higher on sunny south slopes, lower on north slopes)
  m: 2200
  fromM: 1900
  source: stol
season:
  # the northern part with the Eisjöchl is a summer tour; the southern and eastern parts all year
  months: [6, 7, 8, 9, 10]
  text: Late June to early October for the whole loop, depending on snow
  source: infosheet
sleeping:
  # the brochure lists mountain huts (Schutzhäuser), inns and guesthouses, farms with rooms or flats
  # and a campsite in Pfelders
  types: [hut, guesthouse, farm-stay, campsite]
  source: brochure
wildCamping:
  status: prohibited
  rule: >-
    Camping is not allowed in the Texelgruppe Nature Park, which the trail runs around and through.
  source: texelgruppe
access:
  # Merano is the main station (buses into the valleys, cable cars to the stage starts);
  # airports at Innsbruck and Verona. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Merano station
    lat: 46.67266
    lon: 11.15009
    source: osm
  - kind: airport
    name: Innsbruck Airport (INN)
    lat: 47.25973
    lon: 11.34187
    source: osm
  - kind: airport
    name: Verona Airport (VRN)
    lat: 45.39717
    lon: 10.8859
    source: osm
tags: [alpine, loop, nature-park, huts, farms]
notes:
  - >-
    Name: the official English pages use both "Merano High Mountain Trail" (merano-suedtirol.it)
    and "Alta Via di Merano" (meranerland.org); the German name is Meraner Höhenweg. The record
    keeps the English name with the German as the local name.
  - >-
    The nine main stages add up to 95.7 km, 5,012 m of ascent and 5,028 m of descent, against
    "almost 100 km". meranerland.org's stage 4 starts at the Leiter Alm (by chair lift and basket
    lift from Algund), so its stages don't join between the Muthöfe and the Leiter Alm; its own
    stage 3 page takes the cable car down from Hochmuth. The brochure's trail walks that piece on
    path 24 (the Hans-Frieden-Weg, Hochmuth – Leiteralm, 1 h), and the tourist association's own
    stage page starts there (merano-suedtirol.it, Hochmuth – Giggelberg, 13.6 km): it is the main
    stage 4 (2026-10-30). meranerland.org's stage 4 (Leiter Alm – Giggelberg, 11.8 km, 604 m up,
    555 m down, 4:20 h) isn't listed, not even as a variant: it differs only by the lift ride. Some stage ends are still a little off the
    loop where cable cars or buses arrive (stage 4 ends at the Texelbahn mountain station, about
    1 km from the Giggelberg inn where stage 5 starts). With the meranerland stage 4 instead the
    sum was 93.9 km, 4,876 m up and 5,050 m down.
  - >-
    Opened in 1985 at Katharinaberg; created by the AVS mountain guides Robert Schönweger and
    Helmuth Ellmenreich (brochure).
  - >-
    The stage pages show every month as the recommended time of year (each stage is also a day
    hike); the season comes from the tourist association's info sheet: the northern part is a
    summer tour from late June to early October depending on snow, the southern and eastern parts
    are walkable all year.
  - >-
    A section between Katharinaberg and the Pfossental has been closed at times because of rockfall
    (reported by third parties); check current notices before walking.
  - >-
    Route (pipeline, 2026-10-29): the OSM match covers 100 % of eight stage tracks and 91 % of
    stage 3 (Vernuer – Muthöfe), where OSM is probably missing a short path; the map line's main
    route is shorter than the stage sum because the stages don't join everywhere.
    Highest point from the terrain model 2,889 m (Eisjöchl, officially 2,895 m).
  - >-
    Data check (2026-10-29). Second source: German Wikipedia (93 km in its infobox and "ca. 100 km"
    in the text against the official "almost 100 km" and the stage sum of 93.9 km; opened 1985;
    highest point Eisjöchl 2,895 m; path no. 24; summer season, July to September in the infobox)
    agrees. More than 10 % apart: Wikipedia's "four to six daily stages" against the brochure's
    five to eight. Its "ca. 6,000 m" of ascent and descent isn't comparable (combined or rounded).
    No independent source gives the stage figures, so the stage lengths, times and climbs were
    checked on the built page against the official stage pages.
  - >-
    Data check of the new main stage 4 (2026-10-30). Second source: Bergwelten (Hochmuth –
    Giggelberg: 13.5 km, 4:30 h, 875 m up, 657 m down, highest point 1,839 m); the length agrees.
    More than 10 % apart: the time (5:50 h against 4:30 h), the ascent (740 m against 875 m) and
    the descent (533 m against 657 m). The association's brochure (not independent) gives 13.4 km,
    about 6 h, 850 m up and 550 m down for the same stage.
  - >-
    Tree line (2026-10-30): stol.it gives South Tyrol's natural tree line as 1,900–2,200 m. Second
    source: BFW's forest growth region 1.1 (Ötztal, across the main ridge from the Texelgruppe)
    puts the top of the high-subalpine zone at 2,000–2,300 m (within 10 %). The route climbs to
    2,889 m (Eisjöchl).
dataCheck:
