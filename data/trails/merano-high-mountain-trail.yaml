    - { number: "1", kind: main, from: Ausserhütt, to: Matatz, km: 12.7, ascentM: 391, descentM: 787, minutes: 240, track: "https://www.meranerland.org/external/gpx/?id=4356&lang_id=12" }
    - { number: "2", kind: main, from: Matatz, to: Vernuer, km: 12.0, ascentM: 637, descentM: 599, minutes: 230, track: "https://www.meranerland.org/external/gpx/?id=4364&lang_id=12" }
    - { number: "3", kind: main, from: Vernuer, to: Muthöfe, km: 7.8, ascentM: 582, descentM: 351, minutes: 225, track: "https://www.meranerland.org/external/gpx/?id=4374&lang_id=12" }
