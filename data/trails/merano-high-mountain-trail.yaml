  date: 2026-10-30
  against: [wikipedia, bergwelten, bfw]
  pageAgainst: [meranerland]
  deviations:
    - { figure: "Days", ours: "5–8 days", theirs: "4–6 days", source: wikipedia }
    - { figure: "Stage 4 time", ours: "5:50 h", theirs: "4:30 h", source: bergwelten }
    - { figure: "Stage 4 ascent", ours: "740 m", theirs: "875 m", source: bergwelten }
    - { figure: "Stage 4 descent", ours: "533 m", theirs: "657 m", source: bergwelten }
