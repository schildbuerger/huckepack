route:
  # built by `python -m pipeline.all adlerweg`: OSM ways matched to Tirol Werbung's GPX
  source: osm
  publishable: true
difficulty:
  # Tirol Werbung grades its stages easy to difficult ("leicht", "mittelschwierig", "schwierig")
  # and rates condition and technique out of 6; no SAC grade. Our estimate
  estimated:
    sac: T3
    basis: >-
      Tirol Werbung grades its stages moderate or difficult (one easy): alpine paths from hut to hut
      through the Kaisergebirge, Rofan, Karwendel and Lechtal Alps and past the Großvenediger and
      Großglockner, rating condition and technique up to 5 of 6, with climbs of up to 1,590 m a day.
      Demanding mountain hiking (T3).
    source: tw
treeLine:
  # the BFW's high-subalpine zone: in the northern intermediate Alps (growth regions 2.1 and 2.2, the
  # Nordtirol stages) "1800–2050 (2150)" m, in the East Tyrol central Alps (1.2) "1950–2200 (2300)" m
  m: 2200
  fromM: 1800
  source: bfw
season:
  # every stage page marks its best months; all 33 share July to September (most also June, the
  # lower North Tyrol stages May to October)
  months: [7, 8, 9]
  text: July to September, when every stage is in season
  source: tw
sleeping:
  # alpine huts and inns at the stage ends (Tirol Werbung's stage pages)
  types: [hut, guesthouse]
  source: tw
wildCamping:
  # "In Tirol ist es grundsätzlich verboten, außerhalb von Campingplätzen zu campieren", except for
  # bivouacking "im hochalpinen Gelände (oberhalb der Waldgrenze)" (oesterreich.gv.at, 16 March 2026)
  status: prohibited
  rule: >-
    Camping outside campsites is prohibited in Tyrol; a one-off emergency bivouac in high alpine
    terrain above the tree line is allowed.
  source: oegv-campen
access:
  # Innsbruck Hauptbahnhof, Tyrol's main station, and Innsbruck and Munich airports. Coordinates
  # from OSM; distances by pipeline/access.py
  - kind: station
    name: Innsbruck Hauptbahnhof
    lat: 47.26319
    lon: 11.40109
    source: osm
  - kind: airport
    name: Innsbruck Airport (INN)
    lat: 47.25973
    lon: 11.34187
    source: osm
  - kind: airport
    name: Munich Airport (MUC)
    lat: 48.35396
    lon: 11.77859
    source: osm
animals:
  # Cattle on the alpine pastures (the Austrian ministry's 10 rules) and ticks (AGES: TBE risk all over Austria). Levels ours
  list:
    - kind: cattle
      name: "Cattle on alpine pastures"
      level: moderate
      basis: "The trail crosses alpine pastures where cattle graze in summer; mother cows protect their calves, and dogs make an encounter riskier."
      do:
        - "Avoid contact with grazing animals and keep a safe distance; stay calm and don't startle them"
        - "Stay on the marked paths"
        - "Keep your dog under control on a short lead; if an animal is about to attack, let the dog off at once"
        - "If cattle approach: stay calm, don't turn your back on them, step out of their way"
        - "At the first sign of unrest, leave the pasture quickly"
        - "Use gates where there are any, close them behind you and cross the pasture quickly"
        - "Walk round animals blocking the path with as wide a berth as you can"
      dont:
        - "Feed the animals"
        - "Let mother cows and dogs meet"
      source: bml-almen
    - kind: tick
      name: "Ticks (tick-borne encephalitis, Lyme disease)"
      level: moderate
      basis: "AGES, Austria's health agency, says the risk of catching tick-borne encephalitis (TBE) from a tick bite exists all over Austria, one of the most affected countries in Central Europe."
      do:
        - "Get vaccinated against TBE before you go: AGES calls it the best protection, also for travellers to Austria"
        - "Wear closed clothing that fits well"
        - "Check your body for ticks after walking through forest, bushes, tall grass or meadows"
      source: ages-fsme
tags: [alpine, huts, national-park, limestone-alps, glaciers]
notes:
  - >-
    The Adlerweg crosses Tyrol from east to west: from St. Johann in Tirol along the Wilder Kaiser to
    Kufstein, through the Brandenberger Alps and the Rofan to the Achensee, through the Karwendel to
    the Nordkette above Innsbruck, past the Zirbenweg and the Solstein, through the Gaistal to
    Ehrwald, and through the Lechtal Alps from hut to hut to St. Christoph am Arlberg. The East Tyrol
    Adlerweg (stages 25–33, Tirol's O1–O9) runs separately from Ströden in the Virgental round the
    Großvenediger and the Großglockner to the Lucknerhaus.
  - >-
    Gaps between stages: the North Tyrol stages don't all join end to end (Kufstein to the start of
    stage 4, the Gwercherwirt to Pinegg, the Nordkette and the Zirbenweg above Innsbruck, Innsbruck
    to the Solsteinhaus start), where walkers take a bus, a cable car or the train; the East Tyrol
    part starts about 120 km from the North Tyrol route. The figures follow Tirol Werbung's stages.
  - >-
    Rides: stage 8 starts with the Rofanseilbahn down from the Erfurter Hütte to Maurach, stage 12
    ends with the Hafelekarbahn, the Seegrubenbahn and the Hungerburgbahn down into Innsbruck, and
    stage 17 takes the Grubigsteinbahn from Lermoos up to the Grubigalm (Tirol Werbung's stage
    pages; the official GPX runs along the lifts). They are transfers inside their stages, not
    walked and in no figure; with them cut out, stages 8 and 12 match fully, 17.0 and 13.0 km
    against Tirol's 17 and 13 km.
  - >-
    Map line: the official GPX guides the OSM matcher. Where it leaves the mapped paths, the line
    follows the nearest one: stage 22 (Memminger Hütte to Ansbacher Hütte) for 1.4 km about 2 km
    after the start, up to 450 m off (86 % matched); stage 31 near the Silesia Höhenweg for 0.7 km
    after the Sudetendeutsche Hütte, up to 215 m off (82 %); stage 14's first 0.4 km at Hochzirl,
    up to 200 m (93 %); short stretches on stages 5 and 17 (94 %). Probably older lines or paths
    OSM lacks; noted 2026-11-03.
  - >-
    Stage lengths: six stages' map lines differ from Tirol's stated km by more than 10 %, mostly
    because Tirol's own GPX does: stage 4 9.3 km (GPX 9.7) against 10.7 km, stage 5 16.1 (GPX 15.8)
    against 18.0, stage 30 11.0 (GPX 12.0) against 8.0, stage 17 22.9 (GPX 20.8, without the lift)
    against 19.0; stages 28 (8.7 against 10.0 km) and 31 (6.5 against 7.5 km) where the line takes
    the mapped path (above). The page keeps Tirol's figures.
  - >-
    Along the way: OSM has no shop from the Ansbacher Hütte (stage 23) to the end of the East Tyrol
    part, 117 km of map line, where the huts serve meals; and no place to sleep mapped between the
    Gasthof Buchacker and Steinberg am Rofan (stages 5–6, 33 km), though Tirol ends stage 5 at the
    Gasthof Gwercherwirt.
  - >-
    Data check (2026-11-03): Tirol Werbung's figures against German Wikipedia (Weitwanderwege in
    Österreich, Adlerweg): North Tyrol 329.9 km in 24 stages against 320 km in 24 day stages (3 %),
    East Tyrol 94.5 km in 9 stages against 93 km in 9 (2 %); St. Johann in Tirol to St. Christoph am
    Arlberg: agree. The stated 30,000 m of climbing against the stages' 29,958 m. No deviation over
    10 %.
  - >-
    Wikidata: no item of its own (2026-11-04): German Wikipedia covers the Adlerweg only in its list
    "Weitwanderwege in Österreich".
