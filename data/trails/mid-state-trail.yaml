animals:
  # DCNR's black bear advice ("A word on Pennsylvania black bears", in its Laurel Ridge guide, the
  # same words as the Laurel Highlands Hiking Trail's record), DCNR's timber rattlesnake page and the
  # CDC's tick advice. Levels ours
  list:
    - kind: bear
      name: Black bear
      level: moderate
      basis: The association says that if you hike alone "you will meet more bears than people"; the Game Commission finds bears in large forested areas over three-quarters of the state.
      do:
        - Keep your campsite clean and clean up after meals
        - When backpacking, store food away from your overnight campsite, suspended between two trees, ten feet in the air and three feet from either tree
        - If you encounter a black bear, back away slowly without making direct eye contact
        - If the bear does not leave the area, make a loud noise like blowing a whistle or banging a pot
      dont:
        - Never approach a bear, and be especially wary of mother bears with cubs
        - Do not run
      source: dcnr-bears
    - kind: snake
      name: Timber rattlesnake
      level: moderate
      basis: DCNR says timber rattlesnakes may use trails, roads or open rocky areas for basking; the trail follows rocky ridge crests for much of its length.
      do:
        - Be aware. Look around before sitting or reaching into piles of rock, logs, or boards
        - Maintain a 3-foot buffer around a snake to avoid a strike
        - Remain calm and reassure the snakebite victim
        - If possible, immobilize the affected area and transport the snakebite victim immediately to the nearest medical facility
      dont:
        - Never pick up a rattlesnake, even one that appears to be dead
        - Do not attempt first aid measures such as incision, suction, tourniquets, alcohol, or drugs on the snakebite victim
      source: dcnr-rattlesnakes
    - kind: tick
      name: Blacklegged tick (deer tick)
      level: moderate
      basis: The blacklegged tick carries Lyme disease; the trail runs through forest and brush nearly all the way.
      do:
        - Walk in the center of trails
        - Use EPA-registered insect repellents containing DEET, picaridin, IR3535, Oil of Lemon Eucalyptus (OLE), para-menthane-diol (PMD), or 2-undecanone
        - Treat boots, clothing and gear with permethrin
        - Check your body, clothing, gear and pets for ticks after being outdoors
      dont:
        - Avoid wooded and brushy areas with high grass and leaf litter
      source: cdc-ticks
tags: [forest, ridge, river]
notes:
  - >-
    Stages: the association's 20 numbered sections with the lengths in kilometres from each
    section's updates page (the trail has been measured in metric since its 1973 guide). They sum to
    528.53 km. Section 3's "32 km" is rounded and still counts the Yellow Creek Bridge detour, which
    the same page says is no longer needed since the bridge reopened (9/23); the record keeps the
    association's figure.
  - >-
    Length: not stated as a total by the association ("Over 500 kilometers in length"), so the page
    sums the sections (528.5 km). DCNR's Rothrock State Forest page gives "a 326 mile cross-country
    trail" (524.6 km), Wikipedia 526 km (data check).
  - >-
    Days: the association gives no days for the whole trail; the page counts one day per section
    (20), though sections 10, 16 and 18 (39–43 km) take most hikers longer.
  - >-
    Season: no season from the association; Wikipedia's infobox gives "Year-round". The association
    lists hunting closures: parts of sections 18, 19 and 20 in Tioga County are closed October 1 to
    January 31 (signed road detours), the south end of section 14 past PA 150 September 1 to January
    31 (and closed for logging since May 2023); a hunting lessee asks hikers to wear blaze orange in
    October, November, December and May, "a darn good idea anywhere on MST in these months".
  - >-
    Wild camping: DCNR's rule holds in the state forests (the Rothrock, Bald Eagle and Tiadaghton
    camping pages alike). The association: section 2 in State Game Lands 97 has "no legal camping"
    and no water on the trail; much of the Tioga Region crosses private land, camping only at named
    spots.
  - >-
    Waymarking: the orange blaze is drawn from the source's description (`orange-blaze`,
    added 2026-11-07).
  - >-
    Tree line: not added; the route stays below 1,500 m (highest point Martin Hill, 829 m, in
    section 1, by the association's FAQ).
  - >-
    Wildlife: Wikipedia's infobox names "Uneven and wet terrain, rattlesnakes, mosquitoes, ticks,
    black bears". The black bear advice is DCNR's from its Laurel Ridge guide (advice on
    Pennsylvania's black bears; the Game Commission's black bear page gives the range, no encounter
    advice); the rattlesnake advice from DCNR's timber rattlesnake page; ticks from the CDC, whose
    card DCNR's guides print. Mosquitoes are insects and not listed.
  - >-
    Map line (2026-11-07): the Maryland, Pennsylvania and New York Geofabrik extracts (2026-11-06);
    OSM's Mid-State Trail relation (1022044) chained from the Maryland line to the New York line
    (the guide jumps the relation's gaps of 167 and 649 m, but the matcher found connected OSM ways
    there and bridged nothing), cut at the sections' ends, every section 100 % matched. It measures
    498.9 km against the sections' 528.5 km (−5.6 %). Highest point 822 m at km 15.4 (GEDTM30,
    2026-11-07; the FAQ: Martin Hill, 829 m, in section 1), lowest 156 m at km 306.1 by the West
    Branch Susquehanna (Wikipedia 195 m at the road crossing). The terrain model gives about 13,340
    m of climbing; none is stated.
  - >-
    Section 3 measures 25.1 km on the map line against the association's 32 km (−22 %): the 32 km
    is a rounded figure that the page itself says counts the Yellow Creek Bridge detour round by the
    roads to the west, no longer needed since the bridge reopened in 2023, and the Everett Borough
    relocation. The record keeps the association's figure; every other section is within 10 % (the
    map line runs 1–9 % short throughout, as OSM's long ways cut the bends).
  - >-
    Water: OSM maps 6 drinking water points near the trail; the check's longest stretch without
    drinking water is 131.2 km (km 348.9–480.1, Tioga County). The association's section pages list
    streams and springs as water sources, to be treated ("filter and disinfect"), and taps at Hills
    Creek State Park.
  - >-
    Resupply: OSM maps 7 shops near the trail, the longest stretch without one 159.5 km
    (km 309.7–469.2, from the West Branch Susquehanna to Tioga County); the trail passes Woolrich
    (the store is closed, says the association), Ramsey, Blackwell and Antrim without shops mapped.
  - >-
    Beds: OSM maps 28 places to sleep near the trail, the longest stretch without one 113.5 km
    (km 0–113.5, the Everett Region): primitive camping in Buchanan State Forest, the Tenley Park
    hiker shelter in Everett and the campground near Loysburg (section updates) are not mapped as
    such; State Game Lands 97 (section 2) allows no camping.
  - >-
    Data check (2026-11-07): against English Wikipedia and DCNR's Rothrock State Forest page. Length:
    the sections' 528.5 km against Wikipedia's 526 km (−0.5 %) and DCNR's 326 miles (524.6 km,
    −0.7 %). The termini (Maryland line north of Flintstone, New York line near Lawrenceville), the
    highest point (Martin Hill, 829 m, both), the lowest by the West Branch Susquehanna in Clinton
    County (Wikipedia 195 m; the FAQ names the place, no height), the orange blazes, the four regions
    and the year-round season agree. Difficulty: Wikipedia "Moderate to strenuous", DCNR "rugged and
    demanding"; our T2 fits both. Neither gives days or section lengths; the 20 sections' ends and
    kilometres on the built page were checked one by one against the association's section pages and
    agree. No figure is more than 10 % apart.
  - >-
    Preflight (2026-11-07): the "login form" on the association's pages is the Joomla site's member
    login box in the sidebar; every page reads without it, so no blocker. The OSM relation
    (1022044, 468 ways, 516.1 km) chains 498.7 km (97 %) from the start, with gaps of 628 m and 164 m
    (near Tram Road in section 15 and in section 17); the 29 ways left over (14.4 km) are side trails
    and old routes.
