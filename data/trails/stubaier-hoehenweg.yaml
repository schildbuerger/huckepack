  start:
    name: Starkenburger Hütte
    lat: 47.12662
    lon: 11.27885
  end:
    name: Innsbrucker Hütte
    lat: 47.04331
    lon: 11.31076
  source: tw
waymarking:
  # the Alpine Club's red-white-red path marks; no symbol of its own is described
  text: Red-white-red Alpine Club marks
  symbol: cai
  source: tw
treeLine:
  # the BFW's high-subalpine zone in the inner Alps' core (forest growth region 1.1, the Ötztal and
  # Stubai Alps): "2000–2300" m
  m: 2300
  fromM: 2000
  source: bfw
stages:
  # Tirol Werbung's seven stage pages (data from TVB Stubai: length, time, climb and descent), each
