name: Stubaier Höhenweg
added: 2026-11-04
aliases: [Stubai High Trail, Stubai Hohenweg, Stubaier Hoehenweg]
website: https://www.tirol.at/aktivitaeten/sport/wandern/wandertouren/stubaier-hoehenweg-variante-1-starkenburger-huette-innsbrucker-huette
