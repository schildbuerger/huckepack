  url: https://www.tirol.at/aktivitaeten/sport/wandern/wandertouren/stubaier-hoehenweg-variante-1-starkenburger-huette-innsbrucker-huette
  by: Tirol Werbung
  source: tw
trailType: point-to-point
continents: [Europe]
countries: [AT]
regions: [Tyrol]
protectedAreas:
  # OSM protected areas containing points of the main route (national parks, nature parks, biosphere
