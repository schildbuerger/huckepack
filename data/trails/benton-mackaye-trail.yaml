  # working rule 2: English Wikipedia as the second source; the sections only on the association's
  # pages, so the built page was checked against them
  date: 2026-11-06
  against: [wikipedia]
  pageAgainst: [bmta-discover, nps-backcountry]
  deviations:
    - { figure: stage 9 length, ours: "7.2 km (4.5 miles)", theirs: "6.4 km on the map line", source: osm }
    - { figure: stage 16 length, ours: "23.2 km (14.4 miles)", theirs: "17.5 km on the map line", source: osm }
    - { figure: stage 17 length, ours: "19.3 km (12.0 miles)", theirs: "23.7 km on the map line", source: osm }
    - { figure: stage 20 length, ours: "10.9 km (6.8 miles)", theirs: "9.1 km on the map line", source: osm }
    - { figure: ascent, ours: "16,667 m (54,682 ft)", theirs: "about 19,820 m from the terrain model", source: copdem }
