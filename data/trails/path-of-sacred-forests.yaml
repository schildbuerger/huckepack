name: Path of Sacred Forests
localName: Sentiero delle Foreste Sacre
aliases: [Sacred Forests Trail, Trail of the Sacred Forests]
website: https://trekking.parcoforestecasentinesi.it/en/sacred-forests/
managedBy:
  - name: Parco Nazionale delle Foreste Casentinesi, Monte Falterona e Campigna
    url: https://www.parcoforestecasentinesi.it/
trailType: point-to-point
continents: [Europe]
countries: [IT]
regions: [Emilia-Romagna, Tuscany]
protectedAreas:
