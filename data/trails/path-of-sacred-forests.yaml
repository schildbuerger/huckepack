    - { number: "2", kind: main, from: San Benedetto in Alpe, to: Castagno d'Andrea, km: 19.7, ascentM: 1130, descentM: 900, minutes: 420, startEleM: 567, endEleM: 730, track: "https://geohub.webmapp.it/api/ec/track/download/75489.gpx" }
    - { number: "3", kind: main, from: Castagno d'Andrea, to: Campigna, km: 19.4, ascentM: 1080, descentM: 740, minutes: 480, startEleM: 675, endEleM: 1464, track: "https://geohub.webmapp.it/api/ec/track/download/75488.gpx" }
    - { number: "4", kind: main, from: Campigna, to: Camaldoli, km: 14.0, ascentM: 640, descentM: 890, minutes: 330, startEleM: 1464, endEleM: 849, track: "https://geohub.webmapp.it/api/ec/track/download/75487.gpx" }
    - { number: "5", kind: main, from: Camaldoli, to: Badia Prataglia, km: 13.4, ascentM: 920, descentM: 770, minutes: 300, startEleM: 847, endEleM: 1055, track: "https://geohub.webmapp.it/api/ec/track/download/75486.gpx" }
    - { number: "6", kind: main, from: Badia Prataglia, to: Rimbocchi, km: 18.5, ascentM: 650, descentM: 700, minutes: 300, startEleM: 1004, endEleM: 552, track: "https://geohub.webmapp.it/api/ec/track/download/75483.gpx" }
    - { number: "6", kind: variant, from: Badia Prataglia, to: Rimbocchi, km: 10.5, ascentM: 489, descentM: 782, minutes: 195, startEleM: 842, endEleM: 549, track: "https://geohub.webmapp.it/api/ec/track/download/83878.gpx" }
    - { number: "7", kind: main, from: Rimbocchi, to: La Verna, km: 7.9, ascentM: 627, descentM: 341, minutes: 240, startEleM: 552, endEleM: 1138, track: "https://geohub.webmapp.it/api/ec/track/download/75485.gpx" }
route:
  # built by `python -m pipeline.routes sacred-forests-trail`: OSM ways matched to the stage
  # tracks above; the park's GPX only guides which ways, none of its geometry is used
  source: osm
  publishable: true
difficulty:
  cai:
    grade: E
    source: thewom
season:
  months: [3, 4, 5, 9, 10, 11]
  text: Spring and autumn
  source: thewom
sleeping:
  types: [hut, campsite, hostel, guesthouse, hotel, monastery]
  source: pnfc
wildCamping:
  status: restricted
  rule: >-
    Inside the national park, tents are allowed only at authorised campsites and farms.
    Next to huts, bivouacs and other hikers' facilities you may pitch a tent only while
    they are open and full: one night, from an hour after sunset to sunrise, at most two
    tents. Outside the park, ask the individual facilities.
  source: er-avp
access:
  # the nearest major travel hubs: main railway station and international airports (OSM);
  # distances by pipeline/access.py
  - kind: station
    name: Firenze Santa Maria Novella
    lat: 43.77757
    lon: 11.24742
    source: osm
  - kind: airport
    name: Florence Airport (FLR)
    lat: 43.80918
    lon: 11.20244
    source: osm
  - kind: airport
    name: Bologna Airport (BLQ)
    lat: 44.53449
    lon: 11.28794
    source: osm
tags: [forests, monasteries, apennines, national-park]
notes:
  - >-
    The park's stage pages state distances that differ from its own GPX tracks (stage 3:
    19.4 km stated, 13.4 km in the GPX). The stated figures are used; check them against
    OpenStreetMap.
  - The park publishes no total length or difficulty grade; both come from a travel magazine.
  - >-
    OpenStreetMap has no route relation for the trail (checked 2026-10-27), only the park's
    numbered paths. The map line is OSM ways matched to the park's GPX: 94–100% of each
    stage's track lies within 30 m of it. Stage 5 has two stretches where OSM has no path
    near the GPX (about 340 m after Camaldoli at 43.7956,11.8241 and 220 m before Badia
    Prataglia at 43.8057,11.8710); the line follows the nearest OSM paths there, up to 79 m
    away. Adding those paths to OSM would close the gaps.
  - >-
    The camping rule comes from a 2019 regional summary that cites the park's "provisional
    regulation"; check whether that regulation is still current.
  - >-
    Data check (2026-10-29), against the Emilia-Romagna region's trail brochure (Hiking Europe,
    2017) for the whole route and The Wom Travel for the stages (the park is the stage source).
    Within 10 %: ascent and descent (5,090 / 4,610 m in the brochure against 5,487 / 4,911 m from
    the park's stage sums), 7 days, difficulty (CAI E in both), season (spring and autumn), stage
    lengths and times 1, 2, 4, 5 and 7. More than 10 % apart (listed in `dataCheck`): the total length (the brochure's data box says 87.5 km, its own text "about 100 km", The
    Wom "nearly 100 km"; the park's stages add up to 101.2 km) and the lengths of stages 3
    (12.9 km at The Wom against the park's 19.4 km) and 6 (16.2 against 18.5 km).
dataCheck:
  # working rule 2: the region's brochure for the whole route, The Wom Travel for the stages
  date: 2026-10-29
  against: [regione-er, thewom]
  deviations:
    - { figure: "Length", ours: "101.2 km", theirs: "87.5 km", source: regione-er }
    - { figure: "Stage 3 length", ours: "19.4 km", theirs: "12.9 km", source: thewom }
    - { figure: "Stage 6 length", ours: "18.5 km", theirs: "about 16.2 km", source: thewom }
