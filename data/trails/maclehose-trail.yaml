  # the trail's section pages are published by the Agriculture, Fisheries and Conservation
  # Department's hiking site (country parks, distance posts, campsites)
  - name: Agriculture, Fisheries and Conservation Department (AFCD), Hong Kong
    url: https://www.afcd.gov.hk/english/country/cou_vis/cou_vis.html
trailType: point-to-point
continents: [Asia]
countries: [HK]
regions: [New Territories]
protectedAreas:
  - Sai Kung East and West Country Parks
  - Ma On Shan Country Park
  - Lion Rock Country Park
  - Kam Shan Country Park
  - Shing Mun Country Park
  - Tai Mo Shan Country Park
  - Tai Lam Country Park
termini:
