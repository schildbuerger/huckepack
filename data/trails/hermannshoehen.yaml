notes:
  - >-
    The whole-trail tour: 225.46 km, 4,096 m up, 3,666 m down, 62 h, lowest 30 m, highest 462 m;
    the site's text "226 km" in "dreizehn Tagesetappen mit 15-20 km Länge" (the stage page says
    16–22 km). The 13 stage tours add up to 228.3 km, 4,116 m up and 3,888 m down. The site's
    Hermannsweg tour is 163.10 km, its Eggeweg tour 70.56 km.
  - >-
    Water and food: the whole-trail tour warns of few places to eat ("Streckenweise nur wenig
    Einkehrmöglichkeiten"), and on the Eggeweg of little shade after clearings and no places to
    eat except in Willebadessen and Bad Driburg: carry drinks.
  - >-
    Route (pipeline, 2026-10-31, Geofabrik extracts): the OSM match covers 99–100 % of every stage
    track; the map line's main route is 224.8 km. Water: 9 drinking water points and 108 springs
    from OSM; the longest stretch without drinking water is the whole Eggeweg, 67.8 km (km
    157.0–224.8, Leopoldstal to Marsberg), which matches the site's warning (places to eat only in
    Bad Driburg and Willebadessen; carry drinks).
  - >-
    Ascent: the whole-trail pair (4,096 m up, 3,666 m down) is shown; the stages add up to 4,116 m
    up, and the terrain model gives about 6,700 m (it measures the treetops, and 88 % of the route
    runs through forest).
  - >-
    Tree line: none in reach. The route tops out at 462 m (the Eggegebirge, 464 m on the terrain
    model), forested; the Teutoburger Wald and the Eggegebirge have no natural tree line.
  - >-
    Data check (2026-10-31). Second source: German Wikipedia (Hermannshöhen: 226 km over the
    Teutoburger Wald and the Eggegebirge, the project since 2004, NRW and Lower Saxony, Naturpark
    TERRA.vita and Teutoburger Wald / Eggegebirge, H and X waymarks; Hermannsweg: Rheine to the
    Lippischer Velmerstot (441 m) and Leopoldstal; Eggeweg: about 70 km in three stages,
    Externsteine – Iburg 23 km, Iburg – Borlinghausen 22 km, Borlinghausen – Diemeltal 26 km).
    Everything comparable agrees within 10 %: total 225.46 against 226 km, the Eggeweg 70.56 against
    70 km, its stretch Bad Driburg – Marsberg (stages 11–13, 49.6 km) against Wikipedia's
    Iburg – Diemeltal (48 km). Wikipedia gives no stage list for the Hermannsweg and no climbs.
  - >-
    Waymarks: the Hermannsweg's white H on black and the Eggeweg's white X on black are simple
    painted marks; not drawn yet (no Waymark symbol for a letter or a cross on black).
