route:
  # built by `python -m pipeline.all hermannshoehen`: OSM ways matched to the stage tracks
  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T1
    basis: >-
      Teutoburger Wald Tourismus rates the whole trail "mittel" (fitness "mittel") and its stages
      "leicht" to "mittel": ridge paths over the Teutoburger Wald and the Eggegebirge, with good
      walking shoes advised; no steep or exposed passages are described. That is hiking on good
      paths (T1).
    source: hhs
season:
  # the whole-trail tour: April to October "geeignet", November to March "wetterabhängig"
  months: [4, 5, 6, 7, 8, 9, 10]
  text: April to October; November to March depending on the weather
  source: hhs
sleeping:
  # hotels and guesthouses ("Qualitätsbetrieb Hermannshöhen"), the campsite at the Hertha-See
  # in Hörstel among the trail's hosts
  types: [hotel, guesthouse, campsite]
  source: hhs
wildCamping:
  status: restricted
  rule: >-
    In North Rhine-Westphalia camping in the forest is forbidden (Landesforstgesetz § 3); in
    Lower Saxony (around Bad Iburg and Dissen) tents in the countryside need the owner's
    permission outside campsites (NWaldLG § 27). The trail names no trekking sites.
  source: lfog-nrw
