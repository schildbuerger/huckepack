    - { figure: "Stage 3 (Hohnstein – Altendorf)", ours: "13.96 km", theirs: "12 km", source: wikipedia }
    - { figure: "Stage 7 (Kurort Gohrisch – Weißig)", ours: "16.58 km", theirs: "15 km", source: wikipedia }
    - { figure: "Stage 8 (Weißig – Pirna)", ours: "13.77 km", theirs: "12 km", source: wikipedia }
