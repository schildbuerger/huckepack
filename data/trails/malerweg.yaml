wildCamping:
  # the Saxon environment ministry, 18 December 2025: in the national park, sleeping out is allowed
  # only at the 58 approved, marked places, only with climbing, and not from 1 February to 15 June
  status: restricted
  rule: >-
    In the national park, sleeping out is allowed only for climbers at the 58 approved and marked
    places (Boofen), and not from 1 February to 15 June; hikers use the campsites the Tourismusverband
    names near each stage.
  source: smul-boofen
