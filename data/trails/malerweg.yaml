animals:
  # Ticks: the RKI's TBE risk areas (2026: the district of Sächsische Schweiz-Osterzgebirge; the
  # Tourismusverband says so too) and the federal health agency's advice. Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease, tick-borne encephalitis)"
      level: moderate
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; the Robert Koch Institute lists the district of Sächsische Schweiz-Osterzgebirge, where the whole Malerweg lies, as a risk area for tick-borne encephalitis (TBE), against which a vaccine protects."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
        - "Ask a doctor about the TBE vaccination well before you go: Germany's vaccination committee (STIKO) recommends it for people exposed to ticks in TBE risk areas"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [sandstone, table-mountains, gorges, national-park]
notes:
  - >-
    The Malerweg follows the route the painters and travellers of the Romantic era took through the
    Elbe Sandstone Mountains: from the Liebethaler Grund near Pirna by the Uttewalder Grund to Stadt
    Wehlen, over the Bastei to Rathen and Hohnstein, by the Brand to Altendorf, past the Schrammsteine
    and the Affensteine to the Lichtenhain waterfall and the Neumannmühle, over the Großer
    Winterberg to Schmilka, across the Elbe and over the table mountains Papststein and Gohrisch to
    Königstein and its fortress, and back to Pirna.
  - >-
    The trail is nearly a loop: it starts in Pirna-Liebethal and ends at Pirna's market square, about
    3 km apart. Tree line: none recorded, the Malerweg stays below about 560 m. Dogs are welcome, but
    many stretches climb steps and ladders (the Tourismusverband).
  - >-
    Map line: the official GPX guides the OSM matcher; every stage at least 98 % matched, the map line
    116.8 km, as the stages sum. Stage 6 crosses the Elbe by the ferry from Schmilka (the
    matcher bridges 110 m, `maxBridgeM`). The terrain model sums about 4,540 m of climbing against
    the stages' 3,689 m (treetops in the forest); the page keeps the stated figures. Highest point
    559 m near the Großer Winterberg.
  - >-
    Data check (2026-11-03): the Tourismusverband's figures against German Wikipedia: length 116 km
    against 112 km (4 %), eight stages, Liebethal to Pirna, the waymark (the Malerweg sign since 2006):
    agree. Stage lengths: 1 11.55 against 11 km, 4 18.35 against 18, 5 13.65 against 14, 6 18 against
    17 km agree within 10 %; stages 2 (10.91 against 13 km), 3 (13.96 against 12), 7 (16.58 against
    15) and 8 (13.77 against 12) differ by 10–16 %, recorded in dataCheck (Wikipedia's stage ends
    differ slightly, e.g. stage 6 to the Muselweg at Gohrisch). The page keeps the official figures.
dataCheck:
