name: Long Trail
added: 2026-11-06
aliases: [LT]
website: https://greenmountainclub.org/hike/the-long-trail/
wikidata: Q6673311
managedBy:
  # the Green Mountain Club built it (1910–1930) and is its steward
  - name: Green Mountain Club
    url: https://greenmountainclub.org/
officialGpx:
  none: the club sells the Long Trail Guide and map and offers no GPX to download (checked 2026-11-06)
  source: gmc
trailType: point-to-point
continents: [North America]
countries: [US]
regions: [Vermont]
termini:
  # the club: "from Vermont's southern border with Massachusetts to the Canadian border"; northbound
  # is the more common way (the thru-hiking page). Coordinates: the OSM relation's ends at the
  # borders
  start:
    name: Massachusetts state line
    lat: 42.74382
    lon: -73.15553
  end:
    name: Canadian border (Journey's End)
    lat: 45.00865
    lon: -72.48825
  source: gmc
established:
  year: 1930
  source: gmc
waymarking:
  text: White blazes painted on trees or rocks; 88 blue-blazed side trails
  symbol: white-blaze
  source: gmc
length:
  # "272 miles"
  - km: 437.7
    source: gmc
days:
  # the thru-hiking page: "The average thru-hike takes 20-30 days, or roughly 3-4 weeks"
  min: 20
  max: 30
  basis: operator
  source: gmc-thru
stages:
  # no stages by design (issue #204; docs/scope.md, "Trails without stages"): hikers choose among 70
  # free, first-come overnight sites "roughly every 5-10 miles", "spaced roughly a day's hike apart"
  source: gmc-thru
  none: true
route:
  # built by `python -m pipeline.all long-trail`: OSM ways matched to the trail's OSM relation
  # (391736, "Long Trail", operator Green Mountain Club), the whole route as one segment
  source: osm
  publishable: true
  relation: 391736
difficulty:
  # the club: "expect rocks, roots, mud, and steep climbs, especially in the northern half"
  estimated:
    sac: T3
    basis: >-
      The Green Mountain Club calls the trail beautiful and challenging, with rocks, roots, mud and
      steep climbs, especially in the northern half, over all five of Vermont's 4,000-foot peaks
      including Mount Mansfield; a seasoned backpacker may walk fewer miles a day than on other
      long-distance trails. Mountain hiking on steep, rocky and rooty ground, with the hands needed
      on the steepest slabs of the north (T3).
    source: gmc-thru
season:
  # "We recommend starting your hike in July, August, or September … June is also popular, though
  # there may be remaining snow … October through March is considered winter conditions … April and
  # May are Vermont's mud season, when high elevation hiking is discouraged"
  months: [6, 7, 8, 9]
  text: June to September, starting best in July, August or September; April and May are mud season, October to March winter
  source: gmc-thru
sleeping:
  # "70 free, first-come, first-served overnight sites, ranging from tenting areas to three-sided
  # lean-tos to enclosed lodges with bunks", each with a privy and an untreated water source
  types: [bivouac, campsite]
  source: gmc-thru
wildCamping:
  status: restricted
  rule: >-
    Hikers should use the designated overnight sites whenever possible; tenting is prohibited above
    2,500 feet, and camping and fire rules vary between the Green Mountain National Forest, state and
    private land (the Long Trail Guide has each site's rules).
  source: gmc-thru
refillsUntreated:
  # each overnight site has "a natural, untreated water source"; the club: treat or filter all drinking water
  text: Each overnight site has a natural water source, untreated; treat or filter all drinking water.
  source: gmc-thru
access:
  # hubs by the rules of 2026-11-07 (docs/scope.md: long-distance trains, the main station of a city
  # of 100,000, airports with international flights), suggested by pipeline/hubs.py and reviewed.
  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Pittsfield
    lat: 42.45143
    lon: -73.25404
    source: osm
  - kind: station
    name: Albany-Rensselaer
    lat: 42.64125
    lon: -73.74129
    source: osm
  - kind: airport
    name: Bradley International Airport (BDL)
    lat: 41.94044
    lon: -72.68548
    source: osm
animals:
  # the club's thru-hiking page, "Bears and Food Storage". Level ours
  list:
    - kind: bear
      name: Black bear
      level: low
      basis: Black bears are common in Vermont and generally avoid people, but some learn to link hikers with food.
      do:
        - Store all food, trash, toiletries and dishes in an approved container a safe distance from camp
        - Use a bear canister (the club lends them for free) or an Ursack or a bear hang
      dont:
        - Sleep with your food bag, or hang it inside a shelter
      source: gmc-thru
tags: [mountains, forest, shelters, thru-hike]
notes:
  - >-
    Stages: none by design. The club's 70 free overnight sites lie roughly every 5–10 miles, "a day's
    hike apart"; thru-hikers carry 3–5 days of food and resupply in towns such as Bennington,
    Manchester, Killington/Rutland, Waitsfield, Waterbury, Stowe and Johnson. The southern 100 miles
    are shared with the Appalachian Trail.
  - >-
    Protected areas: none of the kinds these pages list; the trail crosses the Green Mountain
    National Forest, state forests and private land (the club).
  - >-
    Map line (2026-11-06): the Vermont and Massachusetts Geofabrik extracts; OSM's Long Trail
    relation (391736), chained from the Massachusetts line as one segment, 100 % matched, no ways
    left out. It measures 401 km on OSM's full geometry and 394.3 km on the simplified map line,
    against the club's 272 miles (437.7 km, −8 to −10 %); the record keeps the club's figure. The
    terrain model gives about 18,090 m of climbing (GEDTM30, 2026-11-07). Water, food and beds: OSM
    maps only a handful of springs and drinking water points near the trail, and the club's lean-tos
    as shelters rather than places to sleep, so the page's water and bed gaps (322 km without mapped
    drinking water, 113 km without a mapped bed) overstate them: every one of the club's 70
    overnight sites, roughly 5–10 miles apart, has a natural water source (untreated). No shop lies
    within 1 km of the trail; hikers resupply in the towns off it.
  - >-
    Data check (2026-11-06, working rule 2): the club against English Wikipedia: length 272 miles
    (437.7 km) against 273 miles (439 km); termini the Massachusetts state line (Clarksburg) and the
    Canada–US border (Jay) in both; built 1910–1930 by the club in both; mud season, when some
    sections are closed or discouraged, in both. Wikipedia gives no days or season months; the page
    was checked against the club's pages for those (20–30 days, June to September).
  - >-
    Permit: none for individual hikers ("The entire system is free and open to the public"); some
    groups need a special-use permit from the national forest or the state. Caretaker-staffed sites
    ask for a donation.
dataCheck:
  # working rule 2: English Wikipedia as the second source; the OSM map line
  date: 2026-11-06
  against: [wikipedia]
  pageAgainst: [gmc, gmc-thru]
  deviations: []
