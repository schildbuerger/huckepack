route:
  # built by `python -m pipeline.all kungsleden`: OSM ways matched to the stage relations
  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T2
    basis: >-
      STF describes a well-marked trail with bridges over the difficult water crossings, easy
      walking in places and steeper, rocky stretches (towards Tjäktja); Wikipedia adds plank
      walkways over swampy and rocky ground near the trailheads and eroded, rocky sections farther
      out, rowing boats over the lakes, and treacherous weather with late or early snow. No
      secured passages; the highest point is Tjäktjapasset (1,150 m). Mountain hiking (T2).
    source: stf
season:
  # STF's visitor calendar for the huts: open from week 25 to week 37 (Abisko–Nikkaluokta page);
  # Wikipedia: "usually runs between mid-June and the end of September"
  months: [6, 7, 8, 9]
  text: Mid-June to mid-September, while STF's huts are open
  source: stf
sleeping:
  # STF's mountain cabins and stations, 10–20 km apart; none between Kvikkjokk and Ammarnäs
  types: [hut]
  source: stf
wildCamping:
  status: restricted
  rule: >-
    The right of public access (allemansrätten) allows a tent for a night or so away from houses.
    In Abisko National Park, tents only at the designated sites (the mountain station, Nissonjohka
    and Abiskojaure), and fires only at their fire places; other protected areas along the way
    have their own rules.
  source: abisko-np
access:
  # trains stop at Abisko Turiststation (the line Stockholm/Luleå – Kiruna – Narvik); Kiruna
  # Airport is the nearest with scheduled flights. Coordinates from OSM; distances by
  # pipeline/access.py
  - kind: station
    name: Abisko Turiststation
    lat: 68.35738
    lon: 18.78247
    source: osm
  - kind: airport
    name: Kiruna Airport (KRN)
    lat: 67.82006
    lon: 20.33308
    source: osm
tags: [lapland, arctic, huts, fjell, lakes]
notes:
  - >-
    Wildlife (2026-11-04): none listed. Brown bears live in Norrbotten (Länsstyrelsen Norrbotten), but
    the official advice for meeting one could not be read: Länsstyrelsen's page covers animals near
    homes only, the Swedish Hunters' Association and Naturvårdsverket's brochure sits on a server with an
    expired certificate, and NINA's Swedish leaflet refuses downloads (403). Ticks are rare in the fjäll.
  - >-
    Stages: STF's 28 legs add up to 464 km against its "just over 450 kilometers"; Wikipedia gives
    about 467 km (419.3 km on foot, 18.2 km of lake crossings, 29.5 km of road, mostly by bus).
    STF's section totals differ slightly from their legs (Nikkaluokta – Saltoluokta 102 against
    101 km, Saltoluokta – Kvikkjokk 73 against 68 km plus boats, Ammarnäs – Hemavan 78 against
    77 km). No official number of days for the whole trail.
  - >-
    Route (pipeline, 2026-10-31, Geofabrik extract): each stage follows its OSM stage relation;
    OSM maps the lake crossings as rowing-boat ferries (route=ferry, the boats STF names), which the
    matcher may take as part of the trail. Every stage matches 100 %. The matched line is 473 km
    against the legs' 464 km and STF's "just over 450". Legs more than 10 % off the map line, where
    OSM's stage relations end at other points than STF's huts or include the boat: 11 (12.8 against
    10 km), 13 (15.4 against 17), 16 (14.5 against 19), 17 (16.1 against 13), 18 (24.2 against 18
    plus a 5.4 km boat), 28 (11.6 against 10).
  - >-
    Water (2026-11-01, issue #119): OSM maps only 4 drinking water points, plus the Tsielejåkkastuga
    hut tagged with drinking water, so the page rates water "scarce" (165 km without, stages
    15–23); with springs counted 83 km, with refills at STF's huts and campsites 40 km. In fact the
    trail crosses streams and lakes all along, which OSM doesn't count as drinking water, and STF's
    huts fetch theirs from them. No source lists water points to add.
  - >-
    Resupply: 129 km without a shop in OSM (km 172–301, around Kvikkjokk to Jäckvik); STF's staffed
    huts and mountain stations sell provisions, which OSM doesn't tag as shops.
  - >-
    Beds: 39.6 km without a bed of the kinds counted (km 262–301, from the Gásakláhko camp site to
    Jäkkvik, where STF has no huts); since 2026-11-01 OSM's rest shelters (rastskydd) no longer
    count as beds.
  - >-
    Tree line: not recorded. The route climbs to 1,135 m on the terrain model (Tjäktjapasset, STF
    1,150 m), well above the mountain birch; no published regional tree line is in
    data/reference/tree-lines.yaml yet.
  - >-
    Data check (2026-10-31). Second source: English Wikipedia (about 467 km, 419.3 km on foot plus
    lake crossings and road; highest point Tjäktjapasset 1,150 m; huts 9–22 km apart; hut season
    mid-June to the end of September; marked; plank walkways and rowing boats kept by the county
    boards) agrees with STF within 10 %: length 450–464 against 467 km, highest point 1,150 m (the
    terrain model 1,135 m), the season's months the same. The opening year (1928) is Wikipedia's
    alone.
  - >-
    Days (2026-11-07): Cicerone's "between four and five unhurried weeks", recorded as 28 to 35
    days. STF's pages give none for the whole trail; English Wikipedia's four sections "each
    representing approximately one week of hiking" agree; Swedish Wikipedia gives only running
    records.
dataCheck:
