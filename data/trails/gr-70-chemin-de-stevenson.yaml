  # Wikipedia's eleven "étapes indicatives" with their distances "selon TopoGuides GR 70" (the
  # fallback of docs/scope.md; decided 2026-11-03: Le Puy to Alès). Each stage follows its section
  # relation of the OSM superroute "Chemin de Stevenson" (223039), cut at its end where a section
  # holds two stages (OSM)
  source: wikipedia-fr
  list:
    - { number: "1", kind: main, from: Le Puy-en-Velay, to: Le Monastier-sur-Gazeille, km: 19.3, relation: 7499883 }
    - { number: "2", kind: main, from: Le Monastier-sur-Gazeille, to: Le Bouchet-Saint-Nicolas, km: 23.9, relation: 7500107 }
    - { number: "3", kind: main, from: Le Bouchet-Saint-Nicolas, to: Langogne, km: 27.2, relation: 7500197 }
    - { number: "4", kind: main, from: Langogne, to: Cheylard-l'Évêque, km: 15.9, relation: 7500492, end: { name: "Cheylard-l'Évêque", lat: 44.64763, lon: 3.80345 } }
    - { number: "5", kind: main, from: Cheylard-l'Évêque, to: La Bastide-Puylaurent, km: 26.5, relation: [7500492, 7500636], end: { name: La Bastide-Puylaurent, lat: 44.56622, lon: 3.8943 } }
    - { number: "6", kind: main, from: La Bastide-Puylaurent, to: Le Bleymard, km: 29.3, relation: 7500734 }
    - { number: "7", kind: main, from: Le Bleymard, to: Le Pont-de-Montvert, km: 19.3, relation: 7500898 }
    - { number: "8", kind: main, from: Le Pont-de-Montvert, to: Florac, km: 28.5, relation: 7501125 }
    - { number: "9", kind: main, from: Florac, to: Saint-Germain-de-Calberte, km: 32.4, relation: 7501509 }
    - { number: "10", kind: main, from: Saint-Germain-de-Calberte, to: Saint-Jean-du-Gard, km: 21.6, relation: [7501585, 15692999], end: { name: Saint-Jean-du-Gard, lat: 44.10531, lon: 3.88468 } }
    - { number: "11", kind: main, from: Saint-Jean-du-Gard, to: Alès, km: 24, relation: 7499963 }
route:
  # built by `python -m pipeline.all gr-70-chemin-de-stevenson`: OSM ways matched to the section
  # relations
  source: osm
  publishable: true
difficulty:
  # no grade is published; our estimate
  estimated:
    sac: T1
    basis: >-
      A GR on tracks, paths and minor roads across the Velay plateau, the Gévaudan, over the bare
      granite of the Mont Lozère (1,699 m at the Finiels summit) and down the Cévennes valleys, at
      altitudes "allant de 128 à 1699 m"; about twenty kilometres a day (the association). Hiking on
      good paths (T1).
    source: assoc
season:
  # "Les hébergements sont pratiquement tous ouverts de Pâques à Toussaint"
  months: [4, 5, 6, 7, 8, 9, 10]
  text: Easter to All Saints' Day, when the places to stay are open
  source: assoc
sleeping:
  # "Hôtels, auberges, chambres d'hôtes, gîtes d'étape, campings"
  types: [hotel, guesthouse, hostel, campsite]
  source: assoc
wildCamping:
  # the Cévennes National Park's decree 2014-0007: in the park's core, bivouac only for walkers,
  # in a light tent or none, one night, from 19h to 9h, within 50 m of a marked GR, except mapped
  # stretches on the Mont Lozère; decision 2016-0123: tents otherwise prohibited in the core
  status: restricted
  rule: >-
    In the core of the Cévennes National Park a walker may bivouac for one night, from 7 pm to 9 am,
    within 50 m of the marked GR, in a light tent or without one, except on mapped stretches of the
    Mont Lozère; other camping in the core is prohibited.
  source: pnc-bivouac
access:
  # hubs by the rules of 2026-11-07 (docs/scope.md: long-distance trains, the main station of a city
  # of 100,000, airports with international flights), suggested by pipeline/hubs.py and reviewed.
  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Lyon Part-Dieu
    lat: 45.76057
    lon: 4.86016
    source: osm
  - kind: airport
    name: Clermont-Ferrand Auvergne Airport (CFE)
    lat: 45.78558
    lon: 3.17294
    source: osm
  - kind: airport
    name: Lyon-Saint-Exupéry Airport (LYS)
    lat: 45.72442
    lon: 5.08652
    source: osm
animals:
  # Ticks (the French health insurance, ameli). Level ours. No official advice found on the guard
  # dogs of the Cévennes flocks, so none listed
  list:
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: low
      basis: "Ticks can pass on Lyme disease; a spreading red patch around the bite, 3 to 30 days after it, is the sign to see a doctor."
      do:
        - "Wear long clothes that cover the arms and legs and close at the wrists and ankles; put repellent on bare skin if you like"
        - "Carry a tick remover"
        - "Check your whole body when you get back and again the next day: armpits, the backs of the knees, the navel, the neck, the ears and the scalp"
        - "Remove a tick with a tick remover: slide the hook under it close to the skin and pull gently with a turning movement, then disinfect the skin"
        - "Watch the bite for a month and see a doctor if a red patch spreads around it, or if fever, tiredness or joint pain follow"
      dont:
        - "Put any product on the tick before removing it"
      source: ameli-tiques
tags: [literary, gr, mountains, cevennes, plateau]
notes:
  - >-
    The route follows Robert Louis Stevenson's walk of 1878 with his donkey Modestine ("Travels with
    a Donkey in the Cévennes"): from Le Puy-en-Velay over the volcanic Velay to Le Monastier (where
    he set out), through the Gévaudan to Langogne and past the abbey of Notre-Dame-des-Neiges, over
    the Mont Lozère to Le Pont-de-Montvert, Florac and the Cévennes valleys to Saint-Jean-du-Gard,
    and on to Alès. The first stage (from Le Puy) and the last (to Alès) are links on the GR 430 and
    the GR 61 / 44 D, not strictly the GR 70 (French Wikipedia), but the association's 272 km run
    from Le Puy to Alès.
  - >-
    Tree line: the route reaches 1,696 m on the Mont Lozère (terrain model, GEDTM30, 2026-11-07),
    whose summit moors are open grazing above a subalpine beech forest; no published tree line
    figure for the massif was found (2026-11-03), so none is drawn.
  - >-
    Map line: each stage follows its OSM section relation, every stage fully matched; 270.2 km
    against the stages' 267.9 km and the association's 272 km. No climbs are published; the page
    estimates them from the terrain model.
  - >-
    Data check (2026-11-03): the association's 272 km against English Wikipedia's 276 km (1.5 %);
    English Wikipedia's 225 km from Le Monastier to Saint-Jean-du-Gard against our stages 2–10,
    224.6 km. No deviation over 10 %.
dataCheck:
  # working rule 2: the association's totals and English Wikipedia
  date: 2026-11-03
  against: [assoc, wikipedia-en]
  deviations: []
