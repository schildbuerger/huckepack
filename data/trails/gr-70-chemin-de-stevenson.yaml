termini:
  # the cathedral of Le Puy-en-Velay and Alès (OSM)
  start:
    name: Le Puy-en-Velay
    lat: 45.04559
    lon: 3.88471
  end:
    name: Alès
    lat: 44.12537
    lon: 4.08528
  source: osm
established:
  # "formally adopted by the Fédération Française de la Randonnée Pédestre … in 1994"
  year: 1994
  source: wikipedia-en
waymarking:
  # "balisés de marques blanc-rouge"
  text: White over red GR stripes
  symbol: white-red-stripes
  source: assoc
length:
  # "272 km du Puy-en-Velay à Alès"; French Wikipedia's stages sum to 267.9 km
  - km: 272
    source: assoc
days:
  # "Il vous faudra entre 12 et 14 jours pour relier le Puy-en-Velay à Alès"
  min: 12
  max: 14
  basis: operator
  source: assoc
stages:
