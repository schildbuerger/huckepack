name: Timberline Trail
added: 2026-11-06
aliases: [Timberline Trail 600, Timberline Trail No. 600, Round the Mountain Trail]
website: https://www.fs.usda.gov/r06/mthood/recreation/trails/timberline-trail-600
wikidata: Q7804718
managedBy:
  # the Forest Service builds and maintains Trail #600 (Zigzag and Hood River Ranger Districts)
  - name: USDA Forest Service, Mt. Hood National Forest
    url: https://www.fs.usda.gov/r06/mthood
officialGpx:
  none: the Forest Service offers the trail description and map as a PDF, with no GPX to download (checked 2026-11-06)
  source: fs
trailType: loop
continents: [North America]
countries: [US]
regions: [Oregon]
protectedAreas: [Mount Hood Wilderness]
termini:
  # a loop round Mount Hood; "This trail can be accessed from many different points". The record
  # starts and ends at Timberline Lodge, the trail's best-known start, where the trail and the
  # Pacific Crest Trail pass above the lodge (coordinates from OSM)
  start:
    name: Timberline Lodge
    lat: 45.33111
    lon: -121.71175
  end:
    name: Timberline Lodge
    lat: 45.33111
    lon: -121.71175
  source: fs
length:
  # the Recreation Opportunity Guide: "The Timberline Trail itself is 24.5 miles long, but the entire
  # 'round the mountain trail' including the PCT is 41.5 miles long"
  - km: 66.8
    source: fs-rog
days:
  # "Most backpackers take 3 or 4 days for the entire loop"
  min: 3
  max: 4
  basis: operator
  source: fs
stages:
  # no stages by design (issue #204; docs/scope.md, "Trails without stages"): the Forest Service
  # gives the loop's days and describes ranger-district sections between trail junctions, with miles
  # for three of seven only (note "Stages"); hikers camp where they choose outside the closed areas
  source: fs
  none: true
route:
  # built by `python -m pipeline.all timberline-trail`: OSM ways matched to the trail's OSM relation,
  # the whole loop as one segment
  source: osm
  publishable: true
  relation: 7641482
difficulty:
  # the guide rates it "Most Difficult"; the page: river crossings, snowfields, washouts, blowdown
  estimated:
    sac: T3
    basis: >-
      The Forest Service rates the trail Most Difficult: it climbs in and out of glacier-fed
      drainages, with fast-moving river fords that have no bridges (Newton, Coe, Muddy Fork, Sandy
      and White Rivers, typically not more than knee deep), snowfields early in the season that need
      good footing, a wash-out north of Ramona Falls and blowdown between Muddy Fork and Yocum Ridge,
      and it is not fully maintained. Demanding mountain hiking (T3).
    source: fs
season:
  # "Seasons of Use: July - October"; the guide: "Snow Free … July to October"
  months: [7, 8, 9, 10]
  text: July to October
  source: fs
permit:
  # "Free, self-issued Wilderness permits are required from May 15 to October 15 when provided at a
  # portal"
  required: true
  name: Wilderness permit (free, self-issued)
  issuedBy: USDA Forest Service, Mt. Hood National Forest
  how: >-
    Fill in the free, self-issued wilderness permit at the trailhead's wilderness portal, required
    from 15 May to 15 October where a portal provides one. Some trailheads also need a day-use
    pass.
  url: https://www.fs.usda.gov/r06/mthood/recreation/trails/timberline-trail-600
  source: fs
sleeping:
  # "numerous places to camp in already established campsites like McNeil Point, Carin basin (stone
  # shelter), and Elk Cove"
  types: [campsite]
  source: fs
wildCamping:
  status: restricted
  rule: >-
    Camping in the Mount Hood Wilderness, in established campsites where there are some; not within
    any meadow, the tree-covered islands of Elk Cove and Elk Meadows or 500 feet of Ramona Falls.
    Campfires are prohibited near Ramona Falls and McNeil Point, in Elk Cove, Elk Meadows and
    Paradise Park; groups of at most 12.
  source: fs
access:
  # Portland International Airport and Portland Union Station (Amtrak). Coordinates from OSM;
  # distances by pipeline/access.py
  - kind: airport
    name: Portland International Airport (PDX)
    lat: 45.58713
    lon: -122.59278
    source: osm
  - kind: station
    name: Portland Union Station
    lat: 45.52897
    lon: -122.67701
    source: osm
animals:
  # the forest's "Respect Wildlife" page: "Be Bear Aware" and "Oregon is Cougar Country", linking the
  # Forest Service's bear advice and ODFW's cougar advice. Levels ours
  list:
    - kind: bear
      name: Black bear
      level: moderate
      basis: Black bears live throughout the forest; most are wary of people, but bears that find human food lose their fear of them.
      do:
        - "Do not run. Remain calm"
        - Group together and pick up small children
        - Continue to face the bear and back away slowly, talking calmly to identify yourself as a human
        - If the bear continues to approach, make yourself as large and imposing as possible and make loud noises
        - Carry bear spray and know how to use it
        - Keep food and other attractants in bear-resistant containers; cook and store food away from your sleeping area
      dont:
        - Do not feed bears or other wildlife
        - Do not store food or any scented items in a tent
        - "If you see a cub alone, don't approach"
      source: fs-bears
    - kind: big-cat
      name: Cougar (mountain lion)
      level: low
      basis: Virtually the whole forest is cougar territory; an approach is unlikely and attacks are rare, but they have happened, fatally on Mount Hood in 2018.
      do:
        - Hike in groups, make some noise as you go and stay alert
        - Keep dogs on a leash
        - "If a cougar does approach: stay calm and slowly back away"
        - Make eye contact
        - Make yourself bigger; raise your arms, hold small children
        - Shout, wave your arms, throw things at the animal
      dont:
        - "Don't run: a cougar could mistake you for prey and give chase"
        - "Don't bend down, and don't scream"
      source: odfw-cougars
tags: [volcano, glaciers, loop, river-fords, wilderness]
notes:
  - >-
    Stages: none by design. The Forest Service's page describes the loop by ranger-district
    sections between trail junctions, three with miles (Top Spur junction east to Cloud Cap 11.3
    miles, Cloud Cap south to Newton Creek about 5.9 miles, Newton Creek west to the Pacific Crest
    Trail 5.6 miles) and four without (Pacific Crest Trail west to Timberline Lodge, Timberline Lodge
    west to Paradise Park, Paradise Park north to Ramona Falls, Ramona Falls north to Top Spur), and
    says "Most backpackers take 3 or 4 days for the entire loop"; no stage list. The page shows the
    whole loop with the suggested days.
  - >-
    Length: the Forest Service gives several figures. The Recreation Opportunity Guide: Trail #600
    itself is 24.5 miles, "the entire 'round the mountain trail' including the PCT is 41.5 miles"
    (66.8 km, the record's figure, since the loop is what hikers walk); the trail page "~40-mile";
    the forest's wilderness page "encircles the mountain for 38 miles". Between Timberline Lodge and
    Yocum Ridge the loop follows the Pacific Crest Trail.
  - >-
    Closures: the guide's map marks the Muddy Fork to Yocum Ridge stretch "Massive wind damage,
    closed in 2021"; the trail page (updated 2025-08-28) says "This trail is not fully maintained",
    notes significant blowdown between Muddy Fork and Yocum Ridge and a wash-out about 2 miles north
    of Ramona Falls, and suggests bypassing that section on the PCT from Ramona Falls to Top Spur.
    The map line follows OSM's relation over the Timberline Trail itself.
  - >-
    Tree line: not added. No published figure for Mount Hood's tree line was found (the Forest
    Service's trail page, guide and wilderness page, searched 2026-11-06); the Forest Service says the
    trail "encircles Mt. Hood at or near tree line", and the guide gives the trail's elevation as
    3,480–7,320 feet (1,061–2,231 m).
  - >-
    Waymarking: the Forest Service's pages describe no waymarks; a forest trail with signs at
    junctions (not documented further).
  - >-
    Wildlife: the forest's "Respect Wildlife" page names black bears and cougars and links the Forest
    Service's "Be bear aware" page and ODFW's cougar advice, used here word for word. ODFW's own
    black bear page wasn't used (www.dfw.state.or.us didn't resolve on 2026-11-06).
  - >-
    Established: the Civilian Conservation Corps built the trail in the 1930s (the Forest Service);
    no year given, so the field is left out (Wikipedia: mostly in the summer of 1934).
  - >-
    Map line (2026-11-06): the Oregon Geofabrik extract (2026-11-05); OSM's "Mt. Hood Timberline
    Trail" relation (7641482, 10 ways, 64.5 km), chained from Timberline Lodge round the loop as one
    segment, 100 % matched (at most 21 m off). The main route measures 62.7 km against the guide's
    41.5 miles (66.8 km, −6 %); the record keeps the Forest Service's figure. The terrain model's
    highest point is 2,233 m at km 15.2 (GEDTM30, 2026-11-07) against the guide's 7,320 feet (2,231
    m), its lowest 997 m at km 46.0 (the Sandy River) against 3,480 feet (1,061 m, −6 %). No ascent
    is stated by the Forest Service; the page estimates about 2,770 m from the terrain model.
  - >-
    Resupply: OSM maps no shop within reach of the loop (the check's 62.7 km without resupply): the
    trail runs through wilderness, with Timberline Lodge (a hotel) and the Mt. Hood Meadows ski area
    as its only facilities. Carry food for the whole loop. Water: OSM maps two drinking water points
    (both near Timberline Lodge); the Forest Service says "Please treat all water before drinking",
    and the many glacial streams are the walker's water.
  - >-
    Data check (2026-11-06): against English Wikipedia (the only independent second source with
    figures). Length 41.5 miles (66.8 km, the guide) against 40.7 miles (65.5 km, −2 %); days 3–4
    against "three to five days" (agrees); season July to October against "Mid-July through early
    October" (agrees); highest point 7,320 feet (2,231 m) against Lamberson Spur 7,300 feet (2,225
    m, agrees); lowest 3,480 feet (1,061 m) against the Sandy River 3,240 feet (988 m, −7 %); start
    at Timberline Lodge (agrees: "most easily accessible from Timberline Lodge"); camping outside
    the meadows (agrees; Wikipedia adds at least 200 feet from water); difficulty from the river
    fords and washouts (agrees); the trail "alternates above and below the timberline" (the Forest
    Service: "at or near tree line"). Ascent: no official figure; the terrain model's ≈2,770 m
    (GEDTM30, 2026-11-07) is 1 % over Wikipedia's 9,000 feet (2,743 m; 11 % over on the former
    model). The permit, camping and campfire rules, season and days on the built page were checked
    one by one against the Forest Service's page and guide and agree.
