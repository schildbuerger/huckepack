animals:
  # Cattle (the Countryside Code, HSE) and ticks (NHS). Levels ours
  list:
    - kind: cattle
      name: "Cattle"
      level: moderate
      basis: "The Path crosses clifftop fields where cattle graze; the Health and Safety Executive names cows with calves and walkers with dogs as the two most common factors in incidents between cattle and the public."
      do:
        - "Give livestock plenty of space: their behaviour can be unpredictable, especially when they are with their young"
        - "Keep your dog on a lead around livestock"
        - "Let your dog off the lead if you feel threatened by livestock: releasing it makes it easier for you both to reach safety"
        - "Follow the farmer's directions when animals are being moved or gathered"
      dont:
        - "Risk getting hurt protecting your dog"
        - "Feed livestock"
      source: countryside-code
    - kind: tick
      name: "Ticks (Lyme disease)"
      level: moderate
      basis: "Ticks that can carry Lyme disease live all over the UK, in woods and long grass; the NHS names grassy and wooded areas in southern England and the Scottish Highlands as high-risk areas, and the whole Path runs through southern England."
      do:
        - "Cover your skin while walking and tuck your trousers into your socks"
        - "Use insect repellent on your clothes and skin; products containing DEET are best"
        - "Stay on clear paths whenever possible"
        - "Wear light-coloured clothing so ticks are easier to see and brush off"
        - "Remove a tick with fine-tipped tweezers or a tick-removal tool: grasp it as close to the skin as possible, pull slowly upwards, then clean the bite"
        - "Get an urgent GP appointment or call NHS 111 if, within 3 months of a bite, you feel unwell with flu-like symptoms or a round or oval rash appears"
      dont:
        - "Squeeze or crush the tick when you remove it"
      source: nhs-lyme
tags: [coast, cliffs, beaches, national-trail, ferries, national-park]
notes:
  - >-
    England's longest National Trail runs round the south-west peninsula from Minehead along
    Exmoor's cliffs and the North Devon coast, round all of Cornwall past Land's End and the Lizard,
    along the South Devon coast and the Jurassic Coast of Dorset to South Haven Point at Poole
    Harbour. It rises and falls at every river mouth.
  - >-
    Ferries: the Path crosses estuaries by passenger ferry (gov.uk: "a number of ferries that you
    have to take"): the Camel (Rock to Padstow), Helford, Fal (Falmouth to St Mawes and on to Place),
    Fowey (Polruan), Tamar (Cremyll), Yealm, Avon (Bigbury), Salcombe, Dart, Teign and Exe
    (Starcross to Exmouth). Several are seasonal or tidal (Wikipedia: "ferries with limited
    availability"); OSM's sections include them as ferry ways, so the map line and its kilometres
    run across them. The Erme has no ferry and is waded at low tide or walked round inland.
  - >-
    Map line: each stage follows its OSM section relation. On stage 43 the Starcross ferry lands on
    Starcross pier, which OSM maps as a pier without a path (way 13771996, `foot=customers`), so the
    matcher bridges its 105 m (`maxBridgeM: 150`; unknown surface); six short gaps in OSM's paths on the same stage, 5–33 m, take the other bridges first (`maxBridges: 12`).
  - >-
    The Lulworth Ranges (stage 51) are a military range, open to walkers only on most weekends and
    in holiday periods (Wikipedia names the closures as a hazard); check before setting out.
  - >-
    Stage figures: the itinerary gives whole miles (stage 15: 13.5) and sums to 627.5 miles
    (1,009.2 km) against the stated 630 miles (1,014 km); its weeks state 87 and 69 miles where their
    stages sum to 86 and 68. Stage 36 ends at the River Yealm (Wembury side) and stage 37 starts
    across it at Noss Mayo, by the seasonal Yealm ferry; the itinerary names that start "Wembury".
  - >-
    Tree line: the Path's highest point is the Great Hangman near Combe Martin, 318 m (Wikipedia),
    far below any tree line.
  - >-
    Map line and stages: the stages' sum, 1,009.2 km, and the map line, 1,009.0 km, agree, but OSM's
    section ends lie elsewhere than the itinerary's whole-mile days in a few towns, so twelve stages
    differ from it by more than 10 % (6: 17.5 against 20.9 km, 7: 13.6 against 17.7, 17: 22.0
    against 17.7, 20: 10.7 against 9.7, 21: 19.7 against 22.5, 25: 15.8 against 17.7, 30: 26.9
    against 22.5, 32: 17.2 against 19.3, 42: 21.9 against 17.7, 45: 15.8 against 17.7, 51: 19.5
    against 22.5, 52: 26.9 against 22.5); the page shows the itinerary's figures. Stage 49 is a
    loop round Portland, matched in two halves split at its farthest point; the South Dorset
    Ridgeway variant matches over its full 27.2 km.
  - >-
    Water: OSM has 99 drinking water points; the longest stretch without one is 25.1 km on the
    south Cornish coast (km 497–523, Falmouth to Portloe and on), where cafés and pubs in the
    coves are the refills.
  - >-
    Ascent: the terrain model gives about 18,250 m, about half the stated 35,000 m. On trails over
    1,000 km it samples the route every 500 m, which misses most of the coast's short, steep
    climbs into and out of the coves; the stated figure is the Association's sum along the path
    (Wikipedia: 35,031 m), which the page shows.
  - >-
    Data check (2026-11-03). Second source: Wikipedia: 630 miles (1,014 km) from Minehead to Poole
    Harbour, 114,931 ft (35,031 m) climbed, its last section designated in 1978, 30 to 60 days, open
    all year, highest point the Great Hangman (318 m). All agree with gov.uk and National Trails
    (35,031 against 35,000 m; 60 against 56 days, 7 %). No second source lists the 52 days; OSM's
    52 section relations are the same days and stage ends, and the built page was checked against
    the itinerary. The terrain model's climb is the one deviation over 10 % (above).
