route:
  # built by `python -m pipeline.all florida-trail`: OSM ways matched to guide lines over the
  # trail's four OSM region relations (the superroute 1163455's Southern, Central, Northern and
  # Panhandle Region), each stage the shortest way over their ways to its end
  source: osm
  publishable: true
  relation: [14480290, 14480289, 14480288, 14480287]
  branched: true
difficulty:
  estimated:
    sac: T1
    basis: >-
      The association: "No climbing, but still physically demanding", with marl mud and deep water
      in Big Cypress, eight miles of swamp forest in Bradwell Bay, rough uneven limerock and grass on
      the South Florida dikes and soft sand in the scrub of the Ocala National Forest, and long road
      walks. A flat trail on footpaths, forest roads, levees and roads (T1); wading, heat and the
      length make it hard.
    source: fta-faqs
season:
  # FAQs: "The hiking season in Florida runs roughly from late October through April … we
  # recommend thru-hikes start in the south in early January and end in the north by April"
  months: [10, 11, 12, 1, 2, 3, 4]
  text: Late October through April; thru-hikers are advised to start in the south in early January and finish in the north by April, avoiding most gun hunting restrictions in the winter dry season
  source: fta-faqs
permit:
  required: true
  name: Permits for the Seminole Reservation, Camp Blanding, St. Marks National Wildlife Refuge and Eglin Air Force Base
  issuedBy: the land managers (Seminole Tribe of Florida, Camp Blanding, U.S. Fish and Wildlife Service, Eglin Air Force Base)
  how: >-
    Hikers need permission to cross the Big Cypress Seminole Indian Reservation (a notarized release
    form, no camping), a permit through Camp Blanding's iSportsman system, a written camping permit
    with a fee for St. Marks National Wildlife Refuge, and thru-hikers a permit from Eglin Air Force
    Base's Jackson Guard; many campsites need a reservation, and the association asks thru-hikers to
    register at least 30 days before starting.
  url: https://floridatrail.org/permits/
  source: fta-permits
sleeping:
  # the section pages: backcountry and designated campsites, a few open-sided shelters (the FAQs:
  # "only seven hiker shelters"), motels in the towns along the road walks
  types: [campsite, bivouac, hotel]
  source: fta-regions
wildCamping:
  status: restricted
  rule: >-
    During hunting seasons on certain public lands hikers must use designated campsites; on many
    others they can camp where they wish, using Leave No Trace principles. Some land managers allow
    camping only at designated, often reserved campsites (the water management districts, St. Marks
    National Wildlife Refuge), and none on the Seminole Reservation.
  source: fta-faqs
access:
  # the international airports of Miami and Fort Myers, the nearest to Big Cypress; coordinates
  # from OSM, distances by pipeline/access.py
  - kind: airport
    name: Miami International Airport (MIA)
    lat: 25.79498
    lon: -80.28672
    source: osm
  - kind: airport
    name: Southwest Florida International Airport (RSW)
    lat: 26.53295
    lon: -81.75881
    source: osm
animals:
  # the National Park Service's Big Cypress National Preserve safety page (panthers, venomous
  # snakes) and the Forest Service's trail safety page (bears); level ours
  list:
    - kind: snake
      name: Venomous snakes (cottonmouth, rattlesnakes, copperhead, coral snake)
      level: moderate
      basis: The association counts six venomous snakes in Florida (the cottonmouth, three rattlesnakes, the southern copperhead and the eastern coral snake); Big Cypress says they are active year round and bites rare but serious.
      do:
        - Pay attention to where you walk and place your hands
        - Consider wearing high boots or protective leggings while hiking
        - Inspect your shoes and sleeping bags or bedding before use and always carry a flashlight at night
        - If you are bitten by a snake, it is crucial to exit the backcountry and go to the nearest emergency room
      dont:
        - Stay a safe distance from any wildlife
      source: nps-bicy-safety
    - kind: big-cat
      name: Florida panther
      level: low
      basis: Big Cypress calls itself panther country, where attacks are rare but do occur; the association knows of no panther that has harmed a person in modern times.
      do:
        - "Should you encounter an aggressive panther, hold your ground, wave your arms, throw stones, and shout"
        - Keep groups together
        - It is strongly advised to not hike alone
      dont:
        - Never run
      source: nps-bicy-safety
    - kind: bear
      name: Florida black bear
      level: low
      basis: The Forest Service says interactions between campers and Florida black bears are rising in the national forests; the association knows of no attack on a person by a Florida black bear.
      do:
        - Hang all attractants at least 10 feet above ground and 4 feet from any vertical support
        - Make noise to avoid surprising a bear
        - If a bear approaches you, move away slowly and get into a vehicle or secure area
        - Carry EPA registered bear pepper spray
      dont:
        - Never store food in your tent
        - Never approach a bear or other wild animal
        - DO NOT burn or bury any attractants
      source: usfs-safety
tags: [swamp, forest, lake, river, coast, beach, wilderness]
notes:
  - >-
    Stages: the association's sections on the main route. Their ends are named only for some
    ("Ocala South … from Clearwater Lake to SR 40", "Suwannee River … from Big Shoals State Park to
    Winquepin St.", "This section ends at Spring Hammock Preserve"); the others end where the land
    unit the section is named for ends on the Forest Service's centerline, and where the stated
    miles fit it best: Big Cypress South at I-75, Big Cypress North at the reservation's boundary,
    Seminole Tribe Reservation at the CR 835 crossing of the L-2 levee (its 40.3 miles end there,
    though the association's Okeechobee South text names the STA 5/6 campsite before it),
    Okeechobee South at Pahokee State Park and Okeechobee East on the dike north of Port Mayaca
    (both by their miles; the association names no point between them, and Okeechobee North's 33.1
    miles to Platts Bluff agree), KICCO at SR 60, Three Lakes at US 441, Bull Creek at US 192,
    Tosohatchee at St. Nicholas Road, Econfina River at the Foley Timber boundary, Pine Log at
    Strickland Road, Nokuse at US 331, Eglin East at SR 285, Eglin North at Log Lake Road, Eglin West
    (which the association describes with its Yellow River Ravines and Weaver Creek sections) at
    the Navarre Bridge. Stage 23 joins the association's Aucilla and Byrd Hammock entries (a slide
    without text or miles, and a page on the Byrd Hammock midden in St. Marks National Wildlife
    Refuge) from the Aucilla River tract through the refuge to Wakulla Beach Road, where
    Apalachicola East's 48.8 miles begin. Stage 20 ends at Cow Catcher Road, where the association
    ends Osceola National Forest, so stage 21 includes the short road walk to Big Shoals State Park.
    Stage 28 includes the SR 20 road walk from the Econfina Creek section's SR 20 trailhead to Pine
    Log's east end. These placements follow the sources as far as they go; an integrator may want to
    check them against the association's map set and data book (sold, not open).
  - >-
    Corridors: around Orlando the trail splits into the Eastern Corridor (Three Lakes North, Bull
    Creek, Tosohatchee, Lake Jesup, Cassia, Ocala South) and the Western Corridor (Upper Kissimmee,
    21.5 miles; Reedy Creek, 27.9; Green Swamp East, 25.4; Richloam/Green Swamp West, 30; Croom,
    20.1; Citrus, 31.4; Cross Florida Greenway West, 40.6; Cross Florida Greenway East and Ocala
    West, 32.2, to the 88 Store), which the association calls "an alternate route around Central
    Florida from the original thru-trail route, the Eastern Corridor". Around Lake Okeechobee
    hikers "have the choice of walking around the east or west sides" (Okeechobee West, 40.5
    miles); the Forest Service's centerline counts the east side in the Eastern Corridor. Both
    alternatives leave the main route inside a section (the Western Corridor at CR 523 in Three
    Lakes, Lake Okeechobee's west side at the S-3 lock) and rejoin inside another (the 88 Store in
    Ocala North, SR 78 in Okeechobee North), which the pipeline's variants (each beginning where a
    main stage ends) can't draw, so they are recorded here only. The official Blackwater River side
    trail (48.6 miles) to the Alabama line is left out like the association's own totals do.
  - >-
    Length: the association's FAQs give 1,287.9 miles for an Eastern Corridor thru-hike (903 miles
    of trail, 365.71 of road connector) and "~ 1,500 miles" for the whole trail with both corridors
    and the gaps, the figure the Forest Service gives ("currently about 1,500 miles long"); the
    record keeps the first, which covers the main stages' route. The association's section miles
    sum to about 1,060 miles on the main route (with the measured stages), far less: the GIS figure
    and the section pages don't agree with each other.
  - >-
    Start: the association's FAQs still give the southern terminus "on Loop Road (SR 94)"; its
    section page and the Forest Service's centerline put it at the Oasis Visitor Center, which the
    record uses.
  - >-
    Days: the association's "two to three months" for a thru-hike, recorded as 60 to 90 days. The
    Forest Service gives no days figure.
  - >-
    Ascent: neither the Forest Service nor the association states a total ascent or descent, nor per
    section, so the page estimates both from the terrain model.
  - >-
    Tree line: the trail stays below 100 m; no tree line applies.
  - >-
    Waymarking: the orange blaze is drawn from the source's description (`orange-blaze`,
    added 2026-11-07).
  - >-
    Wildlife: the Florida Fish and Wildlife Conservation Commission's pages (bears, venomous snakes,
    alligators) answered with a bot check (403) and were left out. The National Park Service's Big
    Cypress safety page gives the advice for panthers and venomous snakes, the Forest Service's
    trail safety page for black bears. Alligators are not listed, since the page has no kind for them: Big Cypress says
    "in the event that you meet an alligator on the trail, give it a wide berth and do not attempt to
    move it yourself", and the association "never throw your food scraps into a body of water … and
    don't bring a dog along if you're hiking into a swampy area". Big Cypress also names scorpions
    and spiders among the venomous animals active year round.
  - >-
    Map line (2026-11-07): the Florida Geofabrik extract (2026-11-05); OSM ways matched to guide
    lines over the four OSM region relations, every stage 100 % matched without bridges over 100 m.
    The main route measures 1,767.9 km on the map line against the association's 1,287.9 miles
    (2,072.7 km, −15 %; dataCheck.deviations) and its section miles summed with the measured stages
    (about 1,060 miles, 1,705 km, +4 %). Stages more than 10 % off their stated miles: 1 Big Cypress
    South +20 % (47.7 against 39.6 km), 8 Kissimmee Prairie +19 %, 10 Three Lakes −19 %, 12
    Tosohatchee +13 %, 30 Eglin East −22 %, 33 Seashore +16 %; the association's section miles seem
    older than the Forest Service's 2026 centerline (reroutes), and the record keeps them. Highest
    point 84 m at km 1,593 on Eglin Air Force Base, lowest 0 m at km 1,231 by the St. Marks salt
    marshes (terrain model, GEDTM30, 2026-11-07; nothing stated). The terrain model gives about
    1,520 m of climbing; nothing is stated.
  - >-
    Water: OSM maps 19 drinking water points and 52 springs within 500 m; the longest stretch
    without clean water (drinking water or a refill at a campsite) is 190 km (km 750–940, from the
    Ocala National Forest to Olustee), without public drinking water alone 756 km (km 1,010–1,766),
    without any water 343 km. The association: "All water in Florida should be treated unless identified as
    potable by signs", water is shown on its (sold) maps, and canal water along the South Florida
    levees "can be of dubious quality", so no waterPoints are added.
  - >-
    Resupply: OSM maps 64 shops near the trail, the longest stretch without one 408 km (km 176–585,
    from Pahokee round Lake Okeechobee and up the Kissimmee River to Christmas); the association
    lists gateway communities off the trail. Beds: 97 places to sleep (93 campsites), the longest
    stretch without one 151 km.
  - >-
    Access: Miami International Airport, 81.6 km by road from the Oasis Visitor Center, and
    Southwest Florida International Airport at Fort Myers, 137.2 km.
  - >-
    Data check (2026-11-07): against English Wikipedia and the Forest Service's pages (About the
    Trail, Safety and Outdoor Ethics) and centerline (KMZ). Termini: Wikipedia's Oasis Visitor Center
    (25.8571, −81.0329) and Fort Pickens parking lot (30.3286, −87.2896) against ours (25.85706,
    −81.03303; 30.32862, −87.28969): agree. Designation 1983: Wikipedia and the Forest Service agree.
    Length: Wikipedia and the Forest Service give 1,500 miles for the whole trail with both
    corridors (the association's "~ 1,500 miles" too), not the main route; the map line is 15 %
    under the association's 1,287.9 miles (deviations). Season: the Forest Service "most Florida
    hikers only hit the trail between October and April", Wikipedia "maintained for seasonal use
    September through April", against the association's late October through April: agree.
    Difficulty: Wikipedia "Moderate"; our T1 with Hard effort fits a flat but long trail. Hazards:
    Wikipedia names alligators, venomous snakes and bears, as listed (alligators in the Wildlife
    note). Days: only the association gives a figure. Section lengths: the association's miles
    against the Forest Service's centerline as matched to OSM, within 10 % on 21 of the 25 stated
    sections, the six over 10 % listed in the Map line note; the stage table on the built page was
    checked against the association's section pages, name by name and mile by mile.
