  # reaches the start) and the airports of Lisbon and Faro. Coordinates from OSM; distances by
  # pipeline/access.py
  - kind: bus
    name: Lisbon Sete Rios
    lat: 38.74183
    lon: -9.16627
    source: osm
  - kind: airport
    name: Lisbon Airport (LIS)
    lat: 38.78099
    lon: -9.13601
    source: osm
  - kind: airport
    name: Faro Airport (FAO)
    lat: 37.01751
    lon: -7.97058
    source: osm
tags: [coast, cliffs, sand, natural-park, beaches]
notes:
  - >-
    The trail follows the paths the locals take to the beaches and fishing spots along the cliffs of
    the Alentejo and the Costa Vicentina, from São Torpes near Sines past Porto Covo, Vila Nova de
    Milfontes, Zambujeira do Mar and Odeceixe into the Algarve, round Cabo de São Vicente to Sagres
    and along the south coast to Lagos. It is one of the Rota Vicentina's walking trails, beside the
    inland Historical Way.
  - >-
    Rules of the trail page: on foot only, at most 15 people per group, no vehicles in the dunes,
    trail running "not compatible with the care that this ecosystem requires"; private land is
    crossed with the owners' leave, for walkers only.
  - >-
    Stage figures: the page's stages sum to 221.2 km against its stated 226.5 km (2 %); the trail
    page also says "13 one day trails, with a maximum of 22.5 km", where the longest listed stage is
    22.6 km.
  - >-
    Ascent: the stages' stated climbs sum to 2,538 m up and 2,568 m down; the terrain model gives
    about 2,600 m along the map line (GEDTM30, 2026-11-07, +2 %; the former surface model gave 4,420
    m, 74 % more, counting every rise of the clifftops and dunes and the treetops in the 12 % of
    forest); the page shows the stated figures.
  - >-
    Tree line: the route stays near sea level (highest point 155 m in the terrain model, GEDTM30,
    2026-11-07), far below any tree line.
  - >-
    Wildlife: no official source on the animals a walker meets on the trail was found (2026-11-03),
    so none is listed.
  - >-
    Data check (2026-11-03). Second source: DECO PROteste (6 September 2024): 226 km from São Torpes
    to Lagos in 13 stages, the first and last about 10 km each, 70 % on sand, wild camping
    prohibited; it advises April to June and September to October against heat, rain and wind,
    inside the official September to June. All agree (226 against 226.5 km).
  - >-
    Wikidata: no article on the Fishermen's Trail or the Rota Vicentina in the Portuguese or English
    Wikipedia (2026-11-04), so no item.
  - >-
    Days (2026-11-07): Rota Vicentina's "13 one-day stages", recorded as 13 days.
