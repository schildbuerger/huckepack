route:
  # built by `python -m pipeline.all arizona-trail`: OSM ways matched to the passages' tracks
  source: osm
  publishable: true
difficulty:
  estimated:
    sac: T2
    basis: >-
      The association rates its passages from "Easy" (Coconino Rim, Buckskin Mountain) to
      "Difficult" (Superstition Wilderness, Four Peaks, the Grand Canyon's Inner Gorge) and
      describes rocky singletrack climbing thousands of feet from desert to the sky islands' conifer
      forests, a primitive trail through remote wilderness with long dry stretches, heat, flash
      floods and lightning, but no scrambling or exposed passages. Mountain hiking on built trails
      (T2); the heat, water and remoteness make it hard.
    source: ata-passages
season:
  # the Forest Service FAQs: "The AZNST sees the most thru-hiking use in spring and fall";
  # northbound "high-use season from Feb. 15 – May 15", southbound "Sept. 15 - Nov. 15"
  months: [2, 3, 4, 5, 9, 10, 11]
  text: Spring and fall; northbound thru-hikers start in February or March (mid-February to mid-May), southbound ones in mid-September or October (to mid-November)
  source: usfs-faqs
permit:
  # Permits: none for the long-distance trip, but for camping in two national parks and a county park
  required: true
  name: Camping permits in Saguaro and Grand Canyon National Parks
  issuedBy: National Park Service
  how: >-
    No permit is needed for a long-distance hike, but Saguaro National Park (passage 9) requires an
    entrance and a camping permit (in season the AZT Thru Hiker permit) and Grand Canyon National
    Park (passage 38) a backcountry camping permit, both through Recreation.gov; camping at Colossal
    Cave Mountain Park (passage 8) costs a fee.
  url: https://aztrail.org/explore/permits/
  source: ata-permits
sleeping:
  # Permits: designated campgrounds in Colossal Cave Mountain Park, Saguaro and Grand Canyon
  # National Parks; camping elsewhere; lodging in the gateway communities off the trail
  types: [campsite]
  source: ata-permits
wildCamping:
  status: restricted
  rule: >-
    Camping along the trail needs no permit on most of it, but Saguaro and Grand Canyon National
    Parks and Colossal Cave Mountain Park allow it only in designated campgrounds, with a permit or
    fee; on State Trust Land a State Land Recreation Permit is recommended to camp outside the
    trail's 15-foot corridor, and a year-round camping ban applies near Flagstaff.
  source: ata-permits
access:
  # hubs by the rules of 2026-11-07 (docs/scope.md: long-distance trains, the main station of a city
  # of 100,000, airports with international flights), suggested by pipeline/hubs.py and reviewed.
  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Benson
    lat: 31.9688
    lon: -110.29706
    source: osm
  - kind: station
    name: Tucson station (Amtrak)
    lat: 32.22312
    lon: -110.96671
    source: osm
  - kind: airport
    name: Phoenix Sky Harbor International Airport (PHX)
    lat: 33.43277
    lon: -112.00704
    source: osm
  - kind: airport
    name: Hermosillo International Airport (HMO)
    lat: 29.09222
    lon: -111.05634
    source: osm
animals:
  # the National Park Service: Saguaro National Park (passages 8–9) for rattlesnakes and mountain
  # lions, its bear safety page for black bears; level ours
  list:
    - kind: snake
      name: Rattlesnakes
      level: moderate
      basis: Six species of rattlesnake live in Saguaro National Park alone, and the association names rattlesnakes among the trail's hazards; bites are rarely fatal but painful and need a hospital.
      do:
        - If you see a rattlesnake, stay at least 10 feet from it
        - Wear boots and loose-fitting pants while hiking
        - Carry a flashlight after dark
        - If you are bitten by a rattlesnake, call 911 immediately
      dont:
        - Do not harass or attempt to kill snakes
        - Do not put your hands or feet where your eyes have not been
        - Do NOT attempt to treat a snake bite yourself
      source: nps-sagu-snakes
    - kind: big-cat
      name: Mountain lion
      level: low
      basis: Mountain lions live in both districts of Saguaro National Park and across Arizona's mountains; the park calls encounters rare, but possible.
      do:
        - Give the lion a way to escape
        - Stay calm and speak loudly and firmly
        - Stand and face it. Make eye contact
        - "Appear as large as you can: raise your arms and open your jacket"
        - FIGHT BACK if you are attacked
      dont:
        - Do not hike or jog alone
        - DO NOT RUN from a mountain lion
        - Do not feed wildlife
      source: nps-sagu-safety
    - kind: bear
      name: Black bear
      level: low
      basis: The association says mountain lions and bears inhabit Arizona but are for the most part shy of humans, and advises keeping food 100 yards from the tent or hung from a branch.
      do:
        - Identify yourself by talking calmly so the bear knows you are a human
        - Remain still; stand your ground but slowly wave your arms
        - If the bear is stationary, move away slowly and sideways
        - Hike and travel in groups
      dont:
        - Do NOT allow the bear access to your food
        - Do NOT run or make any sudden movements
        - Do NOT climb a tree
      source: nps-bears
tags: [desert, mountains, canyon, forest, wilderness]
notes:
  - >-
    Stages: the association's passages 1–32 and 34–43 are the main route (800.1 miles, 1,287.6 km;
    its "800 miles"), each with the miles on its page converted at 1.609344 km a mile. Passage 33
    (Flagstaff Urban Route, 15.4 miles, from Fisher Point in passage 31 through Flagstaff to the
    passage 34 junction at Schultz Pass) is the alternative to passage 32 (Elden Mountain, 14.8
    miles; the association: "If you're in need of resupply … you may wish to use the Flagstaff
    Urban Route (Passage 33) instead"), so main stage number 33 is missing on purpose and 33 is a
    variant. The Pusch Ridge Wilderness Bypass (11e, 18.0 miles) is "an alternate route for trail
    users to avoid the designated wilderness area within Passage 11", recommended for equestrians,
    and is a variant too. Each passage is guided by the association's own passage track (GPX,
    kept local, never committed).
  - >-
    Start: passage 1 begins at the border, which has no road; the association says one must start
    at Montezuma Pass, 1.8 miles north, and hike south to the border first ("adding 1.8 miles to
    the total distance"). Since 13 April 2026 the southernmost mile, from the border (Border
    Monument 102) to the Joe's Canyon Trail junction, is closed for the border wall's construction
    "until further notice (likely through the end of 2027)" (Arizona Trail Closed for Border Wall
    Construction); the record keeps the border as the start, the operator's terminus. The closure
    can't be drawn (a stage's `closed` cuts its end, not its start).
  - >-
    Closure: passage 38 has been closed from The Tipoff to the North Kaibab Trailhead since the
    flash floods of 29 August 2026 ("16 miles of the AZT within Grand Canyon are closed", the
    Silver and Black Bridges, Bright Angel Campground and Phantom Ranch closed); the association
    says "the only way around the closed area is to catch a ride from the North Rim to the South
    Kaibab Trailhead" (UPDATE for Autumn 2026). The North Kaibab Trail also has a waterline closure
    from 15 October 2026 to about February 2027. The stage is recorded `closed` at The Tipoff
    without detour legs (a ride round the canyon has no OSM line); the record keeps the stated
    miles.
  - >-
    Days: the Forest Service's "average time … is 43 days, with 60 days being common", recorded as
    43 to 60 days. The association publishes no days figure.
  - >-
    Season: the Forest Service's spring and fall thru-hiking seasons (northbound mid-February to
    mid-May, southbound mid-September to mid-November), recorded as February to May and September
    to November. The association's passage pages give each passage its own seasons (the southern
    and central desert passages "Fall, Winter and Spring", the high northern ones "Spring, Summer
    and Fall", several "All year").
  - >-
    Ascent: neither the association nor the Forest Service states a total ascent or descent, nor
    per passage (the passages' profiles are PDFs), so the page estimates both from the terrain
    model.
  - >-
    Wildlife: Arizona Game and Fish's pages (bears, mountain lions) answered with a Cloudflare
    check (403) and were left out; the National Park Service's Saguaro National Park and bear
    safety pages give the advice. The association and Saguaro National Park also warn of
    Africanized honey bees ("If you are attacked: run away as fast as you can … cover your head and
    face"), not listed since the page has no kind for bees; scorpions and spiders are named by the
    association without advice of an official source.
  - >-
    Tree line: the Coconino National Forest's order for the San Francisco Peaks (2024–2029) defines
    the 11,500-foot contour (3,505 m) as the tree line boundary; the trail passes the peaks' foot
    in passage 34 and doesn't reach it.
  - >-
    Map line (2026-11-07): the Arizona, Utah and Mexico Geofabrik extracts (2026-11-04/05; Mexico
    because the start lies on the border); OSM ways matched to the association's 44 passage tracks,
    every stage 99–100 % matched except two. Passage 5 (Santa Rita Mountains) is 50 % matched: OSM's
    newly mapped ways for the middle of the passage end on nodes 0 m from the older ways without
    sharing them, so the matcher takes a connected detour up to 1.25 km off the track (an OSM
    mapping fault, not fixable in the record). Passage 38 is 21 % matched, by design: it is cut at
    The Tipoff (the closure note), and OSM maps the North Kaibab Trail as `highway=construction`
    since the floods. The main route measures 1,224.2 km on the map line against the association's
    800 miles (1,287 km, −4.9 %; without passage 38, 1,217 against 1,254 km, −3.0 %). Highest point
    2,791 m at km 1,118 on the Kaibab Plateau, lowest 508 m at km 434 by the Gila River (no stated
    figures from the association). The terrain model gives about 22,550 m of climbing (GEDTM30,
    2026-11-07); nothing is stated.
  - >-
    Water: OSM maps 28 drinking water points and 97 springs within 500 m of the trail; the longest
    stretch without clean water is 160 km (km 250–411, passages 14–16 from Freeman Road over the Gila
    River), without any mapped water 112 km. The association keeps a water report of springs, tanks,
    creeks and caches (Water Sources) without coordinates for the record, says hikers may need a
    gallon a day and that all natural water must be purified, so no waterPoints are added.
  - >-
    Resupply: OSM maps 17 shops near the trail, the longest stretch without one 253 km (km 32–285,
    from Parker Canyon Lake to Oracle); the association's gateway communities lie off the trail
    (Sierra Vista, Patagonia, Sonoita, Vail, Tucson, Summerhaven, Oracle, Kearny, Superior,
    Roosevelt, Payson, Pine, Mormon Lake Village, Flagstaff, Tusayan, the Grand Canyon's rims, Jacob
    Lake and Kanab), and passage 13 has a resupply cache box at Highway 77.
  - >-
    Beds: OSM maps 97 places to sleep near the trail (95 campsites), the longest stretch without one
    217 km (km 250–468, from Freeman Road to the Superstitions); camping is allowed along most of the
    trail (the wild camping rule).
  - >-
    Access: Tucson's airport and Amtrak station, 154 and 164 km by road from the border; the
    association names shuttles from the Tucson airport to Coronado National Memorial and Montezuma
    Pass.
  - >-
    Data check (2026-11-07): against the Forest Service's pages (About the Trail; Land and Resources
    Management) and English Wikipedia. Length: "approximately 800 miles" (Forest Service) and 800
    miles (Wikipedia) against the association's 800 miles (1,287 km) and the main passages' 800.1
    miles: agree. Passages: 43 in both. Termini: the Forest Service "from Mexico's Huachuca
    Mountains … to the Utah border … at Buckskin Mountain Passage", Wikipedia Coronado National
    Memorial and the Arizona–Utah border: agree. Designation 2009 (Wikipedia: 30 March 2009) and
    completion 2011: agree. Season: Wikipedia "Year-round at lower elevations, Summer and Fall at
    higher elevations", which matches the passage pages' seasons; the record keeps the Forest
    Service's thru-hiking seasons (spring and fall). Days: only the Forest Service gives a figure.
    Permits and camping: the Forest Service FAQs list the same permits (Saguaro and Grand Canyon
    National Parks, Colossal Cave Mountain Park, State Trust Land) as the association. Lowest point:
    508 m on the terrain model against Wikipedia's 1,700 ft (518 m) at the Gila River (−2 %);
    Wikipedia's highest point, 9,600 ft on the San Francisco Peaks, is "on a proposed section" and
    not compared. Difficulty: Wikipedia "Easy to Strenuous", the passages Easy to Difficult; our T2
    estimate fits. The 44 passages' miles, ends and the termini on the built page were checked one
    by one against the association's pages and agree. Derived against stated: the map line is
    4.9 % under the stated length; passage 38 is 79 % short on the map line because of its closure
    (dataCheck.deviations).
dataCheck:
