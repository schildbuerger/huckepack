route:
  # built by `python -m pipeline.all schluchtensteig`: OSM ways matched to the stages' tracks
  source: osm
  publishable: true
difficulty:
  # no grade is published; our estimate from the official descriptions
  estimated:
    sac: T2
    basis: >-
      The official stage pages describe narrow paths through the gorges, "teils etwas ausgesetzten
      schmalen Pfaden" in the Wutachflühen, an 8 m ladder-like stair into the Schleifenbach gorge
      (with a detour for dogs and walkers without a head for heights) and rock walls "mithilfe eines
      Drahtseilgeländers gesichert" along the Wutach. Mountain hiking on mostly good paths with a few
      secured, slightly exposed sections (T2); German Wikipedia rates every stage "schwer".
    source: sst
season:
  # "Die beste Wanderzeit ist von Mai bis Oktober; mit dem ersten Schnee wird seine Begehung, meist
  # ab November, nicht mehr empfohlen" (German Wikipedia)
  months: [5, 6, 7, 8, 9, 10]
  text: May to October; not recommended once the first snow falls, usually from November
  source: wikipedia
sleeping:
  # the official "Steiggastgeber" (rooms, holiday flats), the Black Forest's trekking camps and the
  # one-night camps along the trail
  types: [hotel, guesthouse, campsite]
  source: sst
wildCamping:
  status: restricted
  rule: >-
    Tents only at the Black Forest's bookable trekking camps (May to October, "erstmals ganz
    offiziell erlaubt", off the villages and found by GPS) and at the one-night camps that farmers,
    villages and private hosts offer along the Schluchtensteig; elsewhere camping in the forest isn't
    allowed.
  source: sst
access:
  # Basel Badischer Bahnhof, the official arrival page's recommended station (then train and bus to
  # Stühlingen); EuroAirport Basel-Mulhouse and Zürich airports. Coordinates from OSM; distances by
  # pipeline/access.py
  - kind: station
    name: Basel Badischer Bahnhof
    lat: 47.56746
    lon: 7.60731
    source: osm
  - kind: airport
    name: EuroAirport Basel-Mulhouse (BSL)
    lat: 47.59914
    lon: 7.53028
    source: osm
  - kind: airport
    name: Zürich Airport (ZRH)
    lat: 47.46314
    lon: 8.55185
    source: osm
animals:
  # Cattle on the suckler-cow pastures the official FAQ warns of, and ticks (the RKI's TBE risk areas,
  # 2026, with the federal health agency's advice). Levels ours
  list:
    - kind: cattle
      name: Suckler cows on the pastures
      level: moderate
      basis: "The official FAQ warns that the trail crosses pastures with suckler cows in season, where a mother cow defending her calf can't be ruled out."
      do:
        - "Cross the pasture quickly"
        - "Keep your distance from cows and calves"
        - "Keep your dog on a lead"
      source: sst
    - kind: tick
      name: "Ticks (Lyme disease, tick-borne encephalitis)"
      level: moderate
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; the Robert Koch Institute lists every district the Schluchtensteig crosses (Waldshut, Schwarzwald-Baar, Breisgau-Hochschwarzwald) as a risk area for tick-borne encephalitis (TBE), against which a vaccine protects."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
        - "Ask a doctor about the TBE vaccination well before you go: Germany's vaccination committee (STIKO) recommends it for people exposed to ticks in TBE risk areas"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [gorges, waterfalls, forest, lakes, black-forest]
notes:
  - >-
    The trail runs from Stühlingen on the Swiss border through the Wutach gorge (stages 1–3), over
    the Bildstein and round the Schluchsee to the highest point at the Krummenkreuz (1,148 m), to
    St. Blasien's dome, over the Hotzenwald to Todtmoos and down the Wehra gorge to Wehr. A
    "Qualitätsweg Wanderbares Deutschland", recertified in 2025 (German Wikipedia). The official
    site lists refill stations for drinking water along the trail. Stage 2's end at the Schattenmühle
    has no bus; hosts in Bonndorf, Löffingen, Bräunlingen or Hüfingen collect walkers by
    arrangement (official stage page).
  - >-
    Figures: the official overview gives 119 km with 3,180 m up and 3,290 m down; the six stage
    tours sum to 119.6 km, 2,958 m up and 3,065 m down (7 % less climbing). The page shows the
    official total pair and the stage tours' figures per stage. Times from the stage tours; the
    official stage pages give 5.5, 6, 6, 5.5, 6 and 7.5 h (stage 4: 5.5 against 6.5 h).
  - >-
    Season: May to October (German Wikipedia; the official FAQ calls the gorges pleasantly cool in
    summer). Wild camping: only at the trekking and one-night camps. Tree line: none recorded, the
    trail stays below 1,148 m.
  - >-
    Map line: every stage 100 % matched to OSM, 117.5 km against the tours' 119.6 km (2 %).
    Terrain model: about 4,340 m up against the tours' 2,958 m and the official 3,180 m; the model
    reads the treetops (76 % of the route is forest), so the page shows the official pair. Highest
    point on the model 1,160 m against the official Krummenkreuz 1,148 m.
  - >-
    Supply: villages and towns at every stage end (Blumberg, Lenzkirch, Schluchsee, St. Blasien,
    Todtmoos, Wehr); stage 2 runs through the gorge without a village.
