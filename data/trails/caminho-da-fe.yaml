    url: https://caminhodafe.com.br/ptbr/a-associacao/
officialGpx:
  none: "The Associação publishes no GPX or KML track (its route, media and download pages searched 2026-11-07)"
  source: aacf
trailType: point-to-point
continents: [South America]
countries: [BR]
regions: [São Paulo, Minas Gerais]
protectedAreas:
  # OSM protected areas containing points of the main route (2026-11-07): the federal environmental
  # protection areas (ICMBio) and the Campos do Jordão state park (Fundação Florestal)
  - Área de Proteção Ambiental Serra da Mantiqueira
  - Área de Proteção Ambiental Bacia do Paraíba do Sul
  - Parque Estadual de Campos do Jordão
termini:
  # the main branch (ramal principal) from Águas da Prata to the Basilica in Aparecida (the operator);
  # coordinates: the OSM route's points in Águas da Prata and at the Basilica
  start:
    name: Águas da Prata
    lat: -21.93754
    lon: -46.71523
  end:
    name: Aparecida
    lat: -22.84738
    lon: -45.23392
  source: aacf
waymarking:
  # "a cada 2 Km você encontrará placas indicativas que indicam a distância restante até a Basílica
  # … as setas amarelas durante todo o trajeto" (Características)
  text: Yellow arrows on posts and fence posts throughout, and signs every 2 km with the distance left to the Basilica
  source: aacf-features
stages:
  # stages 1–10: the operator's stage list (Distâncias, one image per stage with its distance), from
  # Águas da Prata to Campos do Jordão. Its stages 11–12 (Campos do Jordão – Pindamonhangaba 52 km,
  # Pindamonhangaba – Aparecida 22 km) aren't mapped in OSM; the end follows the operator's other
  # main branch instead, by Gomeral/Pedrinhas and Potim, with the legs and distances of its map (Mapa
  # vs. 2.12, 2025), numbered on as 11–13 (user's decision 2026-11-07, issue #274): Campos do Jordão –
  # Gomeral/Pedrinhas 32 km; then 14 km to the unnamed junction where the Ribeirão Grande link joins
  # and 12 km on to Potim, one stage of 26 km here, since the junction is no place to stop; the map
  # numbers no distance for the last stretch, Potim – Aparecida, so it is measured on the map line
  # (huckepack-measured). Gomeral (the map's "Gomeral / Pedrinhas") is placed where the route meets
  # its pilgrims' café, church and pousada on the Estrada do Gomeral (OSM), 32.0 km along the map line
  # from Campos do Jordão. No public GPX: each stage is the shortest way over the OSM relation "Caminho
  # da Fé" (15057811, route=bicycle, one connected network with the Potim branch) to its end
  # (`branched`)
  source: aacf
