animals:
  # Ticks (the Hungarian government offices' public information, 2025). Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease, tick-borne encephalitis)"
      level: moderate
      basis: "Ticks in Hungary carry Lyme disease and tick-borne encephalitis; the government offices recommend the TBE vaccine especially to hikers."
      do:
        - "Get vaccinated against tick-borne encephalitis; there is no vaccine against Lyme disease"
        - "Wear closed clothing: long sleeves and long trousers, the trouser legs tucked into the socks"
        - "Use an approved tick repellent on clothes or skin, and repeat it when it wears off"
        - "After the walk, check your whole body, especially the skin folds, the hollows of the knees, the neck and behind the ears"
        - "Remove a tick quickly: within 4 to 6 hours is safe against encephalitis, within 24 hours keeps the risk of Lyme disease low"
        - "Watch your health after a bite, especially the skin around it, and for fever, tiredness or aching joints"
      dont:
        - "Squeeze the tick's body while you remove it"
      source: hu-kullancs
tags: [national-trail, hills, forests, castles, danube-bend]
notes:
  - >-
    Stages: 59 days add up to the official 1,183.1 km, 31,915 m of ascent and 32,500 m of descent
    (the 161 stamping points' legs, Szakaszadatok 2026-09-10). Days 1–37 follow MTSZ's recommended
    day stages for sections 1–17 (section 1's third day ends at the Szeleste stamping point, not
    the Ölbő-Alsószeleste railway stop the page names, so both days keep official figures);
    sections 5, 7, 12–15, 20–22 are one day each; days 38–59 (sections 18–27) are our grouping of
    the official legs into days of about 20–28 km, as MTSZ recommends none there. Times are the
    official walking times west to east, without breaks. Tepke has no stamping-point coordinates in
    the official file: its day ends on the section 19 track at the stamping point's official
    kilometre (51.9 km). Every day ends on its section's track at its stamping point's official
    kilometre (scaled to the track's length): stamping points often sit off the track in a village.
  - >-
    Wild camping: the Forest Act's § 93(1) as quoted by Pénzcentrum (2023), since njt.hu didn't
    answer on 2026-11-01; the act allows a stay of under 24 hours, the article reads, but its
    wording is unclear and protected areas are stricter.
  - >-
    Route (pipeline, 2026-11-01, Geofabrik extracts): each day's piece of its section's official
    GPX guides the matcher; every day matches at least 96 %, and the map line is 1,166.2 km
    against the official 1,183.1 km (1.4 %). The Danube between Visegrád and Nagymaros is crossed
    by ferry and is not part of any day.
  - >-
    Ascent: the official 31,915 m against the terrain model's ≈ 22,440 m (GEDTM30, 2026-11-07; 30 %
    lower, in dataCheck): on trails over 1,000 km the model is sampled every 500 m, which smooths
    away short climbs; English Wikipedia's 31,460 m agrees with the official figure.
  - >-
    Water (2026-11-01, within 500 m): 623 drinking water points in OSM; the longest stretch without one is 30.9 km (km
    478–509, days 27–28 in the Gerecse hills); the official section pages name the springs and
    villages to refill at. Beds: 30.3 km without a bed of the kinds counted (km 81–111, days 5–7
    between Sárvár and Ötvös); hotels are not counted.
  - >-
    Travel hubs: Sátoraljaújhely station serves the finish at Hollóháza, 508 km by road from the
    start; Kőszeg station and Vienna airport serve the start.
  - >-
    Data check (2026-11-01). Second source: English Wikipedia (1,172.4 km and 31,460 m climbing west
    to east as of March 2023, Írott-kő to Hollóháza, the blue stripe on white). Length (0.9 %) and
    ascent (1.4 %) agree, the difference being the yearly route changes; the 59 days' sums equal the
    official totals. The terrain model's highest point is 1,007 m on the Kékes (GEDTM30, 2026-11-07)
    (Hungary's highest, 1,014 m).
  - >-
    Days: none stated by the MTSZ (2026-11-04) beyond its 59 day stages; the page counts one day per
    stage.
  - >-
    Season: none published (kektura.hu, Wikipedia in six languages; searched 2026-11-05); every month is recorded for now, by the rule for trails without a published season. The MTSZ posts temporary closures of stretches for driven hunts in late autumn and winter.
