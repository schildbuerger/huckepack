name: Országos Kéktúra
added: 2026-11-01
aliases: [National Blue Trail, OKT, Kéktúra, Blue Trail]
website: https://www.kektura.hu/okt-szakaszok
wikidata: Q60088
managedBy:
  # MTSZ has run the trail since 1961; part of the National Blue Circuit (Országos Kékkör)
  - name: Magyar Természetjáró Szövetség (Hungarian Hiking Association, MTSZ)
    url: https://www.kektura.hu/
officialGpx:
  # the page listing the Kéktúra's GPX files (the whole route, with or without the stamping points, and each section). Not the file itself: its name carries the date and changes with each update, and on 2026-11-05 the track-only link gave 404 while the track with stamping points worked (checked 2026-11-05)
  url: https://www.kektura.hu/okt-szakaszok
  by: the Hungarian Hiking Association (MTSZ)
  source: kektura
trailType: point-to-point
continents: [Europe]
countries: [HU]
regions: [Vas, Zala, Veszprém, Fejér, Komárom-Esztergom, Pest, Budapest, Nógrád, Heves, Borsod-Abaúj-Zemplén]
protectedAreas:
  - Írottkő Nature Park
  - Balaton Uplands National Park
  - Duna–Ipoly National Park
  - Bükk National Park
  - Aggtelek National Park
termini:
  # Írott-kő on the Austrian border, Hollóháza by the Slovak border: the first and last points of
  # the official section tracks
  start:
    name: Írott-kő
    lat: 47.35276
    lon: 16.43375
  end:
    name: Hollóháza
    lat: 48.54199
    lon: 21.41329
  source: kektura
waymarking:
  # MTSZ calls it the blue mark, "K jelzés"; English Wikipedia describes it: "a horizontal blue
  # stripe on a white rectangle"
  text: The blue mark (K jelzés), a blue stripe on white
  symbol: blue-stripe-on-white
  source: wikipedia-en
length:
  # "1 183,1 km" (OKT szakaszok, 2026)
  - km: 1183.1
    source: kektura
ascent:
  # "szint +/- 31 915 m / 32 500 m"
  - m: 31915
    source: kektura
descent:
  - m: 32500
    source: kektura
stages:
  # MTSZ's 27 sections are 14–74 km, so the stages are days (user's decision 2026-11-01,
  # docs/scope.md): sections 1–17 in the day stages each section page recommends ("Ajánlott napi
  # szakaszolás"; section 1's third day ends at the Szeleste stamping point instead of the
  # Ölbő-Alsószeleste railway stop), sections that are one day long as one stage, and sections
  # 18–27, which recommend none, grouped by us into days of about 20–28 km between stamping points.
  # Every figure is the sum of the official legs between stamping points (Szakaszadatok, 2026-09-10:
  # distance, ascent, descent, time west to east). Each day names its section's official GPX, cut at
  # the day's end (the track's point at the stamping point's official km within the section); it only guides the OSM matcher
  # (kept local). Section 16 ends at Visegrád, 17 starts at Nagymaros: the Danube ferry between
  # them is not walked
  source: kektura
