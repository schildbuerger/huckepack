  estimated:
    sac: T2
    basis: >-
      MTSZ's section descriptions lead over the Hungarian Central Range on forest paths and tracks,
      with steep climbs in the Pilis, Börzsöny, Mátra (Kékes, 1,014 m, Hungary's highest point)
      and Zemplén hills, and long flat stretches on field roads and tarmac in the west; no secured
      or exposed passages. Mountain hiking on mostly good paths (T2).
    source: kektura
