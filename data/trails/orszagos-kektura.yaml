wildCamping:
  status: restricted
  rule: >-
    Anyone may walk in Hungary's forests, but staying more than 24 hours, camping and pitching a
    tent there need the forest manager's consent (Forest Act § 93(1)); in national parks and other
    protected areas only at designated sites or with the park directorate's permit.
  source: forest-act
