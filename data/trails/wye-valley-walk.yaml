name: Wye Valley Walk
added: 2026-11-06
aliases: [Llwybr Dyffryn Gwy]
website: https://www.wyevalleywalk.org/
wikidata: Q8039721
managedBy:
  # the Wye Valley Walk Partnership, who "work to conserve and enhance the natural beauty of the Wye
  # Valley", with the Wye Valley National Landscape (AONB); the official website
  - name: Wye Valley Walk Partnership
    url: https://www.wyevalleywalk.org/
trailType: point-to-point
continents: [Europe]
countries: [GB]
regions: [Wales, England]
protectedAreas: [Wye Valley National Landscape]
termini:
  # the 17 sections run from Rhyd-y-benwch (the Hafren Forest car park near Llanidloes) to Chepstow,
  # the Tourist Information Centre by the castle (coordinates from OSM)
  start:
    name: Rhyd-y-benwch (Hafren Forest)
    lat: 52.4695
    lon: -3.6792
  end:
    name: Chepstow
    lat: 51.64401
    lon: -2.67505
  source: wvw-sections
established:
  # "In 1975 the Wye Valley Walk opened" (Wikipedia; the site celebrated its 50th birthday in 2025)
  year: 1975
  source: wvw
waymarking:
  text: Circular yellow waymark arrows, finger posts and signs with the walk's logo, a leaping salmon
  source: wikipedia-en
length:
  # "the Wye for 136 miles" (219 km) on the home page; the walk page says 138 miles
  - km: 219
    source: wvw
days:
  # "Walking around 13 ½ miles a day you can complete the Wye Valley Walk in 10 days. Very fit and
  # determined walkers, covering 19 miles daily, can complete it in 7 days"; "12 days will allow you
  # time to explore"
  min: 7
  max: 12
  basis: operator
  source: wvw-walk
stages:
