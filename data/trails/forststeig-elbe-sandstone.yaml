tags: [sandstone, table-mountains, cross-border, trekking-huts, forests]
notes:
  - >-
    Sachsenforst's totals (ascent 2,911 m, descent 2,925 m) differ from the sum of its own stage
    figures (2,803 m and 2,811 m). The page uses the stage figures.
  - >-
    Stage lengths are rounded to whole kilometres on the route overview, and Sachsenforst's own
    GPX tracks differ on stages 5–7 (17.8, 14.8 and 10.6 km against 20, 12 and 9 km stated).
  - >-
    Sachsenforst publishes no walking times per stage. The regional tourism association's stage
    pages (saechsische-schweiz.de, Outdooractive) give times and slightly different lengths, e.g.
    stage 1: 15.81 km, about 6 h.
  - The home page says 6 to 8 days; the route overview recommends 7 day stages.
  - >-
    No difficulty grade is published (no SAC or DAV grade). Sachsenforst's home page says
    "Schwierigkeit: schwer" and calls it demanding, for experienced, sure-footed and well-equipped
    hikers, mostly on simple forest paths and forestry lanes. The regional tourism association
    (saechsische-schweiz.de) rates the whole route schwer (fitness: sehr schwer), stage 3 schwer
    (ladder up the Sachsenstein, rock gorges) and stages 1 and 4 mittel (2, 5, 6, 7 mittel per its
    search listing, not opened). The SAC T3 in `difficulty.estimated` is our translation: T2 for
    most of the route, T3 for stage 3 and the off-path forestry lanes; the hardest parts set the
    grade.
  - >-
    Three of the five trekking huts (and some bivouac sites) lie on detours off the route; the
    detours aren't in the stage list.
  - The rules sheet (Forststeig Kodex PDF) is an image without text; the bivouac rules come from the separate bivouac information sheet.
  - Sachsenforst asks hikers to avoid weekends and public holidays, when the forest sites are often full.
  - >-
    Data check (2026-10-29), against the Tourismusverband Sächsische Schweiz's route page and its
    seven stage pages (structured data: tourLength, ROUTE_HOEHENMETER/_DESC, elevationMax/Min,
    Dauer). Within 10 %: total length (104.01 against 105 km), total ascent and descent (2,966 /
    2,977 against 2,803 / 2,811 m from the stage sums), highest and lowest point (723 / 120 m against
    723 / 117 m from the terrain model), stage lengths 1–4, stage climbs 3–5, start and finish, season
    (April to October), difficulty (schwer; our estimate T3). More than 10 % apart (listed in
    `dataCheck`): stage lengths 5–7, where the Tourismusverband agrees with
    Sachsenforst's own GPX tracks, not with its route overview; and the climbs of stages 1, 2, 6
    and 7, which the Tourismusverband measures along its GPS tracks. Our DIN 33466 time estimates
    were up to a third shorter than the Tourismusverband's times (4–7 h), so the page now shows its
    times instead (`stages.timesSource`).
  - >-
    Route (pipeline, 2026-10-30): stage 1 matches only 86 % of its GPX track. OSM has paths all
    along the GPX there, but they aren't connected where the track runs: (km 9.0–11.2 of the
    track, from 50.85679,14.17501) the map line detours up to 574 m, and two path ends 9 m apart at
    50.86317,14.16866 don't share a node. Joining them in OSM should close the detour (rerun
    pipeline.all afterwards). The map line is therefore shorter than the stated length (13.7
    against 15 km). Stage 5 (93 % until 2026-10-30) walks a short loop and back, which the matcher
    skipped; since it matches each leg of such a loop on its own, stage 5 matches 100 %.
  - >-
    Tree line (2026-10-30): none in reach. The route tops out at about 720 m; the nearest mountains
    with a natural tree line, the Krkonoše, have it at about 1,250–1,350 m, so no treeLine is
    recorded and the terrain chart shows none.
dataCheck:
  # working rule 2: every figure against the Tourismusverband's route and stage pages
  date: 2026-10-29
  against: [tvsaechsischeschweiz]
  deviations:
    - { figure: "Stage 5 length", ours: "20 km", theirs: "17.8 km", source: tvsaechsischeschweiz }
    - { figure: "Stage 6 length", ours: "12 km", theirs: "14.8 km", source: tvsaechsischeschweiz }
    - { figure: "Stage 7 length", ours: "9 km", theirs: "10.6 km", source: tvsaechsischeschweiz }
    - { figure: "Stage 1 ascent and descent", ours: "616 / 351 m", theirs: "712 / 414 m", source: tvsaechsischeschweiz }
    - { figure: "Stage 2 ascent and descent", ours: "383 / 323 m", theirs: "442 / 414 m", source: tvsaechsischeschweiz }
    - { figure: "Stage 6 ascent and descent", ours: "347 / 346 m", theirs: "395 / 464 m", source: tvsaechsischeschweiz }
    - { figure: "Stage 7 ascent and descent", ours: "249 / 455 m", theirs: "367 / 515 m", source: tvsaechsischeschweiz }
