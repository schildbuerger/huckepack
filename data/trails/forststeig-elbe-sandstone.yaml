route:
  # built by `python -m pipeline.routes forststeig-elbsandstein`: OSM ways matched to the stage
  # tracks above; Sachsenforst's GPX only guides which ways, none of its geometry is used
  source: osm
  publishable: true
difficulty:
  # no SAC grade is published; our estimate, see the note on difficulty below
  estimated:
    sac: T3
    basis: >-
      Sachsenforst rates the route "difficult", for experienced, sure-footed and well-equipped
      hikers. Most of it runs on simple forest paths and tracks (SAC T2), but it also follows
      forestry lanes where the way isn't always obvious, and stage 3, which the regional tourism
      association rates "difficult" (the other stages "medium"), leads through rock gorges and up
      narrow metal ladders. The SAC scale grades a route by its hardest parts, so T3.
    source: tvsaechsischeschweiz
season:
  months: [4, 5, 6, 7, 8, 9, 10]
  text: April to October
  source: sachsenforst
sleeping:
  # trekking huts are unstaffed shelters (bivouac); bivouac sites are tent pitches, counted with
  # the campsite in Ostrov; partner accommodation are guesthouses and inns
  types: [bivouac, campsite, guesthouse]
  source: sachsenforst
wildCamping:
  status: restricted
  rule: >-
    Tents are allowed only at Sachsenforst's bivouac sites, from April to October: for one night,
    between 4 pm and 10 am, within 20 m of the site and at most five two-person tents, with a
    trekking ticket (€10 per adult and night, bought in advance and validated on arrival; no
    reservation). Neither the bivouac sites nor the trekking huts have drinking water.
  source: sachsenforst-biwak
