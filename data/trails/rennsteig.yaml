route:
  # built by `python -m pipeline.all rennsteig`: OSM ways matched to the tour's line
  source: osm
  publishable: true
difficulty:
  # the tour is rated "schwer" over its whole length; no SAC grade. Our estimate
  estimated:
    sac: T1
    basis: >-
      A ridge path on forest roads, tracks and paths along the crest of the Thuringian Forest, the
      Thuringian Slate Mountains and the Frankenwald, well marked throughout; the Regionalverbund
      names the steep climb of over 550 m on stage 2 up the Großer Inselsberg, otherwise long
      gentle stretches, and open fields before Blankenstein. Hiking on good paths (T1).
    source: rv-list
season:
  # "Ab April beginnt dann die Thüringer Wanderzeit und endet erst im Oktober"; from mid-November
  # to the end of March the Rennsteig is a cross-country ski track when snow lies
  months: [4, 5, 6, 7, 8, 9, 10]
  text: April to October
  source: rv-list
sleeping:
  # the Regionalverbund's list of hosts up to 2.7 km from the Rennsteig: hotels, guesthouses,
  # inns, holiday flats, and the Frankenwald trekking site at Rennsteig km 133.6
  types: [hotel, guesthouse, campsite]
  source: rv-list
access:
  # Eisenach Hauptbahnhof, the nearest main station to Hörschel, and Frankfurt Airport.
  # Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Eisenach Hauptbahnhof
    lat: 50.9769
    lon: 10.33199
    source: osm
  - kind: airport
    name: Frankfurt Airport (FRA)
    lat: 50.02441
    lon: 8.5552
    source: osm
animals:
  # Ticks: the RKI's TBE risk areas (2026): the districts Schmalkalden-Meiningen, Suhl, Ilm-Kreis,
  # Hildburghausen, Sonneberg, Saalfeld-Rudolstadt and Saale-Orla-Kreis in Thuringia and Kronach in
  # Bavaria (95 of 96 Bavarian districts); not the Wartburgkreis and Gotha at the western end. The
  # federal health agency's advice. Level ours
  list:
    - kind: tick
      name: "Ticks (Lyme disease, tick-borne encephalitis)"
      level: moderate
      basis: "Ticks that carry Lyme disease live all over Germany, in forests and meadows; the Robert Koch Institute lists most districts along the Rennsteig, from Schmalkalden-Meiningen and Suhl to the Saale-Orla district and Kronach, as risk areas for tick-borne encephalitis (TBE), against which a vaccine protects."
      do:
        - "Wear closed shoes, long sleeves and long trousers, the socks pulled over the trouser legs; light clothes show ticks"
        - "Use a tick repellent as its maker directs; it protects only for a while, and not fully"
        - "After the walk, search your body: the hollows of the knees, the groin, the armpits, behind the ears, the head and the hairline"
        - "Remove a tick as soon as you can: grip it by its head close to the skin with tweezers or a tick card, pull it slowly and straight out, then disinfect the bite"
        - "See a doctor if a red ring at least 5 cm across spreads around the bite within 3 to 30 days, or fever and aching follow a bite"
        - "Ask a doctor about the TBE vaccination well before you go: Germany's vaccination committee (STIKO) recommends it for people exposed to ticks in TBE risk areas"
      dont:
        - "Treat the tick with oil or cream, or squeeze it: it may release more germs"
      source: bzga-borreliose
tags: [forest, ridge, history]
notes:
  - >-
    The Rennsteig follows the crest of the Thuringian Forest from the Werra at Hörschel near
    Eisenach over the Großer Inselsberg, past Oberhof, the Großer Beerberg (Thuringia's highest
    summit, just off the path) and Neuhaus am Rennweg, over the Thuringian Slate Mountains and
    through the northern Frankenwald in Bavaria to the Selbitz at Blankenstein. It is first
    recorded in 1330 and lined by about 1,300 historic boundary stones (German Wikipedia).
  - >-
    Stages: the Regionalverbund also gives a six-stage and a 13-stage division; the record keeps
    its eight stages "für Genießer". Its tour text describes slightly different stage ends (e.g.
    stage 2 to the Spießberghaus); the overview's table is the stage source.
  - >-
    Wild camping: no current official source states the rule (Thuringia's forest law requires the
    forest owner's permission to camp outside approved sites, but its current text couldn't be read
    from an official site); the Regionalverbund notes that sleeping in the shelters is not allowed
    and names the Frankenwald trekking site at km 133.6. Tree line: none recorded, the Rennsteig
    stays below about 980 m.
  - >-
    Figures: the eight stages sum to 169 km against 169.3 km; the tour page's schema data gives the
    descent as 2,690 m where its text says 2,439 m (the text is kept).
  - >-
    Map line: the Regionalverbund's tour line, cut at the eight stage ends, guides the OSM matcher;
    every stage 100 % matched and within 5 % of its stated km, 167.7 km against 169.3 km. Highest
    point 976 m (terrain model) near the Großer Beerberg. The terrain model sums about 4,630 m of
    climbing against the stated 2,690 m: it measures the treetops along a forest ridge, and the page
    shows the stated pair.
  - >-
    Data check (2026-11-03): the Regionalverbund's figures against German Wikipedia: length 169.3 km
    against 169.29 km (the Thuringian survey office's measurement), start on the Werra bank at
    Hörschel and finish at the Selbitz bridge in Blankenstein, the white R as waymark: all agree.
    Wikipedia gives no stage figures (the historic "Runst" had six stages). No deviation over 10 %.
