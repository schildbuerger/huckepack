route:
  # built by `python -m pipeline.all westweg`: OSM ways matched to the Westweg relations
  source: osm
  publishable: true
difficulty:
  # no grade is published; our estimate from the official description
  estimated:
    sac: T2
    basis: >-
      Schwarzwald Tourismus describes forest and mountain paths with about 9,000 m of climbing,
      "teilweise ist der Weg nur ein schmaler Pfad", and snow and ice on the heights in winter;
      no exposed or secured passages. That is mountain hiking on good paths (T2), with length and
      climbing the main difficulty.
    source: stg
season:
  # "Beste Jahreszeit: Frühsommer, Sommer oder Herbst. Im Winter ist in den Höhenlagen mit Schnee
  # und vereisten Wegen zu rechnen"; the Feldberg stage page marks May to October
  months: [5, 6, 7, 8, 9, 10]
  text: Early summer to autumn; snow and ice on the heights in winter
  source: stg
sleeping:
  # the official Westweg hosts: hotels, inns and guesthouses, the Karl-Bäuerle-Hütte (a hikers'
  # hut in Dobel), a campsite in Hinterzarten; plus the trekking camps (tent pitches)
  types: [hotel, guesthouse, hut, campsite]
  source: stg
wildCamping:
  status: restricted
  rule: >-
    Tents only at the Black Forest's bookable trekking camps (24 in 2026, May to October, booked at
    trekking-schwarzwald.de), several near the Westweg, e.g. in Dobel (stage 1) and above Forbach
    (stage 2); elsewhere camping in the forest isn't allowed.
  source: naturpark-trekking
access:
  # Pforzheim main station at the start; Karlsruhe/Baden-Baden (north) and EuroAirport
  # Basel-Mulhouse (south) airports. Coordinates from OSM; distances by pipeline/access.py
  - kind: station
    name: Pforzheim Hauptbahnhof
    lat: 48.89398
    lon: 8.70326
    source: osm
  - kind: airport
    name: Karlsruhe/Baden-Baden Airport (FKB)
    lat: 48.77634
    lon: 8.08401
    source: osm
  - kind: airport
    name: EuroAirport Basel-Mulhouse (BSL)
    lat: 47.59914
    lon: 7.53028
    source: osm
tags: [black-forest, forests, ridges, classic, cross-border]
notes:
  - >-
    Official lengths: "rund 285 Kilometer" on the overview, 291 km (western variant, 12 stages)
    and 288 km (eastern, 13 stages) on its variant pages, 290.8 km and 287.1 km on the two route
    pages; the western variant's stage pages add up to 287.1 km. Ascent "knapp 9.000 Höhenmeter"
    on the overview, 7,889 m on the western route page.
  - >-
    Season: the overview recommends early summer to autumn; the western route page marks March to
    October, the Feldberg stage (10) May to October. The record uses May to October.
  - >-
    The stage pages carry no track for download; the map line follows OSM's Westweg relations
    (superroute 62900, Schwarzwaldverein). OSM's section 9 ends in Titisee, so the official stage 9
    (to Hinterzarten) takes it and the start of the western variant's relation.
  - >-
    Route (pipeline, 2026-10-30, Geofabrik extracts): the OSM relations match 98–100 % of every
    stage; the main route on the map line is 281.5 km against 287.1 km from the stage pages.
  - >-
    Water (pipeline, 2026-10-30): 85 drinking water points from OSM; the longest stretch without
    one is 46.1 km (km 3.8–49.9, stages 1–2 from Pforzheim over Dobel to the Murg valley), past
    inns and huts OSM doesn't record as water points.
  - >-
    Ascent: the western stage pages add up to 8,728 m, the western route page says 7,889 m and the
    overview "knapp 9.000"; the terrain model gives about 10,540 m (it measures the treetops; 80 %
    of the route runs through forest).
  - >-
    Tree line (2026-10-30): none in reach. The western variant crosses the Feldberg (1,486 m on the terrain model),
    whose bare summit is mostly the result of clearing and pasture; its natural tree line would lie
    higher (waldwissen.net, "Südschwarzwald: Waldwandel seit 1790"; the botanical literature calls
    the question not fully settled). So no treeLine is recorded.
  - >-
    Data check (2026-10-30). Second source: German Wikipedia (ca. 285 km, laid out in 1900 by the
    Badischer Schwarzwaldverein, red diamond on white, maintained by the Schwarzwaldverein, spring
    to autumn). Its stage list follows an older split of the south into 13 stages; where its stages
    run between the same places as the official ones they agree within 10 %: stages 1–8 (24.7,
    26.0, 19.4, 27.8, 16.9, 16.5, 21.0 and 21.0 km), 9 West (26.5), 10 West (24.5), 9 Ost (26.5),
    and the official stages 11 and 12 West together (58.1 km) against its three stages from the
    Wiedener Eck to Basel (56.5 km). Its "1256 m" is the height range, not the ascent.
