  note: '"Die Baumgrenze liegt allerdings schon bei 1100 m. Grund dafür sind die extremen Witterungsverhältnisse"; the Brocken (1,141 m) is the only German upland summit above a natural tree line'
  source:
    title: "Universität Tübingen, Geowissenschaften: Große Exkursion Mitteldeutschland 2021, Naturraum Harz"
    url: https://uni-tuebingen.de/de/217752
