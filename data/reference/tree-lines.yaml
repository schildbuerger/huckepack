- region: Italy, northern Apennines (Foreste Casentinesi)
  note: 'beech forest up to the ridge: "Sopra i 1400 metri, sino al crinale, domina la faggeta" (park, habitat 9210); a tree line only on the highest peaks from the Cisa pass to the upper Reno valley'
